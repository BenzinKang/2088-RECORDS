input[type=number],input[type=text]{
  width:auto;background:var(--input);color:var(--text);
  border:1px solid var(--border);border-radius:9px;padding:10px 12px;
  outline:none;transition:border-color .2s;
}
select{
  min-width:120px;background:var(--input);color:var(--text);
  border:1px solid var(--border);border-radius:9px;padding:10px 12px;
  outline:none;transition:border-color .2s;
}
input:focus,select:focus{border-color:var(--accent2)}
input[type=number]{width:90px}
button{
  border:1px solid var(--border);border-radius:9px;padding:10px 18px;
  background:var(--button-bg);color:var(--text);font-size:14px;
  cursor:pointer;transition:opacity .2s;
}
button:hover{opacity:.82}
button:disabled{opacity:.4;cursor:not-allowed}
button.ghost{background:transparent}
button.big{font-size:15px;padding:12px 26px}
.status{font-size:12px;padding:4px 12px;border-radius:20px;background:var(--input);border:1px solid var(--border);color:var(--muted)}
.status.ok{background:rgba(88,192,138,.12);border-color:rgba(88,192,138,.45);color:var(--ok)}
body.theme-light .status.ok{background:rgba(46,125,79,.1);border-color:rgba(46,125,79,.4)}
.status.err{background:rgba(224,115,115,.12);border-color:rgba(224,115,115,.45);color:var(--err)}
body.theme-light .status.err{background:rgba(179,64,64,.1);border-color:rgba(179,64,64,.4)}
.status.run{background:rgba(143,184,224,.12);border-color:rgba(143,184,224,.45);color:var(--run)}
body.theme-light .status.run{background:rgba(74,107,138,.1);border-color:rgba(74,107,138,.4)}
.pill{font-size:12px;background:var(--input);border:1px solid var(--border);border-radius:8px;padding:5px 10px;color:var(--muted)}
.pill b{color:var(--text)}
.note{font-size:12.5px;color:var(--muted);margin-top:8px;line-height:1.7}
.warnbox{font-size:12.5px;color:var(--warn);background:rgba(217,164,65,.08);border:1px solid rgba(217,164,65,.35);border-radius:9px;padding:9px 12px;margin-top:10px;display:none}
body.theme-light .warnbox{background:rgba(154,107,26,.07);border-color:rgba(154,107,26,.35)}
.val{font-weight:600;color:var(--accent)}
#log{background:var(--canvas-bg);color:var(--log-text);border:1px solid var(--border);border-radius:12px;padding:14px;font-family:&quot;SF Mono&quot;,Menlo,Consolas,monospace;font-size:11.5px;line-height:1.6;height:260px;overflow-y:auto;white-space:pre-wrap;word-break:break-all}
#log .cmd{color:var(--log-cmd)}
#log .ok{color:var(--ok)}
#log .err{color:var(--err)}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--text);margin-right:0}
.badge{display:inline-block;font-size:11px;padding:3px 9px;border-radius:6px;background:var(--input);border:1px solid var(--border);color:var(--muted);margin-left:6px}
.badge.ok{color:var(--ok);border-color:rgba(88,192,138,.45);background:rgba(88,192,138,.08)}
body.theme-light .badge.ok{border-color:rgba(46,125,79,.4);background:rgba(46,125,79,.07)}
hr.sep{border:none;border-top:1px dashed var(--border);margin:12px 0}

/* ==== 导出确认弹窗(样式与 Test_OSC 下载弹窗一致) ==== */
.download-modal{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(0,0,0,.48);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);opacity:0;visibility:hidden;pointer-events:none;transition:opacity .16s ease,visibility .16s ease}
.download-modal.show{opacity:1;visibility:visible;pointer-events:auto}
.download-dialog{width:min(430px,calc(100vw - 32px));border:1px solid var(--border);border-radius:14px;background:var(--card);box-shadow:0 20px 60px rgba(0,0,0,.35);transform:translateY(8px) scale(.98);transition:transform .16s ease;overflow:hidden}
.download-modal.show .download-dialog{transform:translateY(0) scale(1)}
.download-dialog-header{display:flex;align-items:flex-start;justify-content:space-between;padding:18px 20px 14px;border-bottom:1px solid var(--border)}
.download-dialog-title{font-size:17px;font-weight:650;color:var(--text)}
.download-dialog-subtitle{margin-top:4px;font-size:12px;color:var(--muted)}
.download-close{width:30px;height:30px;padding:0;border:0;background:transparent;color:var(--muted);font-size:23px;line-height:28px;cursor:pointer;border-radius:7px}
.download-close:hover{background:var(--hover);color:var(--text)}
.download-dialog-body{padding:20px}
.download-dialog-body label{display:block;margin-bottom:8px}
.download-dialog-body input{width:100%;box-sizing:border-box}
.download-dialog-preview{margin-top:10px;font-size:12px;color:var(--muted);line-height:1.6;word-break:break-all}
.download-dialog-actions{display:flex;justify-content:flex-end;gap:10px;padding:14px 20px 18px;border-top:1px solid var(--border)}
.download-dialog-actions button{min-width:88px}
button.primary{background:var(--primary-btn);border-color:var(--accent2)}
.download-dialog-body label.chk{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.download-dialog-body label.chk input{width:auto}
.user-set{border-color:var(--ok)!important}
.dl-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.dl-grid label{margin-bottom:8px}
.dl-grid select{width:100%;min-width:0}

/* ===== 立体声模式卡片(可点击开/关) ===== */
.stereo-card{margin:12px 0 4px;border:1px solid var(--border);border-radius:12px;background:var(--card);overflow:hidden;transition:border-color .2s,box-shadow .2s}
.stereo-card.open{border-color:#3d8bff;box-shadow:0 0 0 1px rgba(61,139,255,.28)}
body.theme-light .stereo-card.open{border-color:#2f7fd0;box-shadow:0 0 0 1px rgba(47,127,208,.25)}
.stereo-head{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:transparent;color:var(--text);padding:12px 14px;cursor:pointer;font:inherit}
.stereo-head:hover{background:rgba(61,139,255,.07)}
.stereo-title{font-size:13.5px;font-weight:600;line-height:1.5;flex:1;color:var(--text)}
.stereo-arrow{color:var(--muted);font-size:11px;flex:none;transition:transform .2s ease}
.stereo-card.open .stereo-arrow{transform:rotate(90deg)}
.stereo-body{padding:2px 14px 13px;border-top:1px dashed var(--border)}
.stereo-card:not(.open) .stereo-body{display:none}




/* ===== 运行方式选择 + 引导模式(向导) ===== */
.hidden{display:none!important}
.mode-screen,.guide-screen{position:fixed;inset:0;z-index:900;background:var(--bg);overflow:auto;padding:28px}
.mode-screen{display:flex;align-items:center;justify-content:center}
.mode-card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:38px 32px;width:min(660px,calc(100vw - 48px));text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.35)}
.mode-title{font-size:28px;font-weight:700;margin:0 0 10px}
.mode-sub{color:var(--muted);font-size:15px;margin:0 0 30px}
.mode-btns{display:flex;gap:18px;justify-content:center;flex-wrap:wrap}
.mode-btn{border:1px solid var(--border);background:var(--button-bg);color:var(--text);border-radius:16px;padding:22px 34px;font-size:18px;font-weight:600;cursor:pointer;transition:transform .18s,border-color .18s,box-shadow .18s;min-width:230px}
.mode-btn:hover{transform:translateY(-3px);border-color:var(--accent2);box-shadow:0 14px 34px rgba(0,0,0,.25)}
body.theme-light .mode-btn:hover{box-shadow:0 14px 30px rgba(0,0,0,.10)}
.mode-note{color:var(--muted);font-size:12.5px;margin-top:24px;line-height:1.7}
.back-floating{position:fixed;top:12px;left:12px;z-index:700;border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:10px;padding:8px 14px;font:inherit;font-size:13px;cursor:pointer}
.back-floating:hover{border-color:var(--accent2)}
.guide-screen{z-index:910}
.guide-inner{max-width:900px;margin:0 auto;background:var(--card);border:1px solid var(--border);border-radius:18px;padding:22px 30px 30px}
.guide-head{display:flex;align-items:center;gap:14px;border-bottom:1px dashed var(--border);padding-bottom:12px;margin-bottom:18px}
.guide-head b{font-size:17px}
.guide-step{color:var(--accent);font-size:13px;margin-left:auto}
.guide-actions{display:flex;gap:12px;justify-content:flex-end;margin-top:22px}
.guide-actions button,button.big-cta{border:1px solid var(--border);border-radius:11px;background:var(--button-bg);color:var(--text);padding:11px 26px;font:inherit;font-size:15px;cursor:pointer}
button.primary{background:var(--primary-btn);border-color:var(--accent2)}
.guide-text p{font-size:14.5px;line-height:1.9;color:var(--text);margin:0 0 10px}
.guide-status{font-size:12.5px;color:var(--muted);margin-top:14px;min-height:18px}
.guide-status.err{color:var(--err)}
.guide-h2{font-size:15px;font-weight:700;margin:0 0 12px;color:var(--text)}
.sub-sec{border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin:14px 0}
.sub-sec-title{font-size:13px;font-weight:600;color:var(--accent);margin-bottom:10px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:760px){.row2{grid-template-columns:1fr}}
.ro-item{border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin:8px 0;background:var(--input)}
.ro-item .ro-l{font-size:12px;color:var(--muted);margin-bottom:5px}
.ro-val{font-size:13.5px;color:var(--text);word-break:break-all;min-height:18px}
.au-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 14px}
@media (max-width:760px){.au-grid{grid-template-columns:1fr}}
.lv-live{font-family:&quot;SF Mono&quot;,Menlo,Consolas,monospace;font-size:12px;color:var(--run);min-height:20px;margin-top:10px}
.hint-note{font-size:11.5px;color:var(--muted);line-height:1.7;margin-top:6px}
.cur-cal{font-size:11.5px;color:var(--muted);margin-top:4px;word-break:break-all}


/* ===== 引导模式弹窗(处理中 / 手动修改 / 未合并完成) ===== */
.gd-modal{position:fixed;inset:0;z-index:955;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(0,0,0,.55);opacity:0;visibility:hidden;pointer-events:none;transition:opacity .16s ease,visibility .16s ease;overflow:auto}
.gd-modal.show{opacity:1;visibility:visible;pointer-events:auto}
.gd-dialog{width:min(980px,calc(100vw - 36px));max-height:calc(100vh - 40px);overflow:auto;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:22px 24px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.gd-dialog.gd-small{width:min(420px,calc(100vw - 36px))}
.gd-head{display:flex;align-items:center;gap:12px;border-bottom:1px dashed var(--border);padding-bottom:10px;margin-bottom:14px}
.gd-head b{font-size:16px}
.gd-actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:16px}
.gd-text{font-size:14.5px;line-height:1.8;color:var(--text)}
.g3slot{margin-top:6px}

&lt;/style&gt;
&lt;/head&gt;
&lt;body&gt;


&lt;!-- 运行方式选择:半自动 / 引导 --&gt;
&lt;div class=&quot;mode-screen&quot; id=&quot;modeScreen&quot;&gt;
  &lt;div class=&quot;mode-card&quot;&gt;
    &lt;div class=&quot;mode-title&quot;&gt;REW 自动化处理&lt;/div&gt;
    &lt;div class=&quot;mode-sub&quot;&gt;请选择本次运行方式&lt;/div&gt;
    &lt;div class=&quot;mode-btns&quot;&gt;
      &lt;button class=&quot;mode-btn&quot; id=&quot;btnModeSemi&quot;&gt;半自动模式&lt;/button&gt;
      &lt;button class=&quot;mode-btn&quot; id=&quot;btnModeGuide&quot;&gt;引导模式&lt;/button&gt;
    &lt;/div&gt;
    &lt;div class=&quot;mode-note&quot;&gt;半自动模式：直接进入完整流程面板。&lt;br&gt;引导模式：分四步确认测量并自动完成 EQ 修正流程。&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;

&lt;!-- 半自动模式的返回按钮(左上角,点击回到运行方式选择) --&gt;
&lt;button class=&quot;back-floating&quot; id=&quot;btnBackSemi&quot; style=&quot;display:none&quot;&gt;← 返回&lt;/button&gt;

&lt;!-- 引导模式向导(4 步) --&gt;
&lt;div class=&quot;guide-screen hidden&quot; id=&quot;guideScreen&quot;&gt;
  &lt;div class=&quot;guide-inner&quot;&gt;
    &lt;div class=&quot;guide-head&quot;&gt;
      &lt;button id=&quot;btnGuideBack&quot;&gt;← 返回&lt;/button&gt;
      &lt;b&gt;引导模式&lt;/b&gt;
      &lt;span class=&quot;guide-step&quot; id=&quot;guideStepLabel&quot;&gt;第 1/4 步&lt;/span&gt;
    &lt;/div&gt;

    &lt;!-- 第 1 页 --&gt;
    &lt;div class=&quot;guide-page&quot; id=&quot;guideP1&quot;&gt;
      &lt;div class=&quot;guide-text&quot;&gt;
        &lt;p&gt;校准开始前，请确保 REW 已打开且版本号不低于 5.40。&lt;/p&gt;
        &lt;p&gt;请将测量麦放置于听音位上，确保测量麦咪头高度与音箱高音单元齐平且两只音箱距离听音位距离相等。建议将音箱放置于与听音位成等边三角形的位置上并内倾 30°。&lt;/p&gt;
      &lt;/div&gt;
      &lt;div class=&quot;guide-status&quot; id=&quot;p1RwStatus&quot;&gt;&lt;/div&gt;
      &lt;div class=&quot;guide-actions&quot;&gt;&lt;button class=&quot;primary&quot; id=&quot;btnG1Next&quot;&gt;下一步&lt;/button&gt;&lt;/div&gt;
    &lt;/div&gt;

    &lt;!-- 第 2 页 --&gt;
    &lt;div class=&quot;guide-page hidden&quot; id=&quot;guideP2&quot;&gt;
      &lt;div class=&quot;guide-text&quot;&gt;
        &lt;p&gt;请正确设置 REW 的音频输入与输出设备，并进入 REW 依次测量 L+R 通道、L 通道、R 通道。&lt;/p&gt;
        &lt;p&gt;我们推荐使用 128k 以上的长度。&lt;/p&gt;
        &lt;p&gt;测量时请远离麦克风。&lt;/p&gt;
        &lt;p&gt;因通过 API 控制 REW 以进行自动化扫频测量需要 Pro 升级版授权，本步需要用户手动进入 REW 软件发起扫频。扫频完成后返回该页面处理测量结果。&lt;/p&gt;
        &lt;p&gt;若已完成测量请跳过本步。&lt;/p&gt;
      &lt;/div&gt;
      &lt;div class=&quot;guide-actions&quot;&gt;
        &lt;button id=&quot;btnG2Prev&quot;&gt;上一步&lt;/button&gt;
        &lt;button class=&quot;primary&quot; id=&quot;btnG2Next&quot;&gt;下一步&lt;/button&gt;
      &lt;/div&gt;
    &lt;/div&gt;

    &lt;!-- 第 3 页:确认测量结果(载入&quot;选择测量结果&quot;卡片) --&gt;
    &lt;div class=&quot;guide-page hidden&quot; id=&quot;guideP3&quot;&gt;
      &lt;div class=&quot;guide-h2&quot;&gt;请确认您的测量结果：&lt;/div&gt;
      &lt;div id=&quot;g3slot&quot; class=&quot;g3slot&quot;&gt;&lt;/div&gt;
      &lt;div class=&quot;guide-actions&quot;&gt;
        &lt;button id=&quot;btnG3Prev&quot;&gt;上一步&lt;/button&gt;
        &lt;button class=&quot;primary&quot; id=&quot;btnG3Next&quot;&gt;下一步&lt;/button&gt;
      &lt;/div&gt;
    &lt;/div&gt;

    &lt;!-- 第 4 页 --&gt;
    &lt;div class=&quot;guide-page hidden&quot; id=&quot;guideP4&quot;&gt;
      &lt;div class=&quot;guide-text&quot;&gt;
        &lt;p&gt;已自动计算合适的低频截止与斜率，若需手动修改请点击修改，无需修改则直接点击进入下一步&lt;/p&gt;
      &lt;/div&gt;
      &lt;div class=&quot;guide-status&quot; id=&quot;p4Status&quot;&gt;&lt;/div&gt;
      &lt;div class=&quot;guide-actions&quot;&gt;
        &lt;button id=&quot;btnG4Prev&quot;&gt;上一步&lt;/button&gt;
        &lt;button id=&quot;btnG4Mod&quot;&gt;点击修改&lt;/button&gt;
        &lt;button class=&quot;primary&quot; id=&quot;btnG4Next&quot;&gt;下一步&lt;/button&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;

&lt;!-- 提示弹窗 --&gt;
&lt;div class=&quot;gd-modal&quot; id=&quot;gdAlertModal&quot; aria-hidden=&quot;true&quot;&gt;
  &lt;div class=&quot;gd-dialog gd-small&quot;&gt;
    &lt;div class=&quot;gd-text&quot; id=&quot;gdAlertText&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;gd-actions&quot;&gt;&lt;button class=&quot;primary&quot; id=&quot;gdAlertOk&quot;&gt;确定&lt;/button&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;

&lt;!-- 手动修改弹窗(载入 EQ 目标曲线设置 + 曲线运算 卡片) --&gt;
&lt;div class=&quot;gd-modal&quot; id=&quot;gdModifyModal&quot; aria-hidden=&quot;true&quot;&gt;
  &lt;div class=&quot;gd-dialog&quot;&gt;
    &lt;div class=&quot;gd-head&quot;&gt;&lt;b&gt;手动修改 EQ 目标设置 / 曲线运算&lt;/b&gt;&lt;/div&gt;
    &lt;div id=&quot;gdModifyBody&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;hint-note&quot;&gt;低频截止/斜率等以绿框手动锁定的值不会被自动分析覆盖。&lt;/div&gt;
    &lt;div class=&quot;gd-actions&quot;&gt;&lt;button class=&quot;primary&quot; id=&quot;btnGdModOk&quot;&gt;完成修改&lt;/button&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;

&lt;!-- 处理中弹窗 --&gt;
&lt;div class=&quot;gd-modal&quot; id=&quot;gdProcModal&quot; aria-hidden=&quot;true&quot;&gt;
  &lt;div class=&quot;gd-dialog gd-small&quot; style=&quot;text-align:center&quot;&gt;
    &lt;div class=&quot;gd-text&quot; style=&quot;font-size:17px;font-weight:700&quot;&gt;处理中…&lt;/div&gt;
    &lt;div class=&quot;hint-note&quot; style=&quot;margin-top:8px&quot;&gt;正在一键执行完整流程，请稍候。处理完成后将弹出导出窗口。&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;

&lt;!-- 未合并 IR 完成弹窗 --&gt;
&lt;div class=&quot;gd-modal&quot; id=&quot;gdFinishModal&quot; aria-hidden=&quot;true&quot;&gt;
  &lt;div class=&quot;gd-dialog&quot;&gt;
    &lt;div class=&quot;gd-head&quot;&gt;&lt;b&gt;处理完成&lt;/b&gt;&lt;/div&gt;
    &lt;div class=&quot;gd-text&quot;&gt;流程已完成（未合并 IR）。请选择导出方式下载结果，或点击“返回”回到运行方式选择界面。&lt;/div&gt;
    &lt;div class=&quot;gd-actions&quot; style=&quot;justify-content:center;margin-top:18px&quot;&gt;
      &lt;button id=&quot;gdFinMono&quot;&gt;导出单声道 L+R…&lt;/button&gt;
      &lt;button id=&quot;gdFinStereo&quot;&gt;导出立体声 L/R…&lt;/button&gt;
    &lt;/div&gt;
    &lt;div class=&quot;gd-actions&quot; style=&quot;justify-content:center&quot;&gt;
      &lt;button id=&quot;gdFinClearMono&quot; title=&quot;仅清除 L+R 单声道运算产生的数据,L/R 保留&quot;&gt;清空 L+R 过程数据&lt;/button&gt;
      &lt;button id=&quot;gdFinClearLr&quot; title=&quot;仅清除 L/R 立体声运算产生的数据,L+R 保留&quot;&gt;清空 L/R 过程数据&lt;/button&gt;
    &lt;/div&gt;
    &lt;div class=&quot;gd-actions&quot;&gt;&lt;button id=&quot;gdFinishBack&quot;&gt;返回&lt;/button&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;wrap&quot;&gt;
  &lt;h1&gt;REW 自动化处理&lt;/h1&gt;
  &lt;div class=&quot;sub&quot;&gt;通过 REW REST API (localhost:4735) 操作，运行前请确保REW为V5.40或以上版本并已打开&lt;/div&gt;

  &lt;!-- 运行与连接 --&gt;
  &lt;div class=&quot;card&quot; style=&quot;text-align:center;border-width:2px&quot;&gt;
    &lt;button class=&quot;big&quot; id=&quot;btnRunAll&quot;&gt;▶ 一键执行完整流程&lt;/button&gt;
    &lt;div class=&quot;note&quot;&gt;同时选择 L 和 R 测量,解锁立体声模式,完成后按所选方式导出：合并 IR 则自动弹出立体声导出窗口；不合并 IR 则跳转至步骤 7 的“单声道 L+R”与“立体声 L/R”两个独立导出按钮。&lt;/div&gt;
    &lt;hr class=&quot;sep&quot;&gt;
    &lt;div class=&quot;row&quot;&gt;
      &lt;label&gt;REW API 地址&lt;/label&gt;

    &lt;div class=&quot;download-dialog-body&quot;&gt;
      &lt;div class=&quot;download-dialog-preview&quot; id=&quot;cfText&quot;&gt;&lt;/div&gt;
      &lt;div style=&quot;margin-top:14px&quot;&gt;
        &lt;label for=&quot;cfBase&quot;&gt;REW API 地址&lt;/label&gt;
        &lt;input type=&quot;text&quot; id=&quot;cfBase&quot; placeholder=&quot;例如：http://localhost:4735&quot; autocomplete=&quot;url&quot;&gt;
      &lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;download-dialog-actions&quot;&gt;
      &lt;button id=&quot;cfClose&quot;&gt;关闭&lt;/button&gt;
      &lt;button id=&quot;cfRetry&quot; class=&quot;primary&quot;&gt;重新连接&lt;/button&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;

&lt;script&gt;
&#x27;use strict&#x27;;
const $ = id =&gt; document.getElementById(id);
const S = { A:null, L:null, R:null, target:null, am:null, div:null, mp2:null,
            avg:null, targetLR:null, Lm:null, Rm:null, divL:null, divR:null, mpL:null, mpR:null,
            fullL:null, fullR:null, mpFullL:null, mpFullR:null };
let LAST_LIST = [];
let stereoOpen = false;               // 立体声模式卡片:默认收起(蓝框并显示 L/R 下拉需点击展开)
const chanLast = { L:&#x27;&#x27;, R:&#x27;&#x27; };      // L/R 声道最近一次已接受的选择(「重新选取」回退基准)
let chanFillKey = &#x27;&#x27;;                 // 最近一次 L/R 自动填入所依据的 L+R 测量 uuid
const isStereo = ()=&gt; stereoOpen &amp;&amp; !!(S.L &amp;&amp; S.R);
const CREATED = [];   // 本次会话中流程产生的测量(CAL_ 前缀),用于下载后可选清理
let flowRunning = false;   // 一键流程执行中,暂停自动轮询
let stereoMerged = true;    // 本次立体声流程是否执行 Merge(频率取第 6 步分频点)
let unmergedExported = { mono:false, stereo:false }; // 未合并模式下两类 IR 的导出状态
let lastListKey = &#x27;&#x27;;      // 测量列表指纹,变化时才刷新下拉
let lastVer = &#x27;&#x27;;
// 用户手动修改过的参数(绿框=手动锁定):自动分析不覆盖;Cmd/Ctrl+点击可切换锁定/解锁
const USER_SET = { lfCut:false, lfSlope:false, divLower:false, divUpper:false };
// 处理下限(曲线运算)默认完全跟随低频截止:
//   值 = 低频截止当前填入值(用户手写或系统自动分析得出),
//   锁定状态 = 低频截止锁定状态(截止绿框锁定时处理下限同步绿框,解除后恢复自动)。
// 用户可在处理下限框以更高优先级手动覆盖:直接输入新值(视为手动锁定),或 Cmd+点击切换其自身锁定;
// 手动覆盖后以处理下限自身为准(低频截止后续改动不再覆盖它);再次 Cmd+点击解除其锁定即恢复自动跟随。
function syncDivLower(){
  if(USER_SET.divLower) return;   // 处理下限已被用户手动覆盖,保持其值与锁定
  const lc = $(&#x27;lfCut&#x27;), dl = $(&#x27;divLower&#x27;);
  dl.value = lc.value;
  dl.classList.toggle(&#x27;user-set&#x27;, !!USER_SET.lfCut);
}
function markUserSet(id){ USER_SET[id]=true; $(id).classList.add(&#x27;user-set&#x27;); }
function bindUserSet(ids){
  ids.forEach(id=&gt;{
    $(id).addEventListener(&#x27;input&#x27;, ()=&gt; markUserSet(id));
    $(id).addEventListener(&#x27;change&#x27;, ()=&gt; markUserSet(id));
    // Cmd(mac)/Ctrl(win)+点击:切换锁定状态(绿框=锁定 ⇄ 解锁)。必须在 mousedown 阶段拦截,
    // 否则 macOS 上 select 的原生下拉会在 mousedown 时弹出
    $(id).addEventListener(&#x27;mousedown&#x27;, e=&gt;{
      if(e.metaKey || e.ctrlKey){
        e.preventDefault();
        const now = !USER_SET[id];
        USER_SET[id] = now;
        $(id).classList.toggle(&#x27;user-set&#x27;, now);
        if(id===&#x27;lfCut&#x27; || id===&#x27;divLower&#x27;) syncDivLower();   // 处理下限同步/恢复跟随
        log(now? `${id} 已手动锁定(绿框),不会被自动分析覆盖` : `${id} 已解除锁定,恢复自动分析`,&#x27;ok&#x27;);
      }
    });
  });
  // 斜率是下拉框:点开选择即视为手动意图(即使最终值未变化也锁定)
  $(&#x27;lfSlope&#x27;).addEventListener(&#x27;focus&#x27;, ()=&gt; markUserSet(&#x27;lfSlope&#x27;));
  // 低频截止被填入/变更/解锁时,未手动覆盖的处理下限实时跟随(值与绿框锁定状态)
  $(&#x27;lfCut&#x27;).addEventListener(&#x27;input&#x27;, ()=&gt; syncDivLower());
  $(&#x27;lfCut&#x27;).addEventListener(&#x27;change&#x27;, ()=&gt; syncDivLower());
}
bindUserSet([&#x27;lfCut&#x27;,&#x27;lfSlope&#x27;,&#x27;divLower&#x27;,&#x27;divUpper&#x27;]);
syncDivLower();   // 页面加载:处理下限跟随低频截止当前值(默认 40 Hz)

/* ==== 主题(深色/浅色,与 Test_OSC 主题一致,记住选择) ==== */
function applyTheme(t){ document.body.classList.toggle(&#x27;theme-light&#x27;, t===&#x27;light&#x27;); }

/* ==== Test_OSC 外壳集成接口 ==== */
/* 外壳在加载与切换主题时向 iframe 广播 {type:&#x27;test-osc-theme&#x27;, theme};切换功能页时广播 {type:&#x27;test-osc-stop&#x27;} */
window.addEventListener(&#x27;message&#x27;, (e)=&gt;{
  const d = e.data || {};
  if(d.type===&#x27;test-osc-theme&#x27;){
    const t = d.theme===&#x27;light&#x27; ? &#x27;light&#x27; : &#x27;dark&#x27;;
    applyTheme(t);
    const sel = document.getElementById(&#x27;themeSelect&#x27;);
    if(sel) sel.value = t;
    if(window.parent === window){ try{ localStorage.setItem(&#x27;rewTheme&#x27;, t); }catch(err){} }
  }else if(d.type===&#x27;test-osc-stop&#x27;){
    /* 本模块不播放音频,仅确保导出弹窗收起 */
    const m = document.getElementById(&#x27;downloadModal&#x27;);
    if(m) m.classList.remove(&#x27;show&#x27;);
  }
});
/* ---- 下拉框默认填充(脚本启动即执行,不依赖 REW 连接) ---- */
(function initSelectDefaults(){
  const shapes=[&#x27;Full range&#x27;,&#x27;Bass limited&#x27;,&#x27;Subwoofer&#x27;,&#x27;Driver&#x27;,&#x27;None&#x27;];
  const slopes=[6,12,18,24,30,36,42,48];
  const smooth=[&#x27;1/1&#x27;,&#x27;1/2&#x27;,&#x27;1/3&#x27;,&#x27;1/6&#x27;,&#x27;1/12&#x27;,&#x27;1/24&#x27;,&#x27;1/48&#x27;,&#x27;Var&#x27;,&#x27;Psy&#x27;,&#x27;ERB&#x27;,&#x27;None&#x27;];
  const so=$(&#x27;shape&#x27;);
  if(so &amp;&amp; !so.options.length) so.innerHTML = shapes.map(v=&gt;`&lt;option value=&quot;${v}&quot;&gt;${v}${v===&#x27;Full range&#x27;?&#x27;(全频扬声器)&#x27;:&#x27;&#x27;}&lt;/option&gt;`).join(&#x27;&#x27;);
  const sl=$(&#x27;lfSlope&#x27;);
  if(sl &amp;&amp; !sl.options.length) sl.innerHTML = slopes.map(v=&gt;`&lt;option value=&quot;${v}&quot;&gt;${v}&lt;/option&gt;`).join(&#x27;&#x27;);
  const st=$(&#x27;smoothType&#x27;);
  if(st &amp;&amp; !st.options.length){ st.innerHTML = smooth.map(v=&gt;`&lt;option value=&quot;${v}&quot;&gt;${v}${v===&#x27;Var&#x27;?&#x27;(可变平滑)&#x27;:&#x27;&#x27;}&lt;/option&gt;`).join(&#x27;&#x27;); st.value=&#x27;Var&#x27;; }
  const lr=$(&#x27;lrSmoothType&#x27;);
  if(lr &amp;&amp; !lr.options.length){ lr.innerHTML = smooth.map(v=&gt;`&lt;option value=&quot;${v}&quot;&gt;${v}&lt;/option&gt;`).join(&#x27;&#x27;); lr.value=&#x27;1/6&#x27;; }
})();

/* ---- REW 连接失败弹窗 ---- */
const CONN_FAIL_TEXT = &#x27;REW 连接失败&gt;&lt;,请确认 REW 已打开并启用 REST API 服务(默认端口 4735),且版本不低于 V5.40。&#x27;;
let connFailShown = false;
function showConnFailModal(){
  $(&#x27;cfText&#x27;).textContent = CONN_FAIL_TEXT;
  const cfBase = $(&#x27;cfBase&#x27;);
  if(cfBase) cfBase.value = $(&#x27;base&#x27;).value || &#x27;http://localhost:4735&#x27;;
  if(connFailShown) return;
  connFailShown = true;
  $(&#x27;connFailModal&#x27;).classList.add(&#x27;show&#x27;);
  $(&#x27;connFailModal&#x27;).setAttribute(&#x27;aria-hidden&#x27;,&#x27;false&#x27;);
  if(cfBase) setTimeout(()=&gt;{ cfBase.focus(); cfBase.select(); }, 0);
}
function closeConnFailModal(){
  connFailShown = false;
  $(&#x27;connFailModal&#x27;).classList.remove(&#x27;show&#x27;);
  $(&#x27;connFailModal&#x27;).setAttribute(&#x27;aria-hidden&#x27;,&#x27;true&#x27;);
}
$(&#x27;cfRetry&#x27;).onclick = ()=&gt;{
  const cfBase = $(&#x27;cfBase&#x27;);
  if(cfBase){
    const value = cfBase.value.trim();
    if(value) $(&#x27;base&#x27;).value = value;
  }
  closeConnFailModal();
  connect();
};
$(&#x27;cfBase&#x27;).addEventListener(&#x27;keydown&#x27;, e=&gt;{
  if(e.key === &#x27;Enter&#x27;) $(&#x27;cfRetry&#x27;).click();
});
$(&#x27;cfClose&#x27;).onclick = closeConnFailModal;
$(&#x27;cfCloseX&#x27;).onclick = closeConnFailModal;
$(&#x27;connFailModal&#x27;).addEventListener(&#x27;click&#x27;, e=&gt;{ if(e.target===e.currentTarget) closeConnFailModal(); });

const EMBEDDED = window.parent !== window;   // 嵌入 KoyakaCAL 外壳时为 true
(function initTheme(){
  const sel = document.getElementById(&#x27;themeSelect&#x27;);
  let saved=&#x27;dark&#x27;;
  try{ saved = localStorage.getItem(&#x27;rewTheme&#x27;) || &#x27;dark&#x27;; }catch(e){}
  if(EMBEDDED){
    const ctl = document.getElementById(&#x27;themeCtl&#x27;);
    if(ctl) ctl.style.display = &#x27;none&#x27;;      // 嵌入时隐藏内部主题切换,由外壳统一控制
    applyTheme(saved);                        // 外壳加载后会通过消息同步实际主题
  } else if(sel){
    sel.value = saved; applyTheme(saved);
    sel.onchange = ()=&gt;{ applyTheme(sel.value); try{ localStorage.setItem(&#x27;rewTheme&#x27;, sel.value); }catch(e){} };
  } else {
    applyTheme(&#x27;dark&#x27;);
  }
})();

/* ---------------- 基础 API ---------------- */
function log(msg, cls){
  const t = new Date().toLocaleTimeString(&#x27;zh-CN&#x27;,{hour12:false});
  const line = document.createElement(&#x27;div&#x27;);
  if(cls) line.className = cls;
  line.textContent = `[${t}] ${msg}`;
  $(&#x27;log&#x27;).appendChild(line);
  $(&#x27;log&#x27;).scrollTop = $(&#x27;log&#x27;).scrollHeight;
}
function badge(id, txt, cls){ const b=$(id); b.textContent=txt; b.className=&#x27;badge&#x27;+(cls?&#x27; &#x27;+cls:&#x27;&#x27;); }

async function api(path, {method=&#x27;GET&#x27;, body, raw, quiet}={}){
  const base = $(&#x27;base&#x27;).value.replace(/\/+$/,&#x27;&#x27;);
  const opt = {method};
  if(body!==undefined){ opt.headers={&#x27;Content-Type&#x27;:&#x27;application/json&#x27;}; opt.body=JSON.stringify(body); }
  if(!quiet) log(`${method} ${path}${body!==undefined?&#x27;  &#x27;+JSON.stringify(body).slice(0,220):&#x27;&#x27;}`,&#x27;cmd&#x27;);
  let r;
  try{ r = await fetch(base+path, opt); }
  catch(e){
    if(!quiet) showConnFailModal();
    throw new Error(&#x27;REW 连接失败,请确认 REW 已打开并启用 REST API 服务(默认端口 4735),且版本不低于 V5.40。&#x27;);
  }
  const txt = await r.text();
  let data; try{ data = JSON.parse(txt); }catch{ data = txt; }
  if(!r.ok) throw new Error(`HTTP ${r.status}: ${typeof data===&#x27;string&#x27;?data:JSON.stringify(data).slice(0,300)}`);
  if(!quiet) log(`← ${typeof data===&#x27;string&#x27;?data:JSON.stringify(data).slice(0,260)}`);
  return data;
}

async function setBlocking(on){ await api(&#x27;/application/blocking&#x27;,{method:&#x27;POST&#x27;,body:on}); }

/* 可变平滑:对指定测量应用 REW 可变平滑(Var),写入测量数据 */
async function applyVarSmooth(uuid){
  await smoothMeas(uuid, $(&#x27;smoothType&#x27;).value || &#x27;Var&#x27;);
}

async function listMeasurements(quiet){
  const m = await api(&#x27;/measurements&#x27;,{quiet});
  return Object.entries(m).map(([k,v])=&gt;({idx:+k, ...v})).sort((a,b)=&gt;a.idx-b.idx);
}

/* 从命令返回的 message(JSON 字符串)中提取新建测量的 UUID;失败则用列表差集 */
function detectNew(beforeUUIDs){  /* 同步外层返回 async 内层,支持 detectNew(before)(msg) 调用形式 */
  return async (message)=&gt;{
    let uuid=null, name=null;
    try{
      const j = JSON.parse(message);
      const first = Object.values(j.results||{})[0];
      if(first){ uuid = first.UUID; name = first[&#x27;New measurement&#x27;]; }
    }catch{}
    if(!uuid){
      const now = await listMeasurements();
      const fresh = now.filter(x=&gt;!beforeUUIDs.has(x.uuid));
      if(fresh.length){ uuid = fresh[0].uuid; name = fresh[0].title; }
    }
    if(!uuid) throw new Error(&#x27;无法确定新生成的测量(UUID 未返回且列表无差异)&#x27;);
    return {uuid, name};
  };
}
const uuidSet = async ()=&gt; new Set((await listMeasurements()).map(x=&gt;x.uuid));

/* ---------------- 连接 ---------------- */
$(&#x27;btnConnect&#x27;).onclick = connect;
async function connect(){
  try{
    setConn(&#x27;连接中…&#x27;,&#x27;run&#x27;);
    const v = await api(&#x27;/version&#x27;);
    $(&#x27;verPill&#x27;).style.display=&#x27;&#x27;; $(&#x27;verPill&#x27;).textContent = v.message || JSON.stringify(v);
    await setBlocking($(&#x27;blocking&#x27;).checked);
    await loadShapesAndSlopes();
    await loadMeasurements();
    setConn(&#x27;已连接&gt;w&lt;&#x27;,&#x27;ok&#x27;);
    log(&#x27;连接成功,blocking=&#x27; + $(&#x27;blocking&#x27;).checked,&#x27;ok&#x27;);
  }catch(e){ setConn(&#x27;连接失败&#x27;,&#x27;err&#x27;); log(e.message,&#x27;err&#x27;); }
}
function setConn(t,cls){ const s=$(&#x27;connStatus&#x27;); s.textContent=t; s.className=&#x27;status &#x27;+(cls||&#x27;&#x27;); }
$(&#x27;blocking&#x27;).onchange = ()=&gt; setBlocking($(&#x27;blocking&#x27;).checked).catch(e=&gt;log(e.message,&#x27;err&#x27;));

async function loadShapesAndSlopes(){
  try{
    const shapes = await api(&#x27;/eq/target-shapes&#x27;);
    $(&#x27;shape&#x27;).innerHTML = shapes.map(s=&gt;`&lt;option value=&quot;${s}&quot;&gt;${s}${s===&#x27;Full range&#x27;?&#x27;(全频扬声器)&#x27;:&#x27;&#x27;}&lt;/option&gt;`).join(&#x27;&#x27;);
    $(&#x27;shape&#x27;).value = &#x27;Full range&#x27;;
    const slopes = await api(&#x27;/eq/slopes&#x27;);
    $(&#x27;lfSlope&#x27;).innerHTML = slopes.map(s=&gt;`&lt;option value=&quot;${s}&quot;&gt;${s}&lt;/option&gt;`).join(&#x27;&#x27;);
    $(&#x27;lfSlope&#x27;).value = &#x27;48&#x27;;
    let smoothChoices = [&#x27;1/1&#x27;,&#x27;1/2&#x27;,&#x27;1/3&#x27;,&#x27;1/6&#x27;,&#x27;1/12&#x27;,&#x27;1/24&#x27;,&#x27;1/48&#x27;,&#x27;Var&#x27;,&#x27;Psy&#x27;,&#x27;ERB&#x27;,&#x27;None&#x27;];
    try{ smoothChoices = await api(&#x27;/measurements/frequency-response/smoothing-choices&#x27;); }catch(e){}
    const fmt = v =&gt; `${v}${v===&#x27;Var&#x27;?&#x27;(可变平滑)&#x27;:&#x27;&#x27;}`;
    $(&#x27;smoothType&#x27;).innerHTML = smoothChoices.map(v=&gt;`&lt;option value=&quot;${v}&quot;&gt;${fmt(v)}&lt;/option&gt;`).join(&#x27;&#x27;);
    $(&#x27;smoothType&#x27;).value = &#x27;Var&#x27;;
    $(&#x27;lrSmoothType&#x27;).innerHTML = smoothChoices.map(v=&gt;`&lt;option value=&quot;${v}&quot;&gt;${fmt(v)}&lt;/option&gt;`).join(&#x27;&#x27;);
    $(&#x27;lrSmoothType&#x27;).value = &#x27;1/6&#x27;;
  }catch(e){ log(&#x27;读取目标形状/斜率列表失败: &#x27;+e.message,&#x27;err&#x27;); }
}

/* ---------------- ① 测量列表 ---------------- */
$(&#x27;btnLoad&#x27;).onclick = guard(loadMeasurements);
async function loadMeasurements(){
  const list = await listMeasurements();
  LAST_LIST = list;
  const opts = list.map(m=&gt;`&lt;option value=&quot;${m.uuid}&quot;&gt;${m.idx}. ${esc(m.title)}&lt;/option&gt;`).join(&#x27;&#x27;);
  const sel = $(&#x27;measSel&#x27;);
  const prev = sel.value;
  sel.innerHTML = opts;
  if(prev &amp;&amp; list.some(m=&gt;m.uuid===prev)) sel.value = prev;
  // 默认值:名称含 L+R 且序号最大的测量。注意 innerHTML 重建后 select 会自动选中首项,
  // 因此必须以重建前的 prev 判断“用户是否尚未选择”;手动选择永远优先保留。
  if(!prev || !list.some(m=&gt;m.uuid===sel.value)){
    const lrCands = list.filter(m=&gt;{ const t=(m.title||&#x27;&#x27;); return t.includes(&#x27;L+R&#x27;) &amp;&amp; !t.includes(&#x27;CAL_&#x27;) &amp;&amp; !t.includes(&#x27;-MP&#x27;); });   // 自动选择忽略 CAL_/-MP 数据
    if(lrCands.length){
      const best = lrCands.reduce((a,b)=&gt; (b.idx&gt;a.idx? b:a));
      sel.value = best.uuid;
    }
  }
  for(const [id, keepPrev] of [[&#x27;measSelL&#x27;,true],[&#x27;measSelR&#x27;,true]]){
    const el = $(id); const pv = el.value;
    el.innerHTML = &#x27;&lt;option value=&quot;&quot;&gt;— 未选择 —&lt;/option&gt;&#x27; + opts;
    if(keepPrev &amp;&amp; pv &amp;&amp; list.some(m=&gt;m.uuid===pv)) el.value = pv;
  }
  sel.onchange();          // 触发测量信息刷新;立体声开启且 L+R 变化时自动填入 L/R
  updateStereoMode();
  chanLast.L = $(&#x27;measSelL&#x27;).value;   // 记录刷新后仍生效的声道选择,作为回退基准
  chanLast.R = $(&#x27;measSelR&#x27;).value;
  lastListKey = JSON.stringify(list.map(x=&gt;[x.uuid,x.title,x.idx]));
  log(`已加载 ${list.length} 个测量`,&#x27;ok&#x27;);
}
function updateStereoMode(){
  S.L = findMeas($(&#x27;measSelL&#x27;).value);
  S.R = findMeas($(&#x27;measSelR&#x27;).value);
  const st = isStereo();
  const lr = document.getElementById(&#x27;lrSmoothCtl&#x27;);
  if(lr) lr.style.display = st? &#x27;contents&#x27; : &#x27;none&#x27;;
  updateXoverVisibility();   // 「分频点」仅在立体声模式(卡片开启)时显示
}
let aLast = &#x27;&#x27;;   // L+R 测量最近一次已接受的选择(「重新选择」回退基准)
// 标题判定:自动选择需跳过 CAL_/-MP;手动选择仅对“CAL_ 且非 -MP”弹确认
function isAutoSkipTitle(t){ return t.includes(&#x27;CAL_&#x27;) || t.includes(&#x27;-MP&#x27;); }
function needsCalConfirmTitle(t){ return t.includes(&#x27;CAL_&#x27;) &amp;&amp; !t.includes(&#x27;-MP&#x27;); }
function applySelectA(){
  const u = $(&#x27;measSel&#x27;).value;
  const m = findMeas(u);
  S.A = m;
  aLast = u;
  if(m){
    $(&#x27;measInfo&#x27;).textContent = `UUID: ${m.uuid} | 采样率: ${Math.round(m.sampleRate)} Hz | 范围: ${m.startFreq.toFixed(1)}–${Math.round(m.endFreq)} Hz | 来自: ${m.containingFileName||&#x27;—&#x27;}`;

function esc(s){ return String(s).replace(/[&amp;&lt;&gt;&quot;]/g, c=&gt;({&#x27;&amp;&#x27;:&#x27;&amp;amp;&#x27;,&#x27;&lt;&#x27;:&#x27;&amp;lt;&#x27;,&#x27;&gt;&#x27;:&#x27;&amp;gt;&#x27;,&#x27;&quot;&#x27;:&#x27;&amp;quot;&#x27;}[c])); }

/* ===== 立体声模式:L/R 自动填入 + 声道名称校验弹窗 ===== */
function findMeas(uuid){ return uuid? (LAST_LIST.find(m=&gt;m.uuid===uuid)||null) : null; }
function chanTitle(uuid){ const m = findMeas(uuid); return m? String(m.title||&#x27;&#x27;) : &#x27;&#x27;; }
// 名称校验(基于测量 title):需要弹窗确认时返回文案,否则返回 null(可直接接受)
function chanWarn(ch, title){
  if(!title) return null;
  if(title.includes(&#x27;L+R&#x27;)) return &#x27;REW 显示该测量结果为 L+R 测量，确定要填入吗？&#x27;;
  if(ch===&#x27;L&#x27; &amp;&amp; title.includes(&#x27;R&#x27;) &amp;&amp; !title.includes(&#x27;L+&#x27;)) return &#x27;REW 显示该测量结果为右声道测量，确定要填入左声道数据吗？&#x27;;
  if(ch===&#x27;R&#x27; &amp;&amp; title.includes(&#x27;L&#x27;) &amp;&amp; !title.includes(&#x27;+R&#x27;)) return &#x27;REW 显示该测量结果为左声道测量，确定要填入右声道数据吗？&#x27;;
  return null;
}
function setChanAuto(ch, uuid){
  const sel = ch===&#x27;L&#x27;? $(&#x27;measSelL&#x27;) : $(&#x27;measSelR&#x27;);
  if(!uuid) return;
  if(![...sel.options].some(o=&gt;o.value===uuid)) return;
  if(sel.value === uuid) return;
  sel.value = uuid;
  chanLast[ch] = uuid;   // 自动填入值同样作为回退基准
}
// 立体声开启时:从当前 L+R 测量出发,按序号递增方向找最近的 L / R 测量并自动选中
function autoFillStereoChannels(){
  if(!stereoOpen) return;
  const baseUuid = $(&#x27;measSel&#x27;).value;
  const base = findMeas(baseUuid);
  if(!base) return;
  if(chanFillKey === baseUuid) return;   // L+R 依据未变:保留用户手动选择
  const after = LAST_LIST.filter(m=&gt;m.idx&gt;base.idx).sort((a,b)=&gt;a.idx-b.idx);
  const t = m =&gt; String(m.title||&#x27;&#x27;);
  const notProc = m =&gt; !t(m).includes(&#x27;CAL_&#x27;) &amp;&amp; !t(m).includes(&#x27;-MP&#x27;);
  const lCand = after.find(m=&gt; notProc(m) &amp;&amp; t(m).includes(&#x27;L&#x27;) &amp;&amp; !t(m).includes(&#x27;+R&#x27;));
  const rPool = lCand? after.filter(m=&gt;m.uuid!==lCand.uuid) : after;
  const rCand = rPool.find(m=&gt; notProc(m) &amp;&amp; t(m).includes(&#x27;R&#x27;) &amp;&amp; !t(m).includes(&#x27;L+&#x27;));
  if(lCand) setChanAuto(&#x27;L&#x27;, lCand.uuid);
  if(rCand) setChanAuto(&#x27;R&#x27;, rCand.uuid);
  if(lCand || rCand){ chanFillKey = baseUuid; updateStereoMode(); }
}
function setCardState(open){

  $(&#x27;stereoHead&#x27;).setAttribute(&#x27;aria-expanded&#x27;, String(stereoOpen));

}
function onChanChange(ch){

}

function maxGainParam(){ return $(&#x27;maxGainOn&#x27;).checked? {maxGain: $(&#x27;maxGain&#x27;).value.trim() || &#x27;6&#x27;} : {}; }
function xoverHz(){ return ($(&#x27;divXover&#x27;).value||&#x27;&#x27;).trim() || &#x27;200&#x27;; }   // 立体声分频点(默认 200 Hz,留空按 200)
/* 曲线运算卡片的「分频点」:仅在用户打开立体声模式时显示,关闭/未启用时隐藏 */

async function runStereoBranch(mergeIR=true){
  if(!S.L || !S.R) throw new Error(&#x27;请先选择 L 和 R 测量&#x27;);
  stereoMerged = !!mergeIR;
  unmergedExported = { mono:false, stereo:false };
  const lrT = $(&#x27;lrSmoothType&#x27;).value || &#x27;1/6&#x27;;
  const xov = xoverHz();   // 立体声分频点:默认 200,取第 6 步填写值
  log(`立体声分支:L/R 平滑 ${lrT} → 均方根平均 → 目标(全频,低频截止/斜率同上方填写)→ Target/L-m、Target/R-m(下限 ${xov} Hz=分频点)`,&#x27;cmd&#x27;);
  await smoothMeas(S.L.uuid, lrT);
  await smoothMeas(S.R.uuid, lrT);
  S.avg = await rmsAverage(S.L.uuid, S.R.uuid);
  log(`L/R 均方根平均:${S.avg.name}`,&#x27;ok&#x27;);
  await applyTargetSettings(S.avg.uuid, &#x27;Full range&#x27;, +$(&#x27;lfCut&#x27;).value, +$(&#x27;lfSlope&#x27;).value);   // L/R 均方根平均目标也使用上方填写的低频截止与斜率
  await calcTargetLevel(S.avg.uuid);
  S.targetLR = await generateTargetMeas(S.avg.uuid);
  S.Lm = await makeMinPhase(S.L.uuid, (S.L.title||&#x27;L&#x27;)+&#x27;-m&#x27;);
  S.Rm = await makeMinPhase(S.R.uuid, (S.R.title||&#x27;R&#x27;)+&#x27;-m&#x27;);
  const upLR = $(&#x27;divUpper&#x27;).value.trim();   // 立体声分支:上限对 L/R 两次除法生效
  if(upLR &amp;&amp; +upLR &lt;= +xov) throw new Error(`立体声 L/R 分支:处理上限(${upLR} Hz)必须大于分频点 ${xov} Hz`);
  S.divL = await arithmeticDiv(S.targetLR.uuid, S.Lm.uuid, Object.assign({lowerLimit:xov}, maxGainParam(), upLR? {upperLimit: upLR}:{}), &#x27; (L)&#x27;);
  S.divR = await arithmeticDiv(S.targetLR.uuid, S.Rm.uuid, Object.assign({lowerLimit:xov}, maxGainParam(), upLR? {upperLimit: upLR}:{}), &#x27; (R)&#x27;);
  S.mpL = await makeMinPhase(S.divL.uuid, S.divL.name+&#x27;-MP&#x27;);
  S.mpR = await makeMinPhase(S.divR.uuid, S.divR.name+&#x27;-MP&#x27;);

  if(mergeIR){
    // 合并:REW &quot;Merge B to A&quot; 语义为 B 提供分频点以下、A 保留分频点以上
    // 因此 A=L/R 修正(高频段),B=L+R 低音修正(低频段);mergeFrequency 取第 6 步分频点
    S.fullL = await arithmeticMerge(S.mpL.uuid, S.mp2.uuid, xov, &#x27; (L)&#x27;);
    S.fullR = await arithmeticMerge(S.mpR.uuid, S.mp2.uuid, xov, &#x27; (R)&#x27;);
    S.mpFullL = await makeMinPhase(S.fullL.uuid, S.fullL.name+&#x27;-MP&#x27;);
    S.mpFullR = await makeMinPhase(S.fullR.uuid, S.fullR.name+&#x27;-MP&#x27;);
    $(&#x27;btnExportStereo&#x27;).dataset.exportMode = &#x27;stereo&#x27;;
    log(`立体声分支完成:已在 ${xov} Hz(分频点)合并低音与 L/R 修正 → ${S.mpFullL.name}(左)/ ${S.mpFullR.name}(右)`,&#x27;ok&#x27;);
  }else{
    // 不合并:保留 L+R 低音修正(S.mp2)与独立 L/R 立体声修正(S.mpL/S.mpR)
    S.fullL = null; S.fullR = null; S.mpFullL = null; S.mpFullR = null;
    $(&#x27;btnExportStereo&#x27;).dataset.exportMode = &#x27;stereoUnmerged&#x27;;
    log(`立体声分支完成:未执行 Merge，分别保留单声道 L+R 修正 → ${S.mp2.name}；立体声 L/R 修正 → ${S.mpL.name}(左)/ ${S.mpR.name}(右)`,&#x27;ok&#x27;);
  }
  $(&#x27;btnExport2&#x27;).style.display=&#x27;&#x27;;
  $(&#x27;btnExportStereo&#x27;).style.display=&#x27;&#x27;;
}

async function arithmeticMerge(uuidA, uuidB, mergeFrequency, suffix){

    processName:&#x27;Arithmetic&#x27;,

/* ---------------- ② 低频滚降自动分析 ---------------- */
function medianOf(arr){ if(!arr.length) return NaN; const x=[...arr].sort((p,q)=&gt;p-q); return x[(x.length-1)&gt;&gt;1]; }
async function autoAnalyzeLF(){
  const u = needA();
  const d = await api(`/measurements/${u}/frequency-response?unit=SPL`);
  const bytes = Uint8Array.from(atob(d.magnitude), c=&gt;c.charCodeAt(0));
  const n = bytes.length&gt;&gt;2;
  const f0 = +d.startFreq, ppo = +d.ppo;
  const dv = new DataView(bytes.buffer);
  const freqs=[], mags=[];
  for(let i=0;i&lt;n;i++){
    const v = dv.getFloat32(i*4,false);
    if(!Number.isNaN(v)){ freqs.push(f0*Math.pow(2,i/ppo)); mags.push(v); }
  }
  const M = freqs.length;
  // 1/6 倍频程滑动平均(双指针)
  const sF=new Array(M), sV=new Array(M);
  let a=0, b=0;
  for(let i=0;i&lt;M;i++){
    const lo=freqs[i]*Math.pow(2,-1/12), hi=freqs[i]*Math.pow(2,1/12);
    while(a&lt;M &amp;&amp; freqs[a]&lt;lo) a++;
    if(b&lt;i+1) b=i+1;
    while(b&lt;M &amp;&amp; freqs[b]&lt;=hi) b++;
    let sum=0; for(let k=a;k&lt;b;k++) sum+=mags[k];
    sF[i]=freqs[i]; sV[i]=sum/(b-a);
  }
  const idxOf = f =&gt; Math.max(0, Math.min(M-1, Math.round(Math.log(f/sF[0])/Math.log(2)*ppo)));
  // 施罗德(过渡)频率估计:1/1 倍频程频带内峰谷差随频率上升而减小,
  // 取从低到高第一个「自身与下一个倍频带峰谷差均 ≤ 4dB」的倍频程中心频率
  const bandP2P = (f1,f2)=&gt;{ let lo=Infinity, hi=-Infinity, cnt=0;
    for(let i=0;i&lt;M;i++) if(sF[i]&gt;=f1&amp;&amp;sF[i]&lt;=f2){ if(sV[i]&lt;lo)lo=sV[i]; if(sV[i]&gt;hi)hi=sV[i]; cnt++; }
    return cnt&gt;=3? (hi-lo) : null; };
  const centers=[31.5,63,125,250,500,1000];
  let fsch=null;
  for(let i=0;i&lt;centers.length-1;i++){
    const v1=bandP2P(centers[i]/Math.SQRT2, centers[i]*Math.SQRT2);
    const v2=bandP2P(centers[i+1]/Math.SQRT2, centers[i+1]*Math.SQRT2);
    if(v1!==null &amp;&amp; v2!==null &amp;&amp; v1&lt;=4 &amp;&amp; v2&lt;=4){ fsch=centers[i]; break; }
  }
  if(fsch===null) fsch=250;
  // 基准线:施罗德频率以上频率的平均值
  let refSum=0, refCnt=0;
  for(let i=0;i&lt;M;i++) if(sF[i]&gt;=fsch){ refSum+=sV[i]; refCnt++; }
  const ref = refCnt? refSum/refCnt : NaN;
  if(!isFinite(ref)) throw new Error(&#x27;频响数据不足,无法分析&#x27;);
  // 低频截止:从 10Hz 向高频方向逐点比较,频响到达基准线 -3dB(连续两点)处
  let f3=null, i3=-1;
  for(let i=0;i&lt;M-1;i++){
    if(sF[i]&lt;10) continue;
    if(sV[i]&gt;=ref-3 &amp;&amp; sV[i+1]&gt;=ref-3){ f3=sF[i]; i3=i; break; }
  }
  if(f3===null){
    $(&#x27;lfInfo&#x27;).textContent = &#x27;未检测到明显的低频滚降(响应在 10Hz 以上未跌至基准线 -3dB),已保留当前截止/斜率设置。&#x27;;
    log(&#x27;低频分析:未检测到明显滚降,保持当前设置&#x27;,&#x27;err&#x27;);
    syncDivLower();
    return null;
  }
  const cutoff = Math.round(Math.min(150, Math.max(15, f3)));
  // -6dB / -12dB:从截止点向低频方向逐点比较
  let f6=null, f12=null;
  for(let i=i3;i&gt;=0;i--){
    if(sF[i] &lt; f3*0.15) break;
    if(f6===null &amp;&amp; sV[i]&lt;=ref-6) f6=sF[i];
    if(f12===null &amp;&amp; sV[i]&lt;=ref-12){ f12=sF[i]; break; }
  }
  // 斜率:-3dB 与 -12dB 两点连线(9dB)优先,否则 -3dB 与 -6dB(3dB)
  const allowed=[6,12,18,24,30,36,42,48];
  let slopeOut=null, slopeRaw=null;
  if(f12!==null &amp;&amp; f12&lt;f3){
    slopeRaw = 9/Math.log2(f3/f12);
  } else if(f6!==null &amp;&amp; f6&lt;f3){
    slopeRaw = 3/Math.log2(f3/f6);
  }
  if(slopeRaw!==null) slopeOut = allowed.reduce((p,c)=&gt;Math.abs(c-slopeRaw)&lt;Math.abs(p-slopeRaw)?c:p);
  // 填入:截止与斜率仅在用户未手动修改时写入;处理下限未手动覆盖时跟随 EQ 低频截止(值与锁定状态)
  if(!USER_SET.lfCut) $(&#x27;lfCut&#x27;).value = cutoff;
  if(slopeOut!==null &amp;&amp; !USER_SET.lfSlope) $(&#x27;lfSlope&#x27;).value = String(slopeOut);
  syncDivLower();
  const upper = Math.min(20000, Math.floor((S.A &amp;&amp; S.A.endFreq) || 20000));
  if(!USER_SET.divUpper) $(&#x27;divUpper&#x27;).value = upper;
  const parts=[&#x27;施罗德频率估计 &#x27;+fsch+&#x27; Hz&#x27;,&#x27;基准线 &#x27;+ref.toFixed(1)+&#x27; dB&#x27;,&#x27;-3dB 截止 &#x27;+f3.toFixed(1)+&#x27; Hz&#x27;];
  if(f6!==null) parts.push(&#x27;-6dB &#x27;+f6.toFixed(1)+&#x27; Hz&#x27;);
  if(f12!==null) parts.push(&#x27;-12dB &#x27;+f12.toFixed(1)+&#x27; Hz&#x27;);
  if(slopeRaw!==null) parts.push(&#x27;拟合斜率 &#x27;+slopeRaw.toFixed(1)+&#x27; dB/oct → 取整 &#x27;+slopeOut+&#x27; dB/oct&#x27;);
  if(USER_SET.divLower){ parts.push(&#x27;处理下限保持手动锁定 &#x27;+$(&#x27;divLower&#x27;).value+&#x27; Hz,未被自动覆盖&#x27;); }
  else{ parts.push(&#x27;处理下限已同步为截止 &#x27;+$(&#x27;lfCut&#x27;).value+&#x27; Hz&#x27;+(USER_SET.lfCut?&#x27;(截止手动锁定)&#x27;:&#x27;(自动)&#x27;)); }
  const summary = &#x27;低频分析:&#x27;+parts.join(&#x27;;&#x27;)+&#x27;。&#x27;;
  $(&#x27;lfInfo&#x27;).textContent = summary;
  log(&#x27;低频分析完成:&#x27;+summary,&#x27;ok&#x27;);
  return {cutoff, slope: slopeOut, lower: +($(&#x27;divLower&#x27;).value || $(&#x27;lfCut&#x27;).value), upper};
}

async function fetchIRData(uuid){
  const ir = await api(`/measurements/${uuid}/impulse-response?samplerate=${$(&#x27;sr&#x27;).value}&amp;windowed=${$(&#x27;applyWin&#x27;).checked}&amp;normalised=false`);
  const bytes = Uint8Array.from(atob(ir.data), c=&gt;c.charCodeAt(0));
  const n = bytes.length&gt;&gt;2;
  const f = new DataView(bytes.buffer);
  let peak=0, peakIdx=0;
  const samples = new Float32Array(n);
  for(let i=0;i&lt;n;i++){ const v=f.getFloat32(i*4,false); samples[i]=v; const a=Math.abs(v); if(a&gt;peak){ peak=a; peakIdx=i; } }
  return {samples, n, peak, peakIdx, sampleRate:+ir.sampleRate, startTime:+ir.startTime};
}

    } else cw.style.display=&#x27;none&#x27;;
  }
}

async function doExport(){
  if(EXPORT.mode===&#x27;stereo&#x27;){ if(!S.mpFullL || !S.mpFullR) throw new Error(&#x27;立体声结果不存在,请先执行完整流程&#x27;); }
  else if(EXPORT.mode===&#x27;stereoUnmerged&#x27;){ if(!S.mpL || !S.mpR) throw new Error(&#x27;未合并的 L/R 立体声结果不存在,请先执行完整流程&#x27;); }
  else if(!S.mp2) throw new Error(&#x27;请先执行步骤 7 生成结果的最小相位副本&#x27;);
  const fname = exportFileName();
  if(!irCache || irCache.key!==exportKey()) await fetchIRForModal();
  const bits = $(&#x27;bits&#x27;).value;
  let wav, infoTxt;
  if(EXPORT.mode===&#x27;stereo&#x27; || EXPORT.mode===&#x27;stereoUnmerged&#x27;){
    const {L,R} = irCache;
    // 两声道用同一裁剪点(较早的峰值),保持左右时间一致
    const start = Math.min(L.peakIdx, R.peakIdx);
    const N = Math.max(L.n, R.n) - start;
    const Lp = new Float32Array(N); Lp.set(L.samples.subarray(start, start+N));
    const Rp = new Float32Array(N); Rp.set(R.samples.subarray(start, start+N));
    wav = buildWav(Lp, +bits, Rp);
    infoTxt = `${EXPORT.mode===&#x27;stereoUnmerged&#x27;?&#x27;立体声 L/R&#x27;:&#x27;立体声 2ch&#x27;} | L 峰值 ${L.peak.toFixed(3)} | R 峰值 ${R.peak.toFixed(3)} | ${N} 样本 / ${(N/L.sampleRate).toFixed(2)}s @ ${Math.round(L.sampleRate)}Hz | 已裁剪峰值前空白`;
  } else {
    const c = irCache.mono;
    const t = c.samples.subarray(c.peakIdx);
    wav = buildWav(t, +bits);
    infoTxt = `${t.length} 样本 / ${(t.length/c.sampleRate).toFixed(2)}s @ ${Math.round(c.sampleRate)}Hz | 峰值 ${c.peak.toFixed(3)} | 已裁剪峰值前空白 ${(c.peakIdx/c.sampleRate*1000).toFixed(1)} ms`;
  }
  const url = URL.createObjectURL(new Blob([wav], {type:&#x27;audio/wav&#x27;}));
  const aEl = document.createElement(&#x27;a&#x27;);
  aEl.href=url; aEl.download=fname; aEl.click();
  setTimeout(()=&gt;URL.revokeObjectURL(url), 4000);
  $(&#x27;wavRow&#x27;).style.display=&#x27;&#x27;;
  $(&#x27;wavPill&#x27;).innerHTML = `&lt;b&gt;${esc(fname)}&lt;/b&gt; | ${infoTxt}`;
  log(`WAV 已生成并下载: ${fname} (${wav.byteLength} 字节)`,&#x27;ok&#x27;);
  if($(&#x27;alsoTxt&#x27;).checked){
    const base = fname.replace(/\.wav$/i,&#x27;&#x27;);
    await exportTxtCurves(base);
  }

  // 合并/单声道流程:导出完成后询问整批清理。
  // 未合并立体声:每次只按当前导出分支(单声道 L+R / 立体声 L/R)定向询问,仅清除该分支,保留另一分支供后续导出。
  if(stereoMerged){

/* ---- txt 修正曲线导出(REW 文本格式:频率/声压级/相位) ---- */
async function fetchFR(uuid){
  const d = await api(`/measurements/${uuid}/frequency-response?unit=SPL`);
  const mb = Uint8Array.from(atob(d.magnitude), c=&gt;c.charCodeAt(0));
  const pb = Uint8Array.from(atob(d.phase), c=&gt;c.charCodeAt(0));
  const n = mb.length&gt;&gt;2;
  const mdv = new DataView(mb.buffer), pdv = new DataView(pb.buffer);
  const f0 = +d.startFreq, ppo = +d.ppo;
  const rows = [];
  for(let i=0;i&lt;n;i++){
    const f = f0*Math.pow(2,i/ppo);
    const m = mdv.getFloat32(i*4,false), p = pdv.getFloat32(i*4,false);
    if(!Number.isNaN(m) &amp;&amp; !Number.isNaN(p)) rows.push([f,m,p]);
  }
  return rows;
}
function frToTxt(rows){
  let t = &#x27;Frequency (Hz)\tSPL (dB)\tPhase (deg)\n&#x27;;
  for(const [f,m,p] of rows) t += `${f.toFixed(4)}\t${m.toFixed(2)}\t${p.toFixed(2)}\n`;
  return t;
}
function downloadText(name, text){
  const url = URL.createObjectURL(new Blob([text], {type:&#x27;text/plain&#x27;}));
  const aEl = document.createElement(&#x27;a&#x27;);
  aEl.href=url; aEl.download=name; aEl.click();
  setTimeout(()=&gt;URL.revokeObjectURL(url), 4000);
}

function buildWav(samples, bits, samplesR){
  const stereo = !!samplesR;
  let L = samples, R = samplesR;
  const n0 = stereo? Math.max(L.length, R.length) : L.length;
  if(stereo &amp;&amp; (L.length!==n0 || R.length!==n0)){
    const La=new Float32Array(n0); La.set(L); L=La;
    const Ra=new Float32Array(n0); Ra.set(R); R=Ra;
  }
  const n = n0, ch = stereo? 2 : 1;
  const isFloat = bits===32, bytesPer = bits&gt;&gt;3;
  const dataSize = n*bytesPer*ch, buf = new ArrayBuffer(44+dataSize), v = new DataView(buf);
  const ws=(o,s)=&gt;{for(let i=0;i&lt;s.length;i++)v.setUint8(o+i,s.charCodeAt(i));};
  ws(0,&#x27;RIFF&#x27;); v.setUint32(4,36+dataSize,true); ws(8,&#x27;WAVE&#x27;);
  ws(12,&#x27;fmt &#x27;); v.setUint32(16,16,true); v.setUint16(20,isFloat?3:1,true); v.setUint16(22,ch,true);
  v.setUint32(24,parseInt($(&#x27;sr&#x27;).value,10),true); v.setUint32(28,parseInt($(&#x27;sr&#x27;).value,10)*ch*bytesPer,true);
  v.setUint16(32,ch*bytesPer,true); v.setUint16(34,bits,true);
  ws(36,&#x27;data&#x27;); v.setUint32(40,dataSize,true);
  let o=44;
  const wr = val=&gt;{
    if(isFloat){ v.setFloat32(o,val,true); o+=4; }
    else if(bits===16){ v.setInt16(o,Math.round(Math.max(-1,Math.min(1,val))*32767),true); o+=2; }
    else { const x=Math.round(Math.max(-1,Math.min(1,val))*8388607); v.setUint8(o,x&amp;255); v.setUint8(o+1,(x&gt;&gt;8)&amp;255); v.setUint8(o+2,(x&gt;&gt;16)&amp;255); o+=3; }
  };
  for(let i=0;i&lt;n;i++){ wr(L[i]); if(stereo) wr(R[i]); }
  return buf;
}

    const v = await api(&#x27;/version&#x27;,{quiet:true});
    const ver = (v &amp;&amp; v.message) || &#x27;&#x27;;
    closeConnFailModal();   // 连接正常时,若断连提示弹窗仍开着则自动关闭
    if($(&#x27;connStatus&#x27;).textContent !== &#x27;已连接&gt;w&lt;&#x27;){
      setConn(&#x27;已连接&gt;w&lt;&#x27;,&#x27;ok&#x27;);
      $(&#x27;verPill&#x27;).style.display=&#x27;&#x27;; $(&#x27;verPill&#x27;).textContent = ver;
      log(&#x27;REW 已连接&#x27;,&#x27;ok&#x27;);
    } else if(ver !== lastVer){ $(&#x27;verPill&#x27;).textContent = ver; }
    lastVer = ver;
    const list = await listMeasurements(true);
    const key = JSON.stringify(list.map(x=&gt;[x.uuid,x.title,x.idx]));
    if(key !== lastListKey) await loadMeasurements();   // 列表有变化才刷新下拉
  }catch(e){
    // 使用过程中连接断开:与手动连接失败一样弹出提示(已弹出则不重复)
    if($(&#x27;connStatus&#x27;).textContent === &#x27;已连接&gt;w&lt;&#x27;){ setConn(&#x27;连接失败&#x27;,&#x27;err&#x27;); log(&#x27;与 REW 失去连接&#x27;,&#x27;err&#x27;); }
    showConnFailModal();
  }
}
setInterval(pollOnce, 3000);



/* ==============================================================
   运行方式选择 + 引导模式(4 步向导)
   - 复用主面板原始卡片(移动挂载/还原)
   - 步骤 4 下一步 = 一键执行完整流程;通过 runAll 钩子插入
     “处理中”提示与未合并完成弹窗
   ============================================================== */
let guideStep = 1;
let kGuideHookAfterMerge = null;    // (mergeIR)=&gt;Promise
let kGuideHookBeforeFinal = null;   // (stereo,mergeIR)=&gt;Promise&lt;handled&gt;
let kGuideHookFinished = null;      // ()=&gt;Promise(在 finally 中执行)
const g = id =&gt; document.getElementById(id);

/* ---- 卡片移动挂载辅助 ---- */
const gkMoves = [];
function moveToSlot(el, slot){
  if(!el || !slot) return;
  gkMoves.push({ el, parent: el.parentNode, next: el.nextSibling });
  slot.appendChild(el);
}
function restoreMoves(){
  while(gkMoves.length){
    const m = gkMoves.pop();
    if(m.el &amp;&amp; m.parent) m.parent.insertBefore(m.el, m.next);
  }
}
function cardOf(childId){
  const el = g(childId);
  return el ? el.closest(&#x27;.card&#x27;) : null;
}

/* ---- 弹窗控制 ---- */
function showGd(id){ const m = g(id); if(m){ m.classList.add(&#x27;show&#x27;); m.setAttribute(&#x27;aria-hidden&#x27;,&#x27;false&#x27;); } }
function hideGd(id){ const m = g(id); if(m){ m.classList.remove(&#x27;show&#x27;); m.setAttribute(&#x27;aria-hidden&#x27;,&#x27;true&#x27;); } }

/* ---- 模式切换 / 返回 ---- */
function clearGuideHooks(){
  kGuideHookAfterMerge = null;
  kGuideHookBeforeFinal = null;
  kGuideHookFinished = null;
}
function stopGuideState(){
  clearGuideHooks();
  hideGd(&#x27;gdModifyModal&#x27;); hideGd(&#x27;gdProcModal&#x27;); hideGd(&#x27;gdFinishModal&#x27;);
  restoreMoves();
}
function backToModeSelect(){
  stopGuideState();
  g(&#x27;guideScreen&#x27;).classList.add(&#x27;hidden&#x27;);
  g(&#x27;modeScreen&#x27;).classList.remove(&#x27;hidden&#x27;);
  g(&#x27;btnBackSemi&#x27;).style.display = &#x27;none&#x27;;
  log(&#x27;已返回运行方式选择&#x27;,&#x27;ok&#x27;);
}
function enterSemi(){
  stopGuideState();
  g(&#x27;guideScreen&#x27;).classList.add(&#x27;hidden&#x27;);
  g(&#x27;modeScreen&#x27;).classList.add(&#x27;hidden&#x27;);
  g(&#x27;btnBackSemi&#x27;).style.display = &#x27;&#x27;;
  log(&#x27;已进入半自动模式&#x27;,&#x27;ok&#x27;);
}
function enterGuide(){
  stopGuideState();
  g(&#x27;modeScreen&#x27;).classList.add(&#x27;hidden&#x27;);
  g(&#x27;guideScreen&#x27;).classList.remove(&#x27;hidden&#x27;);
  g(&#x27;btnBackSemi&#x27;).style.display = &#x27;none&#x27;;
  showGuideStep(1);
}
$(&#x27;btnModeSemi&#x27;).onclick = enterSemi;
$(&#x27;btnModeGuide&#x27;).onclick = enterGuide;
$(&#x27;btnGuideBack&#x27;).onclick = backToModeSelect;
$(&#x27;btnBackSemi&#x27;).onclick = backToModeSelect;

/* ---- 页面状态提示(第 1 页) ---- */
const qApi = async (p, o) =&gt; { try { return {ok:true, data: await api(p, Object.assign({quiet:true}, o||{}))}; } catch(e){ return {ok:false, msg:e.message}; } };
async function refreshP1Status(){
  const el = g(&#x27;p1RwStatus&#x27;);
  el.classList.remove(&#x27;err&#x27;);
  const v = await qApi(&#x27;/version&#x27;);
  const a = await qApi(&#x27;/audio&#x27;);
  if(!v.ok){ el.textContent = &#x27;REW 未连接：请确认 REW 已打开并启用了 API 服务(localhost:4735)。&#x27;; el.classList.add(&#x27;err&#x27;); return; }
  const ver = (v.data &amp;&amp; (v.data.message || v.data.version)) || JSON.stringify(v.data);
  let audioTxt = &#x27;&#x27;;
  if(a.ok &amp;&amp; a.data &amp;&amp; typeof a.data===&#x27;object&#x27;){
    audioTxt = ` | 音频: ${a.data.enabled===false?&#x27;未启用&#x27;:&#x27;已启用&#x27;}${a.data.ready? &#x27;·就绪&#x27; : (a.data.ready===false?&#x27;·未就绪&#x27;:&#x27;&#x27;)}`;
  }
  el.textContent = &#x27;REW: &#x27; + ver + audioTxt;
}

/* ---- 步骤切换 ---- */
function showGuideStep(n){
  guideStep = n;
  for(let i=1;i&lt;=4;i++) g(&#x27;guideP&#x27;+i).classList.toggle(&#x27;hidden&#x27;, i!==n);
  g(&#x27;guideStepLabel&#x27;).textContent = &#x27;第 &#x27;+n+&#x27;/4 步&#x27;;
  if(n===1){ restoreMoves(); refreshP1Status(); }
  else if(n===2){ restoreMoves(); }
  else if(n===3){
    restoreMoves();
    moveToSlot(cardOf(&#x27;btnLoad&#x27;), g(&#x27;g3slot&#x27;));   // 载入&quot;选择测量结果&quot;卡片
  }
  else if(n===4){
    restoreMoves();
    guideEnterP4();
  }
}
$(&#x27;btnG1Next&#x27;).onclick = ()=&gt; showGuideStep(2);
$(&#x27;btnG2Prev&#x27;).onclick = ()=&gt; showGuideStep(1);
$(&#x27;btnG2Next&#x27;).onclick = ()=&gt; showGuideStep(3);
$(&#x27;btnG3Prev&#x27;).onclick = ()=&gt; showGuideStep(2);
$(&#x27;btnG3Next&#x27;).onclick = ()=&gt;{
  if(!S.A){ guideAlert(&#x27;没有可处理的测量数据&#x27;); return; }
  showGuideStep(4);
};
$(&#x27;btnG4Prev&#x27;).onclick = ()=&gt; showGuideStep(3);
$(&#x27;btnG4Next&#x27;).onclick = guideStartFlow;

/* 第 4 页进入:自动计算合适的低频截止/斜率 */
async function guideEnterP4(){
  const st = g(&#x27;p4Status&#x27;);
  st.classList.remove(&#x27;err&#x27;);
  if(!S.A){ st.textContent = &#x27;尚未选择 L+R 测量，请返回第 3 步确认测量结果。&#x27;; return; }
  st.textContent = &#x27;正在自动分析低频截止与斜率…&#x27;;
  try{
    const r = await autoAnalyzeLF();
    st.textContent = r ? &#x27;已自动计算合适的低频截止与斜率（结果已填入步骤 2/6，可点“点击修改”查看调整）。&#x27; : &#x27;自动分析未返回结果，可点“点击修改”手动设置。&#x27;;
  }catch(e){
    st.textContent = &#x27;自动分析失败：&#x27; + e.message + &#x27;。可点“点击修改”手动设置。&#x27;;
    st.classList.add(&#x27;err&#x27;);
    log(&#x27;引导-低频自动分析失败: &#x27;+e.message,&#x27;err&#x27;);
  }
}

/* ---- 点击修改:弹窗载入 EQ 目标曲线设置 + 曲线运算 卡片 ---- */
$(&#x27;btnG4Mod&#x27;).onclick = ()=&gt;{
  restoreMoves();
  const body = g(&#x27;gdModifyBody&#x27;);
  moveToSlot(cardOf(&#x27;btnApplyTarget&#x27;), body);
  moveToSlot(cardOf(&#x27;btnArith&#x27;), body);
  showGd(&#x27;gdModifyModal&#x27;);
};
$(&#x27;btnGdModOk&#x27;).onclick = ()=&gt;{
  restoreMoves();
  hideGd(&#x27;gdModifyModal&#x27;);
};

/* ---- 第 4 页“下一步”:一键执行完整流程 ---- */
async function guideStartFlow(){
  if(!S.A){ guideAlert(&#x27;没有可处理的测量数据&#x27;); return; }
  clearGuideHooks();
  kGuideHookAfterMerge  = async ()=&gt;{ showGd(&#x27;gdProcModal&#x27;); };
  kGuideHookBeforeFinal = async (stereoMode, mergeIR)=&gt;{
    hideGd(&#x27;gdProcModal&#x27;);
    if(mergeIR === false){
      // 未合并:弹出带两个下载按钮与返回按钮的完成弹窗
      showGd(&#x27;gdFinishModal&#x27;);
      return true;
    }
    return false;   // 合并/单声道:走与半自动一致的导出流程
  };
  kGuideHookFinished = async ()=&gt;{ hideGd(&#x27;gdProcModal&#x27;); };
  const btn = $(&#x27;btnRunAll&#x27;);
  if(!btn){ log(&#x27;未找到一键流程按钮&#x27;,&#x27;err&#x27;); return; }
  log(&#x27;引导模式:开始一键执行完整流程…&#x27;,&#x27;cmd&#x27;);
  btn.click();   // 复用半自动完整流程(含合并 IR 选择、导出/清理逻辑)
}

/* ---- 完成弹窗:两个下载按钮(代理原步骤 7 按钮)+ 返回 ---- */
$(&#x27;gdFinMono&#x27;).onclick = ()=&gt;{ const b = $(&#x27;btnExport2&#x27;); if(b) b.click(); };
$(&#x27;gdFinStereo&#x27;).onclick = ()=&gt;{ const b = $(&#x27;btnExportStereo&#x27;); if(b) b.click(); };
$(&#x27;gdFinishBack&#x27;).onclick = backToModeSelect;
/* 未合并完成弹窗内:分别只清除对应分支(L+R 单声道 / L/R 立体声),另一分支可继续导出 */
$(&#x27;gdFinClearMono&#x27;).onclick = guard(async ()=&gt;{ await clearChainData(&#x27;mono&#x27;); const b=$(&#x27;gdFinMono&#x27;); if(b) b.style.display=&#x27;none&#x27;; });
$(&#x27;gdFinClearLr&#x27;).onclick = guard(async ()=&gt;{ await clearChainData(&#x27;lr&#x27;); const b=$(&#x27;gdFinStereo&#x27;); if(b) b.style.display=&#x27;none&#x27;; });

/* 引导模式提示弹窗 */
function guideAlert(msg){ g(&#x27;gdAlertText&#x27;).textContent = msg; showGd(&#x27;gdAlertModal&#x27;); }
$(&#x27;gdAlertOk&#x27;).onclick = ()=&gt; hideGd(&#x27;gdAlertModal&#x27;);

/* 页面加载即尝试连接 */
connect();
&lt;/script&gt;
&lt;/body&gt;
&lt;/html&gt;
"></iframe>
    </main>

</div>

<div class="block-modal" id="rewBlockModal" role="dialog" aria-modal="true" aria-labelledby="rewBlockText" aria-hidden="true">
    <div class="block-dialog">
      <div class="block-text" id="rewBlockText">该功能暂不支持联网使用</div>
      <div class="block-sub">REW 自动化处理需要在本机直接运行 HTML 文件,并与本机已打开的 REW(通过 localhost REST API)通信。联网访问时无法使用该功能,请下载独立版到本机后运行。</div>
      <div class="block-actions">
        <button id="rewBlockClose">关闭</button>
        <button class="primary" id="rewBlockDownload">下载KoyakaAutoREW独立版</button>
      </div>
    </div>
  </div>

<script>
(function(){
  const buttons = document.querySelectorAll('.nav-btn');
  const frames = {
    tone: document.getElementById('frame-tone'),
    sweep: document.getElementById('frame-sweep'),
    noise: document.getElementById('frame-noise'),
    rew: document.getElementById('frame-rew')
  };
  const themeSelect = document.getElementById('globalThemeSelect');

  // ===== 打开方式检测:仅 file://(直接双击/运行本地 HTML)才允许使用 REW 自动化处理 =====
  const LOCAL_FILE = /^file:$/i.test(location.protocol);
  let rewStandaloneBackup = '';
  const rewBlockModal = document.getElementById('rewBlockModal');
  const rewBlockClose = document.getElementById('rewBlockClose');
  const rewBlockDownload = document.getElementById('rewBlockDownload');

  function showRewBlockModal(){
    rewBlockModal.classList.add('show');
    rewBlockModal.setAttribute('aria-hidden','false');
  }
  function hideRewBlockModal(){
    rewBlockModal.classList.remove('show');
    rewBlockModal.setAttribute('aria-hidden','true');
  }
  // 从当前页面提取 REW 模块的完整 HTML(srcdoc 内容),用于生成独立版下载文件
  function getRewStandaloneHtml(){
    const f = frames.rew;
    return (f && f.getAttribute('srcdoc')) || rewStandaloneBackup || '';
  }
  function downloadRewStandalone(){
    const content = getRewStandaloneHtml();
    if(!content){
      alert('未找到 REW 模块内容,无法生成独立版文件');
      return;
    }
    const blob = new Blob([content], { type:'text/html;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'KoyakaAutoREW独立版.html';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  }
  rewBlockClose.addEventListener('click', hideRewBlockModal);
  rewBlockDownload.addEventListener('click', downloadRewStandalone);
  rewBlockModal.addEventListener('click', e => { if(e.target === rewBlockModal) hideRewBlockModal(); });

  // 联网访问:先备份 REW 模块内容(供“下载独立版”),再卸载 frame,
  // 避免页面在后台尝试连接本机 REW(localhost)。
  if(!LOCAL_FILE && frames.rew){
    rewStandaloneBackup = frames.rew.getAttribute('srcdoc') || '';
    frames.rew.removeAttribute('srcdoc');
    frames.rew.setAttribute('src', 'about:blank');
  }

  const homeThemeSelect = document.getElementById('homeThemeSelect');

  // 「跟随系统」:按操作系统深浅渲染,并实时监听系统变化
  function systemPrefersLight(){
    return !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches);
  }

  function applyTheme(theme){
    // 实际广播/生效的永远是解析后的 light/dark;theme 为 system 时跟随系统
    const effective = theme === 'system' ? (systemPrefersLight() ? 'light' : 'dark') : theme;
    document.body.classList.toggle('theme-light', effective === 'light');
    themeSelect.value = theme;
    if(homeThemeSelect) homeThemeSelect.value = theme;

    Object.values(frames).forEach(frame => {
      frame.contentWindow?.postMessage(
        { type:'test-osc-theme', theme: effective },
        '*'
      );
    });
  }

  // 每次进入默认「跟随系统」,不记忆上次选择
  function initTheme(){
    applyTheme('system');
  }

  function bindThemeSelect(sel){
    if(!sel) return;
    sel.addEventListener('change', () => {
      applyTheme(sel.value);
    });
  }
  bindThemeSelect(themeSelect);
  bindThemeSelect(homeThemeSelect);

  // 系统深浅切换时实时跟随(仅当当前选择为「跟随系统」)
  try{
    const mq = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)');
    const onSystemChange = () => { if(themeSelect.value === 'system') applyTheme('system'); };
    if(mq){
      if(mq.addEventListener) mq.addEventListener('change', onSystemChange);
      else if(mq.addListener) mq.addListener(onSystemChange);
    }
  }catch(e){}

  Object.values(frames).forEach(frame => {
    frame.addEventListener('load', () => {
      applyTheme(themeSelect.value);
    });
  });

  let flowLocked = false;
  window.addEventListener('message', e=>{
    const d = e.data || {};
    if(d.type==='koyaka-flow') flowLocked = !!d.running;
  });
  function flashLocked(btn){
    if(!btn) return;
    btn.classList.add('flow-locked');
    setTimeout(()=>btn.classList.remove('flow-locked'), 900);
  }
  function openModule(target, srcBtn){
    // 联网(http/https 等)访问时禁止进入 REW 自动化处理页
    if(target === 'rew' && !LOCAL_FILE){
      showRewBlockModal();
      return;
    }
    if(flowLocked){ flashLocked(srcBtn); return; }
    // 懒加载:首次激活某模块时才注入其 srcdoc(iframe 此时已可见,避免隐藏状态下加载/渲染失败)
    Object.values(frames).forEach(frame => {
      if(frame.dataset.srcdoc && !frame.getAttribute('srcdoc')) frame.srcdoc = frame.dataset.srcdoc;
    });

    // 切换功能页前，终止所有功能页正在播放的音频。
    Object.values(frames).forEach(frame => {
      frame.contentWindow?.postMessage({ type:'test-osc-stop' }, '*');
    });

    buttons.forEach(b => b.classList.toggle('active', b.dataset.target === target));
    Object.entries(frames).forEach(([key, frame]) => {
      frame.classList.toggle('active', key === target);
    });

    // 离开主页,进入原有布局
    document.getElementById('homeScreen').classList.add('hidden');
    document.getElementById('appScreen').style.display = '';
  }

  function goHome(){
    if(flowLocked) return;   // 流程执行中禁止返回主页
    Object.values(frames).forEach(frame => {
      frame.contentWindow?.postMessage({ type:'test-osc-stop' }, '*');
      frame.classList.remove('active');
    });
    buttons.forEach(b => b.classList.remove('active'));
    document.getElementById('appScreen').style.display = 'none';
    document.getElementById('homeScreen').classList.remove('hidden');
  }

  buttons.forEach(btn => {
    btn.addEventListener('click', () => openModule(btn.dataset.target, btn));
  });

  // 主页田字格按钮
  document.querySelectorAll('.home-btn').forEach(btn => {
    btn.addEventListener('click', () => openModule(btn.dataset.target, btn));
  });

  // 点击侧边栏品牌返回主页
  document.querySelector('.brand').addEventListener('click', goHome);
  document.querySelector('.brand').style.cursor = 'pointer';
  document.querySelector('.brand').title = '返回主页';

  initTheme();
})();
</script>
</body>
