<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KoyakaCAL</title>
<style>
:root {
  --bg:#1a1a1a;
  --card:#242424;
  --border:#3a3a3a;
  --text:#e8e8e8;
  --muted:#a0a0a0;
  --sidebar:#202020;
  --sidebar-hover:#2b2b2b;
  --sidebar-active:#343434;
}
* { box-sizing:border-box; }
html,body { margin:0; width:100%; min-height:100%; }
body {
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  overflow:hidden;
}
.app {
  display:flex;
  width:100vw;
  height:100vh;
  min-height:100vh;
}
.sidebar {
  width:210px;
  flex:0 0 210px;
  height:100vh;
  background:var(--sidebar);
  border-right:1px solid var(--border);
  padding:26px 14px;
  display:flex;
  flex-direction:column;
  gap:8px;
  z-index:20;
}
.brand {
  font-size:22px;
  font-weight:700;
  letter-spacing:.01em;
  padding:4px 12px 24px;
  color:var(--text);
  transition:transform .18s ease,color .18s ease,text-shadow .18s ease;
}
/* 返回主页的品牌标:悬停效果与主页功能选择卡片一致(轻微上浮+高亮) */
.brand:hover{
  color:var(--accent2);
  transform:translateY(-3px);
  text-shadow:0 10px 26px rgba(0,0,0,.32);
}
body.theme-light .brand:hover{
  color:#6a6354;
  text-shadow:0 10px 22px rgba(0,0,0,.12);
}
.nav-title {
  font-size:11px;
  color:var(--muted);
  padding:0 12px 7px;
  letter-spacing:.04em;
}
.nav-btn {
  appearance:none;
  width:100%;
  border:1px solid transparent;
  border-radius:9px;
  background:transparent;
  color:var(--muted);
  padding:12px 12px;
  text-align:left;
  font:inherit;
  font-size:14px;
  cursor:pointer;
  transition:.15s ease;
}
.nav-btn:hover {
  background:var(--sidebar-hover);
  color:var(--text);
}
.nav-btn.active {
  background:var(--sidebar-active);
  border-color:var(--border);
  color:var(--text);
}
.content {
  min-width:0;
  flex:1;
  height:100vh;
  display:flex;
  flex-direction:column;
}
.header {
  height:76px;
  flex:0 0 76px;
  display:flex;
  align-items:center;
  padding:0 28px;
  border-bottom:1px solid var(--border);
  background:var(--bg);
}
.header h1 {
  margin:0;
  font-size:26px;
  font-weight:700;
}
.page {
  flex:1;
  min-height:0;
  position:relative;
}
.tool-frame {
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  border:0;
  background:var(--bg);
  opacity:0;
  visibility:hidden;
  pointer-events:none;
}
.tool-frame.active {
  opacity:1;
  visibility:visible;
  pointer-events:auto;
}

@media (max-width:700px) {
  .sidebar {
    width:150px;
    flex-basis:150px;
    padding:18px 9px;
  }
  .brand { font-size:18px; padding-left:8px; }
  .nav-btn { font-size:13px; padding:10px 9px; }
  .header { padding:0 18px; }
  .header h1 { font-size:22px; }
}

/* ===== 主页(田字格功能选择) ===== */
.home{
  position:fixed; inset:0; z-index:800;
  background:var(--bg);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:26px;
}
.home.hidden{display:none}
.home-brand{font-size:36px;font-weight:700;letter-spacing:.02em;color:var(--text)}
.home-sub{color:var(--muted);font-size:14px;margin-top:-18px}
.home-grid{display:grid;grid-template-columns:repeat(2,230px);gap:28px}
.home-btn{
  appearance:none;border:1px solid var(--border);border-radius:18px;
  background:var(--card);color:var(--text);cursor:pointer;
  padding:28px 18px 22px;display:flex;flex-direction:column;align-items:center;gap:16px;
  font:inherit;transition:.18s ease;
}
.home-btn:hover{border-color:var(--accent2);transform:translateY(-3px);box-shadow:0 14px 34px rgba(0,0,0,.25)}
body.theme-light .home-btn:hover{box-shadow:0 14px 34px rgba(0,0,0,.10)}
.home-icon{
  width:88px;height:88px;border-radius:16px;background:var(--input);
  border:1px solid var(--border);display:grid;place-items:center;overflow:hidden;
  color:var(--accent);
}
.home-icon svg{width:60px;height:40px}
.home-label{font-size:16px;font-weight:600}

/* 主页底部署名 */
.home-footer{position:fixed;left:0;right:0;bottom:14px;text-align:center;color:var(--muted);font-size:12px;line-height:1.9;z-index:860;pointer-events:none;padding:0 12px}

.flow-locked{outline:2px solid var(--err)!important; box-shadow:0 0 0 4px rgba(224,115,115,.22)!important}

/* ===== KoyakaCAL 全局主题 ===== */
body.theme-light{
  --bg:#f7f3ea;
  --card:#fffdf8;
  --border:#ded7c9;
  --text:#25231f;
  --muted:#777064;
  --sidebar:#eee9df;
  --sidebar-hover:#e5dfd4;
  --sidebar-active:#ddd5c8;
}

/* 外层全局主题控制 */
.theme-control-global{
  margin-left:auto;
  display:flex;
  align-items:center;
  gap:8px;
}
.theme-control-global label{
  color:var(--muted);
  font-size:14px;
  line-height:1.2;
  margin:0;
}
.theme-control-global select{
  width:auto;
  min-width:120px;
  height:42px;
  background:var(--card);
  color:var(--text);
  border:1px solid var(--border);
  border-radius:9px;
  padding:11px 12px;
  outline:none;
  font:inherit;
  font-size:14px;
}
body.theme-light .header{
  background:var(--bg);
}

/* 主页(田字格)右上角主题选择 */
.home-theme{
  position:fixed; top:16px; right:16px; z-index:850;
  display:flex; align-items:center; gap:8px;
}
.home-theme label{color:var(--muted); font-size:14px; line-height:1.2; margin:0}
.home-theme select{
  width:auto; min-width:120px; height:42px;
  background:var(--card); color:var(--text);
  border:1px solid var(--border); border-radius:9px;
  padding:11px 12px; outline:none; font:inherit; font-size:14px;
}

/* ===== REW 联网限制弹窗(在线访问时禁止进入 REW 自动化处理页) ===== */
.block-modal{position:fixed;inset:0;z-index:3000;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);opacity:0;visibility:hidden;pointer-events:none;transition:opacity .16s ease,visibility .16s ease}
.block-modal.show{opacity:1;visibility:visible;pointer-events:auto}
.block-dialog{width:min(430px,calc(100vw - 32px));background:var(--card);border:1px solid var(--border);border-radius:16px;padding:28px 24px 22px;text-align:center;box-shadow:0 18px 50px rgba(0,0,0,.45)}
.block-text{font-size:17px;font-weight:700;color:var(--text);margin:0 0 10px}
.block-sub{font-size:13px;color:var(--muted);line-height:1.7;margin:0 0 22px}
.block-actions{display:flex;gap:10px;justify-content:center}
.block-actions button{border:1px solid var(--border);border-radius:10px;background:var(--card);color:var(--text);padding:10px 16px;font:inherit;font-size:14px;cursor:pointer;transition:.15s ease}
.block-actions button:hover{filter:brightness(1.15)}
.block-actions button.primary{background:#2f7d9c;border-color:#579bb5;color:#fff;font-weight:600}

</style>
</head>

&lt;html lang=&quot;zh-CN&quot;&gt;
&lt;head&gt;
&lt;meta charset=&quot;UTF-8&quot;&gt;
&lt;meta name=&quot;viewport&quot; content=&quot;width=device-width, initial-scale=1.0&quot;&gt;
&lt;title&gt;KoyakaCAL - 纯音测试&lt;/title&gt;
&lt;style&gt;
/* ========== CSS 变量定义（提前定义） ========== */
:root{
  --bg:#1a1a1a;
  --card:#242424;
  --border:#3a3a3a;
  --text:#e8e8e8;
  --muted:#a0a0a0;
  --input:#1f1f1f;
  --accent:#4a4a4a;
  --accent2:#6b6b6b;
  --axis:#4a4a4a;
  --canvas-bg:#151515;
  --button-bg:#2a2a2a;
  --handle-bg:#e8e8e8;
  --handle-border:#6b6b6b;
  --range-highlight:rgba(107,107,107,.2);
  color-scheme:dark;
}

/* ========== 主题变量 ========== */
body.theme-light{
  --bg:#f7f3ea;
  --card:#fffdf8;
  --border:#ded7c9;
  --text:#25231f;
  --muted:#777064;
  --input:#fffefa;
  --accent:#8a8172;
  --accent2:#a69d8e;
  --axis:#b8af9f;
  --canvas-bg:#f0ebe2;
  --button-bg:#e8e2d8;
  --handle-bg:#25231f;
  --handle-border:#8a8172;
  --range-highlight:rgba(138,129,114,.15);
  color-scheme:light;
}

/* ========== 基础样式 ========== */
*{
  box-sizing:border-box;
  font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif;
}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
}
main{
  max-width:1050px;
  margin:0 auto;
  padding:38px 22px 50px;
}
h1{
  font-size:30px;
  margin:0 0 8px;
}
.sub{
  color:var(--muted);
  margin:0 0 28px;
}

/* ========== 卡片样式 ========== */
.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:14px;
  padding:22px;
  margin-bottom:18px;
}
.card.collapsible{
  padding:0;
  overflow:hidden;
}
.card-header{
  display:flex;
  align-items:center;
  gap:8px;
  height:42px;
  min-height:42px;
  padding:0 14px;
  cursor:pointer;
  user-select:none;
}
.card-toggle{
  width:24px;
  height:24px;
  padding:0;
  display:grid;
  place-items:center;
  border:0;
  background:transparent;
  color:#9eabc0;
  font-size:14px;
  line-height:1;
  cursor:pointer;
}
.card-title{
  font-size:14px;
  font-weight:600;
  color:var(--text);
}
.card-body{
  padding:0 22px 22px;
}
.card.collapsed .card-body{
  display:none;
}

/* ========== 表单控件 ========== */
.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:18px;
}
label{
  display:block;
  font-size:14px;
  color:var(--muted);
  margin-bottom:8px;
}
input,select,button{
  font:inherit;
}
input,select{
  width:100%;
  background:var(--input);
  color:var(--text);
  border:1px solid var(--border);
  border-radius:9px;
  padding:11px 12px;
  outline:none;
  transition:border-color .2s;
}
input:focus,select:focus{
  border-color:var(--accent2);
}
button{
  border:1px solid var(--border);
  border-radius:9px;
  padding:11px 18px;
  background:var(--button-bg);
  color:var(--text);
  cursor:pointer;
  transition:opacity .2s;
}
button.primary{
  background:var(--accent);
  border-color:var(--accent2);
}
button:disabled{
  opacity:.45;
  cursor:not-allowed;
}

/* ========== 扫频模式选择 ========== */
.modes{
  display:flex;
  gap:8px;
}
.mode{
  flex:1;
  cursor:pointer;
  padding:11px;
  border:1px solid var(--border);
  background:var(--input);
  color:var(--text);
  border-radius:9px;
}
.mode.active{
  background:var(--accent);
  border-color:var(--accent2);
  color:white;
}

/* ========== 数值输入 ========== */
.range-row{
  display:flex;
  gap:10px;
  align-items:center;
}
.range-row input[type=range]{
  padding:0;
}
.value{
  width:72px;
}

/* ========== 操作按钮 ========== */
.actions{
  display:flex;
  gap:12px;
  align-items:center;
  flex-wrap:wrap;
}

/* ========== 波形预览 ========== */
.canvas-wrap{
  height:260px;
  background:var(--canvas-bg);
  border:1px solid var(--border);
  border-radius:10px;
  overflow:hidden;
}
canvas{
  width:100%;
  height:100%;
  display:block;
}

/* ========== 播放控制 ========== */
.controls{
  display:grid;
  grid-template-columns:auto 1fr auto;
  gap:14px;
  align-items:center;
}
#play{
  font-size:17px;
  min-width:110px;
}
.time{
  font-variant-numeric:tabular-nums;
  color:var(--text);
  white-space:nowrap;
  opacity:.8;
}
.freq-settings{
  display:flex;
  align-items:center;
  gap:10px;
  margin-top:14px;
}
.freq-settings label{
  margin:0;
}
.freq-settings select{
  width:auto;
  min-width:120px;
}

/* ========== 频率显示（合并重复定义） ========== */
.freq-display{
  margin-top:18px;
  text-align:center;
  font-size:24px;
  font-weight:600;
  min-width:145px;
  color:var(--text);
  font-variant-numeric:tabular-nums;
  letter-spacing:.02em;
}
.freq-display small{
  display:block;
  font-size:12px;
  font-weight:400;
  color:var(--muted);
  margin-top:2px;
}

/* ========== 进度条 ========== */
.progress{
  width:100%;
  accent-color:var(--accent2);
}
.status{
  color:var(--muted);
  font-size:13px;
  min-height:20px;
  margin-top:10px;
}
.note{
  font-size:13px;
  color:var(--muted);
  line-height:1.6;
}

/* ========== 频率轴 ========== */
.range-head{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:18px;
  margin-bottom:14px;
}
.range-axis-mode{
  display:flex;
  gap:7px;
  flex-shrink:0;
}
.axis-mode{
  padding:8px 12px;
  font-size:13px;
}
.axis-mode.active{
  background:var(--accent);
  border-color:var(--accent2);
  color:white;
}
.freq-axis-wrap{
  position:relative;
  height:145px;
  background:var(--canvas-bg);
  border:1px solid var(--border);
  border-radius:10px;
  overflow:hidden;
  user-select:none;
  touch-action:none;
}
#freqAxis{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  display:block;
}

/* ========== 频率轴手柄 ========== */
.freq-handle{
  position:absolute;
  top:28px;
  height:82px;
  width:14px;
  transform:translateX(-50%);
  cursor:ew-resize;
  z-index:5;
  touch-action:none;
}
.freq-handle:before{
  content:&quot;&quot;;
  position:absolute;
  left:5px;
  top:12px;
  width:4px;
  height:58px;
  border-radius:3px;
  background:var(--handle-bg);
  box-shadow:0 0 0 2px var(--handle-border);
}
.freq-handle:after{
  content:&quot;&quot;;
  position:absolute;
  left:0;
  top:0;
  border-left:7px solid transparent;
  border-right:7px solid transparent;
  border-top:9px solid var(--handle-border);
}
.end-handle:after{
  top:auto;
  bottom:0;
  border-top:0;
  border-bottom:9px solid var(--handle-border);
}
.freq-handle-label{
  position:absolute;
  top:-25px;
  left:50%;
  transform:translateX(-50%);
  white-space:nowrap;
  background:var(--button-bg);
  border:1px solid var(--border);
  border-radius:5px;
  padding:2px 5px;
  color:var(--text);
  font-size:11px;
  font-variant-numeric:tabular-nums;
  pointer-events:none;
}
.end-handle .freq-handle-label{
  top:auto;
  bottom:-25px;
}
.freq-range-label{
  position:absolute;
  left:0;
  right:0;
  top:7px;
  text-align:center;
  color:var(--text);
  opacity:.7;
  font-size:12px;
  pointer-events:none;
}

/* ========== 当前频率指示器 ========== */
.current-freq-marker{
  position:absolute;
  top:0;
  bottom:0;
  width:1px;
  pointer-events:none;
  display:none;
  z-index:4;
}
.current-freq-text{
  position:absolute;
  bottom:13px;
  left:50%;
  transform:translateX(-50%);
  white-space:nowrap;
  background:var(--button-bg);
  border:1px solid var(--border);
  border-radius:6px;
  padding:3px 7px;
  color:var(--text);
  font-size:12px;
  font-variant-numeric:tabular-nums;
}
.current-freq-line{
  position:absolute;
  top:32px;
  bottom:0;
  width:1px;
  background:var(--handle-bg);
  opacity:.75;
}

/* ========== 主题控制 ========== */
.topbar{
  position:relative;
}
.theme-control{
  position:absolute;
  right:0;
  top:0;
  display:flex;
  align-items:center;
  gap:8px;
  z-index:20;
}
.theme-control label{
  font-size:13px;
  margin:0;
  color:var(--muted);
}
.theme-control select{
  width:auto;
  min-width:82px;
  padding:8px 10px;
}

/* ========== 响应式设计 ========== */
@media(max-width:800px){
  .grid{

&lt;style&gt;
/* 播放区：纯音为稳态连续播放，不需要时间轴 */
.single-play-control {
  display: flex;
  align-items: center;
  gap: 12px;
}

/* 下载悬浮弹窗 */
.download-modal {
  position: fixed;
  inset: 0;
  z-index: 1000;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  background: rgba(0,0,0,.48);
  backdrop-filter: blur(5px);
  -webkit-backdrop-filter: blur(5px);
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  transition: opacity .16s ease, visibility .16s ease;
}
.download-modal.show {
  opacity: 1;
  visibility: visible;
  pointer-events: auto;
}
.download-dialog {
  width: min(430px, calc(100vw - 32px));
  border: 1px solid var(--border);
  border-radius: 14px;
  background: var(--panel);
  box-shadow: 0 20px 60px rgba(0,0,0,.35);
  transform: translateY(8px) scale(.98);
  transition: transform .16s ease;
  overflow: hidden;
}
.download-modal.show .download-dialog {
  transform: translateY(0) scale(1);
}
.download-dialog-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  padding: 18px 20px 14px;
  border-bottom: 1px solid var(--border);
}
.download-dialog-title {
  font-size: 17px;
  font-weight: 650;
  color: var(--text);
}
.download-dialog-subtitle {
  margin-top: 4px;
  font-size: 12px;
  color: var(--muted);
}
.download-close {
  width: 30px;
  height: 30px;
  padding: 0;
  border: 0;
  background: transparent;
  color: var(--muted);
  font-size: 23px;
  line-height: 28px;
  cursor: pointer;
  border-radius: 7px;
}
.download-close:hover {
  background: var(--hover);
  color: var(--text);
}
.download-dialog-body {
  padding: 20px;
}
.download-dialog-body label {
  display: block;
  margin-bottom: 8px;
}
.download-dialog-body input {
  width: 100%;
  box-sizing: border-box;
}
.download-dialog-preview {
  margin-top: 10px;
  font-size: 12px;
  color: var(--muted);
}
.download-dialog-actions {
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  padding: 14px 20px 18px;
  border-top: 1px solid var(--border);
}
.download-dialog-actions button {
  min-width: 88px;
}
&lt;/style&gt;

      &lt;div&gt;
        &lt;div class=&quot;download-dialog-title&quot; id=&quot;downloadDialogTitle&quot;&gt;生成测试信号&lt;/div&gt;
        &lt;div class=&quot;download-dialog-subtitle&quot;&gt;设置需要导出的稳态纯音时长&lt;/div&gt;
      &lt;/div&gt;

    &lt;/div&gt;

    &lt;/div&gt;

      &lt;button id=&quot;cancelDownloadBottom&quot;&gt;取消&lt;/button&gt;
      &lt;button id=&quot;generateDownload&quot; class=&quot;primary&quot;&gt;生成并下载&lt;/button&gt;
    &lt;/div&gt;
  &lt;/div&gt;

&lt;script&gt;
(function(){
  &#x27;use strict&#x27;;

  const $ = id =&gt; document.getElementById(id);
  const el = {
    waveform:$(&#x27;waveform&#x27;),
    frequency:$(&#x27;frequency&#x27;),
    level:$(&#x27;level&#x27;),
    levelNum:$(&#x27;levelNum&#x27;),
    sampleRate:$(&#x27;sampleRate&#x27;),
    channels:$(&#x27;channels&#x27;),
    fade:$(&#x27;fade&#x27;),
    download:$(&#x27;download&#x27;),
    play:$(&#x27;play&#x27;),
    freqDisplay:$(&#x27;freqDisplay&#x27;),
    freqAxis:$(&#x27;freqAxis&#x27;),
    freqAxisWrap:$(&#x27;freqAxisWrap&#x27;),
    freqRangeLabel:$(&#x27;freqRangeLabel&#x27;),
    freqHandle:$(&#x27;freqHandle&#x27;),
    freqHandleLabel:$(&#x27;freqHandleLabel&#x27;),
    downloadModal:$(&#x27;downloadModal&#x27;),
    downloadDuration:$(&#x27;downloadDuration&#x27;),
    generateDownload:$(&#x27;generateDownload&#x27;),
    cancelDownload:$(&#x27;cancelDownload&#x27;),
    cancelDownloadBottom:$(&#x27;cancelDownloadBottom&#x27;),
    downloadStatus:$(&#x27;downloadStatus&#x27;)
  };

  const MAX_FREQ=22000;
  const MIN_LOG_FREQ=20;
  const AXIS_PADDING=18;

  const state={
    axisMode:&#x27;log&#x27;,
    viewMin:MIN_LOG_FREQ,
    viewMax:MAX_FREQ,
    axisDragging:false,
    axisPanning:null,
    playing:false,
    downloadOpen:false,
    audioCtx:null,
    oscillator:null,
    gainNode:null,
    splitter:null,
    merger:null
  };

  const clamp=(v,min,max)=&gt;Math.max(min,Math.min(max,v));

  function getParams(){
    const sr=Number(el.sampleRate.value);
    let f=Number(el.frequency.value);
    let db=Number(el.levelNum.value);

    if(!Number.isFinite(sr)) throw new Error(&#x27;采样率无效。&#x27;);
    if(!Number.isFinite(f)) f=1000;
    if(!Number.isFinite(db)) db=-12;

    f=clamp(Math.round(f),0,MAX_FREQ);
    if(f&gt;=sr/2) f=Math.max(0,Math.floor(sr/2)-1);
    db=clamp(db,-60,0);

    el.frequency.value=f;
    el.level.value=db;
    el.levelNum.value=db;

    return {
      f,
      sr,
      amp:10**(db/20),
      db,
      waveform:el.waveform.value,
      channelMode:Number(el.channels.value),
      fade:Number(el.fade.value)
    };
  }

  function formatFreq(f){
    f=Math.round(Number(f)||0);
    return f&gt;=1000
      ? ((f%1000===0)?String(f/1000):String(f/1000).replace(/\.?0+$/,&#x27;&#x27;))+&#x27; kHz&#x27;
      : f+&#x27; Hz&#x27;;
  }

  function updateFrequencyDisplay(){
    const f=Number(el.frequency.value)||0;
    el.freqDisplay.innerHTML=formatFreq(f)+&#x27;&lt;small&gt;当前频率&lt;/small&gt;&#x27;;
  }

  function fullViewRange(){
    return state.axisMode===&#x27;linear&#x27;
      ? {min:0,max:MAX_FREQ}
      : {min:MIN_LOG_FREQ,max:MAX_FREQ};
  }

  function axisToU(f){return state.axisMode===&#x27;log&#x27;?Math.log10(f):f;}
  function axisFromU(u){return state.axisMode===&#x27;log&#x27;?10**u:u;}

  function isZoomed(){
    const full=fullViewRange();
    return state.viewMin&gt;full.min+1e-9||state.viewMax&lt;full.max-1e-9;
  }

  function axisMap(freq,width){
    if(state.axisMode===&#x27;linear&#x27;){
      const span=state.viewMax-state.viewMin;
      return span&gt;0?clamp((freq-state.viewMin)/span*width,0,width):0;
    }
    if(freq&lt;=0) return 0;
    const lmin=Math.log10(state.viewMin),
          lmax=Math.log10(state.viewMax);
    return clamp((Math.log10(freq)-lmin)/(lmax-lmin)*width,0,width);
  }

  function axisUnmap(x,width){
    x=clamp(x,0,width);
    if(state.axisMode===&#x27;linear&#x27;){
      return state.viewMin+x/width*(state.viewMax-state.viewMin);
    }
    const lmin=Math.log10(state.viewMin),
          lmax=Math.log10(state.viewMax);
    return 10**(lmin+(lmax-lmin)*x/width);
  }

  // 刻度标签精度跟随缩放：step 越小，小数位越多。
  function fmtTick(f,step){
    if(step!=null&amp;&amp;step&gt;=1000){
      const d=Math.max(0,-Math.floor(Math.log10(step/1000)));
      return (Math.round(f/step)*step/1000).toFixed(d)+&#x27;k&#x27;;
    }
    const d=step?Math.max(0,-Math.floor(Math.log10(step))):0;
    return (Math.round(f/step)*step).toFixed(d);
  }

  function fmtEdge(f){
    const r=Math.round(f*100)/100;
    return Number.isInteger(r)?String(r):r.toFixed(2);
  }

  // 以 anchorFreq 为锚点缩放视图；spanScale 为可见跨度的缩放系数（&lt;1 放大）。
  function zoomAt(anchorFreq,spanScale){
    const full=fullViewRange();
    const fuMin=axisToU(full.min),fuMax=axisToU(full.max);
    const uMin=axisToU(state.viewMin),uMax=axisToU(state.viewMax);
    const spanU=uMax-uMin;
    if(!(spanU&gt;0))return;
    const minSpanU=state.axisMode===&#x27;log&#x27;?0.02:2;
    const newSpan=clamp(spanU*spanScale,minSpanU,fuMax-fuMin);
    const ratio=clamp((axisToU(anchorFreq)-uMin)/spanU,0,1);
    let nMin=axisToU(anchorFreq)-ratio*newSpan;
    let nMax=nMin+newSpan;
    if(nMin&lt;fuMin){nMin=fuMin;nMax=nMin+newSpan;}
    if(nMax&gt;fuMax){nMax=fuMax;nMin=nMax-newSpan;}
    state.viewMin=axisFromU(nMin);
    state.viewMax=axisFromU(nMax);
    updateFreqAxis();
  }

  function resetAxisView(){
    const full=fullViewRange();
    state.viewMin=full.min;
    state.viewMax=full.max;
    updateFreqAxis();
  }

  // 平移视图：deltaU 为坐标系（线性为 Hz，对数为 log10）内的位移，钳制在全范围内。
  function panBy(deltaU){
    const full=fullViewRange();
    const fuMin=axisToU(full.min),fuMax=axisToU(full.max);
    const spanU=axisToU(state.viewMax)-axisToU(state.viewMin);
    if(!(spanU&gt;0))return;
    let uMin=axisToU(state.viewMin)+deltaU;
    let uMax=uMin+spanU;
    if(uMin&lt;fuMin){uMin=fuMin;uMax=fuMin+spanU;}
    if(uMax&gt;fuMax){uMax=fuMax;uMin=fuMax-spanU;}
    state.viewMin=axisFromU(uMin);
    state.viewMax=axisFromU(uMax);
    updateFreqAxis();
  }

  // 拖拽平移：以拖动开始时的视图为基准（抓取式），逐次绝对定位，避免漂移。
  function panDragTo(pan,clientX,wrap){
    const rect=wrap.getBoundingClientRect();
    const innerW=Math.max(1,rect.width-AXIS_PADDING*2);
    const full=fullViewRange();
    const fuMin=axisToU(full.min),fuMax=axisToU(full.max);
    const spanU=pan.uMax-pan.uMin;
    let uMin=pan.uMin+(pan.startX-clientX)/innerW*spanU;
    let uMax=uMin+spanU;
    if(uMin&lt;fuMin){uMin=fuMin;uMax=fuMin+spanU;}
    if(uMax&gt;fuMax){uMax=fuMax;uMin=fuMax-spanU;}
    state.viewMin=axisFromU(uMin);
    state.viewMax=axisFromU(uMax);
    updateFreqAxis();
  }

  function updateFreqAxis(){
    const rect=el.freqAxisWrap.getBoundingClientRect();
    const dpr=devicePixelRatio||1;
    const w=Math.max(1,rect.width);
    const h=Math.max(1,rect.height);

    el.freqAxis.width=Math.round(w*dpr);
    el.freqAxis.height=Math.round(h*dpr);

    const ctx=el.freqAxis.getContext(&#x27;2d&#x27;);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0,0,w,h);

    const cs=getComputedStyle(document.documentElement);
    const axis=cs.getPropertyValue(&#x27;--axis&#x27;).trim();
    const border=cs.getPropertyValue(&#x27;--border&#x27;).trim();
    const muted=cs.getPropertyValue(&#x27;--muted&#x27;).trim();

    const innerW=Math.max(1,w-AXIS_PADDING*2);
    const y=82;

    ctx.strokeStyle=axis;
    ctx.lineWidth=1;
    ctx.beginPath();
    ctx.moveTo(AXIS_PADDING,y);
    ctx.lineTo(w-AXIS_PADDING,y);
    ctx.stroke();

    ctx.font=&#x27;11px sans-serif&#x27;;
    ctx.textAlign=&#x27;center&#x27;;

    if(isZoomed()){
      // 手动缩放视图：按可见范围生成均匀刻度，精度随缩放变化。
      const span=state.viewMax-state.viewMin;
      const maxTicks=Math.max(2,Math.floor(innerW/70));
      const raw=span/maxTicks;
      const pow=10**Math.floor(Math.log10(raw));
      let step=10*pow;
      for(const m of [1,2,5,10]){
        if(raw&lt;=m*pow){step=m*pow;break;}
      }
      const pxPerUnit=innerW/span;
      const minorStep=step/(Math.round(step/pow)===2?4:5);
      if(minorStep*pxPerUnit&gt;=9){
        ctx.strokeStyle=border;
        for(let f=Math.ceil(state.viewMin/minorStep-1e-9)*minorStep;
            f&lt;=state.viewMax+1e-9;f+=minorStep){
          const x=AXIS_PADDING+axisMap(f,innerW);
          ctx.beginPath();
          ctx.moveTo(x,y-5);
          ctx.lineTo(x,y+5);
          ctx.stroke();
        }
      }
      ctx.strokeStyle=axis;
      for(let f=Math.ceil(state.viewMin/step-1e-9)*step;
          f&lt;=state.viewMax+1e-9;f+=step){
        const x=AXIS_PADDING+axisMap(f,innerW);
        ctx.beginPath();
        ctx.moveTo(x,y-11);
        ctx.lineTo(x,y+11);
        ctx.stroke();
        ctx.fillStyle=muted;
        ctx.fillText(fmtTick(f,step),x,y+27);
      }
      ctx.textAlign=&#x27;left&#x27;;
      ctx.fillStyle=muted;
      ctx.fillText(fmtEdge(state.viewMin),4,h-8);
      ctx.textAlign=&#x27;right&#x27;;
      ctx.fillText(fmtEdge(state.viewMax),w-4,h-8);
      ctx.textAlign=&#x27;center&#x27;;
    }else if(state.axisMode===&#x27;linear&#x27;){
      [0,5000,10000,15000,20000,22000].forEach(f=&gt;{
        const x=AXIS_PADDING+axisMap(f,innerW);
        ctx.strokeStyle=border;
        ctx.beginPath();
        ctx.moveTo(x,y-10);
        ctx.lineTo(x,y+10);
        ctx.stroke();
        ctx.fillStyle=muted;
        ctx.fillText(f&gt;=1000?f/1000+&#x27;k&#x27;:String(f),x,y+27);
      });
    }else{
      const ticks=[];
      for(let decade=10;decade&lt;=10000;decade*=10){
        for(let n=1;n&lt;=9;n++){
          const f=decade*n;
          if(f&gt;=MIN_LOG_FREQ&amp;&amp;f&lt;=MAX_FREQ) ticks.push(f);
        }
      }
      ticks.push(20000);

      const major=new Set([20,50,100,200,500,1000,2000,5000,10000,20000]);

      [...new Set(ticks)].sort((a,b)=&gt;a-b).forEach(f=&gt;{
        const x=AXIS_PADDING+axisMap(f,innerW);
        if(x&lt;AXIS_PADDING||x&gt;w-AXIS_PADDING)return;
        const maj=major.has(f);
        ctx.strokeStyle=maj?axis:border;
        ctx.beginPath();
        ctx.moveTo(x,y-(maj?11:5));
        ctx.lineTo(x,y+(maj?11:5));
        ctx.stroke();

        if(maj){
          ctx.fillStyle=muted;
          ctx.fillText(f&gt;=1000?f/1000+&#x27;k&#x27;:String(f),x,y+27);
        }
      });

      ctx.textAlign=&#x27;left&#x27;;
      ctx.fillStyle=muted;
      ctx.fillText(&#x27;0 Hz*&#x27;,4,h-8);
      ctx.textAlign=&#x27;right&#x27;;
      ctx.fillText(&#x27;22k Hz&#x27;,w-4,h-8);
    }

    const f=Number(el.frequency.value)||0;
    const x=AXIS_PADDING+axisMap(f,innerW);
    el.freqHandle.style.left=x+&#x27;px&#x27;;
    el.freqHandleLabel.textContent=f+&#x27; Hz&#x27;;
    el.freqRangeLabel.textContent=&#x27;测试频率：&#x27;+f+&#x27; Hz&#x27;;
    el.freqHandle.setAttribute(&#x27;aria-valuenow&#x27;,String(f));
  }

  function setFrequency(f){
    let p;
    try{
      p=getParams();
    }catch(_){
      return;
    }

    f=clamp(Math.round(Number(f)||0),0,MAX_FREQ);
    if(f&gt;=p.sr/2) f=Math.max(0,Math.floor(p.sr/2)-1);

    el.frequency.value=f;
    updateFreqAxis();
    updateFrequencyDisplay();

    if(state.playing &amp;&amp; state.oscillator){
      state.oscillator.frequency.setTargetAtTime(
        f,state.audioCtx.currentTime,0.003
      );
    }
  }

  function updateFrequencyFromPointer(e){
    const r=el.freqAxisWrap.getBoundingClientRect();
    const innerW=Math.max(1,r.width-AXIS_PADDING*2);
    const x=clamp(e.clientX-r.left-AXIS_PADDING,0,innerW);
    setFrequency(axisUnmap(x,innerW));
  }

  function disconnectGraph(){
    if(state.oscillator){
      try{state.oscillator.disconnect();}catch(_){}
    }
    if(state.gainNode){
      try{state.gainNode.disconnect();}catch(_){}
    }
    if(state.splitter){
      try{state.splitter.disconnect();}catch(_){}
    }
    if(state.merger){
      try{state.merger.disconnect();}catch(_){}
    }
    state.oscillator=null;
    state.gainNode=null;
    state.splitter=null;
    state.merger=null;
  }

  function createGraph(p){
    const ctx=state.audioCtx;

    disconnectGraph();

    const osc=ctx.createOscillator();
    const gain=ctx.createGain();
    const splitter=ctx.createChannelSplitter(2);
    const merger=ctx.createChannelMerger(2);

    osc.type=p.waveform;
    osc.frequency.setValueAtTime(p.f,ctx.currentTime);
    gain.gain.setValueAtTime(p.amp,ctx.currentTime);

    osc.connect(gain);
    gain.connect(splitter);

    // Oscillator is mono. Explicitly route that mono signal to the requested
    // stereo output channel.
    if(p.channelMode===1){
      splitter.connect(merger,0,0);
    }else if(p.channelMode===3){
      splitter.connect(merger,0,1);
    }else{
      splitter.connect(merger,0,0);
      splitter.connect(merger,0,1);
    }

    merger.connect(ctx.destination);

    state.oscillator=osc;
    state.gainNode=gain;
    state.splitter=splitter;
    state.merger=merger;

    osc.start();
  }

  async function startPlayback(){
    if(state.playing){
      stopPlayback();
      return;
    }

    let p;
    try{p=getParams();}catch(e){
      alert(e.message);
      return;
    }

    try{
      if(!state.audioCtx || state.audioCtx.state===&#x27;closed&#x27;){
        state.audioCtx=new (window.AudioContext||window.webkitAudioContext)({
          sampleRate:p.sr
        });
      }

      // A browser may choose its actual hardware context rate. The UI warning
      // tells the user to match it; playback still remains functional.
      await state.audioCtx.resume();

      // If the existing context has a different rate, recreate it so the
      // selected sample rate is applied as far as the browser permits.
      if(Math.abs(state.audioCtx.sampleRate-p.sr)&gt;0.5){
        try{await state.audioCtx.close();}catch(_){}
        state.audioCtx=new (window.AudioContext||window.webkitAudioContext)({
          sampleRate:p.sr
        });
        await state.audioCtx.resume();
      }

      createGraph(p);

      state.playing=true;
      el.play.textContent=&#x27;⏹ 停止&#x27;;
    }catch(e){
      state.playing=false;
      el.play.textContent=&#x27;▶ 播放&#x27;;
      alert(&#x27;无法启动播放：&#x27;+e.message);
    }
  }

  function stopPlayback(){
    if(state.oscillator){
      const now=state.audioCtx.currentTime;
      const nodes=[state.oscillator,state.gainNode,
        state.splitter,state.merger];
      try{
        state.gainNode.gain.cancelScheduledValues(now);
        state.gainNode.gain.setValueAtTime(
          state.gainNode.gain.value,now
        );
        state.gainNode.gain.linearRampToValueAtTime(0,now+0.01);
        state.oscillator.stop(now+0.015);
      }catch(_){}

      // 等淡出完成后再断开旧节点，否则立即断开会让淡出失效并产生爆音。
      setTimeout(()=&gt;{
        nodes.forEach(n=&gt;{try{n.disconnect();}catch(_){}});
      },30);
    }

    // 立即释放引用；旧节点的断开由上面的定时器完成。
    state.oscillator=null;
    state.gainNode=null;
    state.splitter=null;
    state.merger=null;
    state.playing=false;
    el.play.textContent=&#x27;▶ 播放&#x27;;
  }

  function applyLiveParameter(id){
    let p;
    try{p=getParams();}catch(_){return;}

    if(!state.playing || !state.audioCtx || !state.oscillator)return;

    const ctx=state.audioCtx;
    const now=ctx.currentTime;

    if(id===&#x27;frequency&#x27;){
      state.oscillator.frequency.setTargetAtTime(p.f,now,0.003);
    }else if(id===&#x27;level&#x27;){
      state.gainNode.gain.setTargetAtTime(p.amp,now,0.003);
    }else if(id===&#x27;waveform&#x27;){
      state.oscillator.type=p.waveform;
    }else if(id===&#x27;channels&#x27;){
      // Rebuild only the routing portion, keeping the same oscillator and gain
      // alive, so the audible tone does not need to be stopped/restarted.
      if(state.splitter)try{state.splitter.disconnect();}catch(_){}
      if(state.merger)try{state.merger.disconnect();}catch(_){}

      const splitter=ctx.createChannelSplitter(2);
      const merger=ctx.createChannelMerger(2);

      state.gainNode.connect(splitter);

      if(p.channelMode===1){
        splitter.connect(merger,0,0);
      }else if(p.channelMode===3){
        splitter.connect(merger,0,1);
      }else{
        splitter.connect(merger,0,0);
        splitter.connect(merger,0,1);
      }
      merger.connect(ctx.destination);

      state.splitter=splitter;
      state.merger=merger;
    }else if(id===&#x27;sampleRate&#x27;){
      // AudioContext.sampleRate is immutable. Rebuild the context while
      // preserving the playback state; this is the only parameter that cannot
      // be changed in-place by Web Audio.
      const wasPlaying=state.playing;
      const oldCtx=state.audioCtx;
      state.playing=false;
      disconnectGraph();

      (async()=&gt;{
        try{
          await oldCtx.close();
          state.audioCtx=new (window.AudioContext||window.webkitAudioContext)({
            sampleRate:p.sr
          });
          await state.audioCtx.resume();
          createGraph(p);
          state.playing=wasPlaying;
          el.play.textContent=wasPlaying?&#x27;⏹ 停止&#x27;:&#x27;▶ 播放&#x27;;
        }catch(e){
          state.playing=false;
          el.play.textContent=&#x27;▶ 播放&#x27;;
        }
      })();
    }
  }

  function encodeWav(p,duration){
    const n=Math.max(1,Math.floor(duration*p.sr));
    const channels=2;
    const bits=24;
    const block=channels*3;
    const bytes=n*block;

    const buffer=new ArrayBuffer(44+bytes);
    const view=new DataView(buffer);

    const ws=(offset,str)=&gt;{
      for(let i=0;i&lt;str.length;i++)view.setUint8(offset+i,str.charCodeAt(i));
    };

    ws(0,&#x27;RIFF&#x27;);
    view.setUint32(4,36+bytes,true);
    ws(8,&#x27;WAVE&#x27;);
    ws(12,&#x27;fmt &#x27;);
    view.setUint32(16,16,true);
    view.setUint16(20,1,true);
    view.setUint16(22,channels,true);
    view.setUint32(24,p.sr,true);
    view.setUint32(28,p.sr*block,true);
    view.setUint16(32,block,true);
    view.setUint16(34,bits,true);
    ws(36,&#x27;data&#x27;);
    view.setUint32(40,bytes,true);

    const fadeN=Math.min(
      Math.floor(p.fade*p.sr),
      Math.floor(n/2)
    );

    let off=44;

    for(let i=0;i&lt;n;i++){
      let env=1;
      if(fadeN){
        if(i&lt;fadeN){
          env=0.5-0.5*Math.cos(Math.PI*i/fadeN);
        }else if(i&gt;=n-fadeN){
          env=0.5-0.5*Math.cos(
            Math.PI*(n-i-1)/fadeN
          );
        }
      }

      const phase=2*Math.PI*p.f*i/p.sr;
      const t=((phase/(2*Math.PI))%1+1)%1;
      let sample;

      if(p.waveform===&#x27;sine&#x27;){
        sample=Math.sin(phase);
      }else if(p.waveform===&#x27;triangle&#x27;){
        sample=1-4*Math.abs(Math.round(t)-t);
      }else if(p.waveform===&#x27;sawtooth&#x27;){
        sample=2*(t-Math.floor(t+0.5));
      }else{
        sample=t&lt;0.5?1:-1;
      }

      sample=clamp(sample*p.amp*env,-1,1);

      let q=Math.round(sample*8388607);
      if(q&lt;0)q+=16777216;

      const writeSample=active=&gt;{
        view.setUint8(off,active?q&amp;255:0);
        view.setUint8(off+1,active?(q&gt;&gt;8)&amp;255:0);
        view.setUint8(off+2,active?(q&gt;&gt;16)&amp;255:0);
        off+=3;
      };

      writeSample(p.channelMode===1 || p.channelMode===2);
      writeSample(p.channelMode===3 || p.channelMode===2);
    }

    return new Blob([buffer],{type:&#x27;audio/wav&#x27;});
  }

  function openDownloadSettings(){
    el.downloadModal.classList.add(&#x27;show&#x27;);
    el.downloadModal.setAttribute(&#x27;aria-hidden&#x27;,&#x27;false&#x27;);
    state.downloadOpen=true;
    el.downloadStatus.textContent=&#x27;当前参数将在生成时写入 WAV 文件。&#x27;;

    requestAnimationFrame(()=&gt;{
      el.downloadDuration.focus();
      el.downloadDuration.select();
    });
  }

  function closeDownloadSettings(){
    el.downloadModal.classList.remove(&#x27;show&#x27;);
    el.downloadModal.setAttribute(&#x27;aria-hidden&#x27;,&#x27;true&#x27;);
    state.downloadOpen=false;
  }

  function doDownload(){
    let p;
    try{p=getParams();}catch(e){
      el.downloadStatus.textContent=e.message;
      return;
    }

    const duration=Number(el.downloadDuration.value);
    if(!Number.isFinite(duration)||duration&lt;=0||duration&gt;3600){
      el.downloadStatus.textContent=&#x27;请输入 0.01–3600 秒的有效时长。&#x27;;
      return;
    }

    el.downloadStatus.textContent=&#x27;正在生成 WAV……&#x27;;

    setTimeout(()=&gt;{
      try{
        const blob=encodeWav(p,duration);
        const url=URL.createObjectURL(blob);
        const a=document.createElement(&#x27;a&#x27;);

        const wt={
          sine:&#x27;sine&#x27;,
          triangle:&#x27;triangle&#x27;,
          sawtooth:&#x27;saw&#x27;,
          square:&#x27;square&#x27;
        }[p.waveform];

        const ch=p.channelMode===1?&#x27;L&#x27;:p.channelMode===3?&#x27;R&#x27;:&#x27;LR&#x27;;

        a.href=url;
        a.download=
          `tone_${wt}_${p.f}Hz_${p.db}dBFS_${duration}s_${ch}.wav`;
        document.body.appendChild(a);
        a.click();
        a.remove();

        setTimeout(()=&gt;URL.revokeObjectURL(url),1000);

        el.downloadStatus.textContent=
          `已生成 ${duration} 秒测试信号并开始下载。`;

        setTimeout(closeDownloadSettings,700);
      }catch(e){
        el.downloadStatus.textContent=&#x27;生成失败：&#x27;+e.message;
      }
    },20);
  }

  function enableDragNumber(id,options){
    const input=$(id);
    let dragging=false;
    let startX=0;
    let startY=0;
    let startValue=0;

    input.style.cursor=&#x27;ew-resize&#x27;;
    input.title=&#x27;按住鼠标左键拖动调整；双击可直接输入&#x27;;

    input.addEventListener(&#x27;pointerdown&#x27;,e=&gt;{
      if(e.button!==0)return;
      dragging=true;
      startX=e.clientX;
      startY=e.clientY;
      startValue=Number(input.value)||0;
      input.setPointerCapture(e.pointerId);
      e.preventDefault();
    });

    input.addEventListener(&#x27;pointermove&#x27;,e=&gt;{
      if(!dragging)return;

      let delta=(e.clientX-startX)+(startY-e.clientY);
      let value=startValue+
        delta*(options.step||1)*(options.sensitivity||1);

      value=clamp(value,options.min,options.max);

      const decimals=String(options.step||1).includes(&#x27;.&#x27;)
        ? String(options.step).split(&#x27;.&#x27;)[1].length
        : 0;

      value=decimals?Number(value.toFixed(decimals)):Math.round(value);

      if(Number(input.value)!==value){
        input.value=value;
        input.dispatchEvent(new Event(&#x27;input&#x27;,{bubbles:true}));
      }
    });

    const end=e=&gt;{
      if(!dragging)return;
      dragging=false;
      try{
        if(input.hasPointerCapture(e.pointerId)){
          input.releasePointerCapture(e.pointerId);
        }
      }catch(_){}
    };

    input.addEventListener(&#x27;pointerup&#x27;,end);
    input.addEventListener(&#x27;pointercancel&#x27;,end);
    input.addEventListener(&#x27;dblclick&#x27;,()=&gt;input.select());
    input.addEventListener(&#x27;dragstart&#x27;,e=&gt;e.preventDefault());
  }

  function init(){
    enableDragNumber(&#x27;frequency&#x27;,{
      min:0,max:MAX_FREQ,step:1,sensitivity:2
    });

    enableDragNumber(&#x27;levelNum&#x27;,{
      min:-60,max:0,step:0.1,sensitivity:1
    });

    // All controls take effect immediately.
    el.frequency.addEventListener(&#x27;input&#x27;,()=&gt;{
      const p=getParams();
      el.frequency.value=p.f;
      updateFreqAxis();
      updateFrequencyDisplay();
      if(state.playing)applyLiveParameter(&#x27;frequency&#x27;);
    });

    el.level.addEventListener(&#x27;input&#x27;,()=&gt;{
      const raw=Number(el.level.value);
      const v=clamp(Number.isFinite(raw)?raw:-12,-60,0);
      el.levelNum.value=v;
      if(state.playing)applyLiveParameter(&#x27;level&#x27;);
    });

    el.levelNum.addEventListener(&#x27;input&#x27;,()=&gt;{
      const v=clamp(Number(el.levelNum.value),-60,0);
      el.levelNum.value=v;
      el.level.value=v;
      if(state.playing)applyLiveParameter(&#x27;level&#x27;);
    });

    el.waveform.addEventListener(&#x27;change&#x27;,()=&gt;{
      if(state.playing)applyLiveParameter(&#x27;waveform&#x27;);
    });

    el.channels.addEventListener(&#x27;change&#x27;,()=&gt;{
      if(state.playing)applyLiveParameter(&#x27;channels&#x27;);
    });

    el.sampleRate.addEventListener(&#x27;change&#x27;,()=&gt;{
      let p=getParams();
      if(p.f&gt;=p.sr/2){
        setFrequency(Math.max(0,Math.floor(p.sr/2)-1));
        p=getParams();
      }
      if(state.playing)applyLiveParameter(&#x27;sampleRate&#x27;);
    });

    el.play.addEventListener(&#x27;click&#x27;,startPlayback);

    el.download.addEventListener(&#x27;click&#x27;,openDownloadSettings);
    el.generateDownload.addEventListener(&#x27;click&#x27;,doDownload);
    el.cancelDownload.addEventListener(&#x27;click&#x27;,closeDownloadSettings);
    el.cancelDownloadBottom.addEventListener(&#x27;click&#x27;,closeDownloadSettings);

    el.downloadModal.addEventListener(&#x27;click&#x27;,e=&gt;{
      if(e.target===el.downloadModal)closeDownloadSettings();
    });

    document.addEventListener(&#x27;keydown&#x27;,e=&gt;{
      if(e.key===&#x27;Escape&#x27;&amp;&amp;state.downloadOpen){
        closeDownloadSettings();
      }
    });

    // Frequency axis: click anywhere or drag continuously.
    el.freqAxisWrap.addEventListener(&#x27;pointerdown&#x27;,e=&gt;{
      if(e.button!==0)return;
      // Shift+拖动：平移缩放后的视图；普通拖动仍是设定频率。
      if(e.shiftKey&amp;&amp;isZoomed()){
        state.axisPanning={startX:e.clientX,
          uMin:axisToU(state.viewMin),uMax:axisToU(state.viewMax)};
        e.preventDefault();
        return;
      }
      state.axisDragging=true;
      updateFrequencyFromPointer(e);
      e.preventDefault();
    });

    window.addEventListener(&#x27;pointermove&#x27;,e=&gt;{
      if(state.axisDragging)updateFrequencyFromPointer(e);
      else if(state.axisPanning)panDragTo(state.axisPanning,e.clientX,el.freqAxisWrap);
    });

    window.addEventListener(&#x27;pointerup&#x27;,()=&gt;{
      state.axisDragging=false;
      state.axisPanning=null;
    });

    window.addEventListener(&#x27;pointercancel&#x27;,()=&gt;{
      state.axisDragging=false;
      state.axisPanning=null;
    });

    // 滚轮：纵向缩放（以光标为锚点）；横向滚动或 Shift+滚轮平移视图。
    el.freqAxisWrap.addEventListener(&#x27;wheel&#x27;,e=&gt;{
      e.preventDefault();
      let dx=e.deltaX,dy=e.deltaY;
      if(e.deltaMode===1){dx*=16;dy*=16;}
      const rect=el.freqAxisWrap.getBoundingClientRect();
      const innerW=Math.max(1,rect.width-AXIS_PADDING*2);
      if(Math.abs(dx)&gt;Math.abs(dy)||(e.shiftKey&amp;&amp;dx===0&amp;&amp;dy!==0)){
        const uSpan=axisToU(state.viewMax)-axisToU(state.viewMin);
        panBy((Math.abs(dx)&gt;Math.abs(dy)?dx:dy)/innerW*uSpan);
        return;
      }
      const x=clamp(e.clientX-rect.left-AXIS_PADDING,0,innerW);
      const spanScale=clamp(Math.exp(dy*0.002),0.5,2);
      zoomAt(axisUnmap(x,innerW),spanScale);
    },{passive:false});

    document.querySelectorAll(&#x27;.zoom-btn&#x27;).forEach(btn=&gt;{
      btn.addEventListener(&#x27;click&#x27;,()=&gt;{
        const kind=btn.dataset.zoom;
        if(kind===&#x27;reset&#x27;){resetAxisView();return;}
        const c=axisFromU((axisToU(state.viewMin)+axisToU(state.viewMax))/2);
        zoomAt(c,kind===&#x27;in&#x27;?1/1.6:1.6);
      });
    });

    document.querySelectorAll(&#x27;.axis-mode&#x27;).forEach(button=&gt;{
      button.addEventListener(&#x27;click&#x27;,()=&gt;{
        document.querySelectorAll(&#x27;.axis-mode&#x27;)
          .forEach(b=&gt;b.classList.remove(&#x27;active&#x27;));
        button.classList.add(&#x27;active&#x27;);
        state.axisMode=button.dataset.axis;
        resetAxisView();
      });
    });

    document.querySelectorAll(&#x27;.card.collapsible .card-header&#x27;)
      .forEach(header=&gt;{
        header.addEventListener(&#x27;click&#x27;,()=&gt;{
          const card=header.closest(&#x27;.card&#x27;);
          const button=header.querySelector(&#x27;.card-toggle&#x27;);
          const collapsed=card.classList.toggle(&#x27;collapsed&#x27;);
          button.setAttribute(
            &#x27;aria-expanded&#x27;,
            String(!collapsed)
          );
          button.textContent=collapsed?&#x27;⌄&#x27;:&#x27;⌃&#x27;;
        });
      });

    window.addEventListener(&#x27;resize&#x27;,updateFreqAxis);

    updateFreqAxis();
    updateFrequencyDisplay();
  }

  // 暴露给消息监听器，主题切换时重绘 canvas
  window.updateFreqAxis=updateFreqAxis;
  window.getAxisView=()=>({min:state.viewMin,max:state.viewMax,zoomed:isZoomed()});

  if(document.readyState===&#x27;loading&#x27;){
    document.addEventListener(&#x27;DOMContentLoaded&#x27;,init);
  }else{
    init();
  }
})();
&lt;/script&gt;

&lt;html lang=&quot;zh-CN&quot;&gt;
&lt;head&gt;
&lt;meta charset=&quot;utf-8&quot;&gt;
&lt;meta name=&quot;viewport&quot; content=&quot;width=device-width,initial-scale=1&quot;&gt;
&lt;title&gt;KoyakaCAL - 扫频测试&lt;/title&gt;
&lt;style&gt;
/* ========== CSS 变量定义（提前定义） ========== */
:root{
  --bg:#1a1a1a;
  --card:#242424;
  --border:#3a3a3a;
  --text:#e8e8e8;
  --muted:#a0a0a0;
  --input:#1f1f1f;
  --accent:#4a4a4a;
  --accent2:#6b6b6b;
  --axis:#4a4a4a;
  --canvas-bg:#151515;
  --button-bg:#2a2a2a;
  --handle-bg:#e8e8e8;
  --handle-border:#6b6b6b;
  --range-highlight:rgba(107,107,107,.2);
  color-scheme:dark;
}

/* ========== 主题变量 ========== */
body.theme-light{
  --bg:#f7f3ea;
  --card:#fffdf8;
  --border:#ded7c9;
  --text:#25231f;
  --muted:#777064;
  --input:#fffefa;
  --accent:#8a8172;
  --accent2:#a69d8e;
  --axis:#b8af9f;
  --canvas-bg:#f0ebe2;
  --button-bg:#e8e2d8;
  --handle-bg:#25231f;
  --handle-border:#8a8172;
  --range-highlight:rgba(138,129,114,.15);
  color-scheme:light;
}

/* ========== 基础样式 ========== */
*{
  box-sizing:border-box;
  font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif;
}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
}
main{
  max-width:1050px;
  margin:0 auto;
  padding:38px 22px 50px;
}
h1{
  font-size:30px;
  margin:0 0 8px;
}
.sub{
  color:var(--muted);
  margin:0 0 28px;
}

/* ========== 卡片样式 ========== */
.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:14px;
  padding:22px;
  margin-bottom:18px;
}
.card.collapsible{
  padding:0;
  overflow:hidden;
}
.card-header{
  display:flex;
  align-items:center;
  gap:8px;
  height:42px;
  min-height:42px;
  padding:0 14px;
  cursor:pointer;
  user-select:none;
}
.card-toggle{
  width:24px;
  height:24px;
  padding:0;
  display:grid;
  place-items:center;
  border:0;
  background:transparent;
  color:#9eabc0;
  font-size:14px;
  line-height:1;
  cursor:pointer;
}
.card-title{
  font-size:14px;
  font-weight:600;
  color:var(--text);
}
.card-body{
  padding:0 22px 22px;
}
.card.collapsed .card-body{
  display:none;
}

/* ========== 表单控件 ========== */
.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:18px;
}
label{
  display:block;
  font-size:14px;
  color:var(--muted);
  margin-bottom:8px;
}
input,select,button{
  font:inherit;
}
input,select{
  width:100%;
  background:var(--input);
  color:var(--text);
  border:1px solid var(--border);
  border-radius:9px;
  padding:11px 12px;
  outline:none;
  transition:border-color .2s;
}
input:focus,select:focus{
  border-color:var(--accent2);
}
button{
  border:1px solid var(--border);
  border-radius:9px;
  padding:11px 18px;
  background:var(--button-bg);
  color:var(--text);
  cursor:pointer;
  transition:opacity .2s;
}
button.primary{
  background:var(--accent);
  border-color:var(--accent2);
}
button:disabled{
  opacity:.45;
  cursor:not-allowed;
}

/* ========== 扫频模式选择 ========== */
.modes{
  display:flex;
  gap:8px;
}
.mode{
  flex:1;
  cursor:pointer;
  padding:11px;
  border:1px solid var(--border);
  background:var(--input);
  color:var(--text);
  border-radius:9px;
}
.mode.active{
  background:var(--accent);
  border-color:var(--accent2);
  color:white;
}

/* ========== 数值输入 ========== */
.range-row{
  display:flex;
  gap:10px;
  align-items:center;
}
.range-row input[type=range]{
  padding:0;
}
.value{
  width:72px;
}

/* ========== 操作按钮 ========== */
.actions{
  display:flex;
  gap:12px;
  align-items:center;
  flex-wrap:wrap;
}

/* ========== 波形预览 ========== */
.canvas-wrap{
  height:260px;
  background:var(--canvas-bg);
  border:1px solid var(--border);
  border-radius:10px;
  overflow:hidden;
}
canvas{
  width:100%;
  height:100%;
  display:block;
}

/* ========== 播放控制 ========== */
.controls{
  display:grid;
  grid-template-columns:auto 1fr auto;
  gap:14px;
  align-items:center;
}
#play{
  font-size:17px;
  min-width:110px;
}
.time{
  font-variant-numeric:tabular-nums;
  color:var(--text);
  white-space:nowrap;
  opacity:.8;
}
.freq-settings{
  display:flex;
  align-items:center;
  gap:10px;
  margin-top:14px;
}
.freq-settings label{
  margin:0;
}
.freq-settings select{
  width:auto;
  min-width:120px;
}

/* ========== 频率显示（合并重复定义） ========== */
.freq-display{
  margin-top:18px;
  text-align:center;
  font-size:24px;
  font-weight:600;
  min-width:145px;
  color:var(--text);
  font-variant-numeric:tabular-nums;
  letter-spacing:.02em;
}
.freq-display small{
  display:block;
  font-size:12px;
  font-weight:400;
  color:var(--muted);
  margin-top:2px;
}

/* ========== 进度条 ========== */
.progress{
  width:100%;
  accent-color:var(--accent2);
}
.status{
  color:var(--muted);
  font-size:13px;
  min-height:20px;
  margin-top:10px;
}
.note{
  font-size:13px;
  color:var(--muted);
  line-height:1.6;
}

/* ========== 频率轴 ========== */
.range-head{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:18px;
  margin-bottom:14px;
}
.range-axis-mode{
  display:flex;
  gap:7px;
  flex-shrink:0;
}
.axis-mode{
  padding:8px 12px;
  font-size:13px;
}
.axis-mode.active{
  background:var(--accent);
  border-color:var(--accent2);
  color:white;
}
.freq-axis-wrap{
  position:relative;
  height:145px;
  background:var(--canvas-bg);
  border:1px solid var(--border);
  border-radius:10px;
  overflow:hidden;
  user-select:none;
  touch-action:none;
}
#freqAxis{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  display:block;
}

/* ========== 频率轴手柄 ========== */
.freq-handle{
  position:absolute;
  top:28px;
  height:82px;
  width:14px;
  transform:translateX(-50%);
  cursor:ew-resize;
  z-index:5;
  touch-action:none;
}
.freq-handle:before{
  content:&quot;&quot;;
  position:absolute;
  left:5px;
  top:12px;
  width:4px;
  height:58px;
  border-radius:3px;
  background:var(--handle-bg);
  box-shadow:0 0 0 2px var(--handle-border);
}
.freq-handle:after{
  content:&quot;&quot;;
  position:absolute;
  left:0;
  top:0;
  border-left:7px solid transparent;
  border-right:7px solid transparent;
  border-top:9px solid var(--handle-border);
}
.end-handle:after{
  top:auto;
  bottom:0;
  border-top:0;
  border-bottom:9px solid var(--handle-border);
}
.freq-handle-label{
  position:absolute;
  top:-25px;
  left:50%;
  transform:translateX(-50%);
  white-space:nowrap;
  background:var(--button-bg);
  border:1px solid var(--border);
  border-radius:5px;
  padding:2px 5px;
  color:var(--text);
  font-size:11px;
  font-variant-numeric:tabular-nums;
  pointer-events:none;
}
.end-handle .freq-handle-label{
  top:auto;
  bottom:-25px;
}
.freq-range-label{
  position:absolute;
  left:0;
  right:0;
  top:7px;
  text-align:center;
  color:var(--text);
  opacity:.7;
  font-size:12px;
  pointer-events:none;
}

/* ========== 当前频率指示器 ========== */
.current-freq-marker{
  position:absolute;
  top:0;
  bottom:0;
  width:1px;
  pointer-events:none;
  display:none;
  z-index:4;
}
.current-freq-text{
  position:absolute;
  bottom:13px;
  left:50%;
  transform:translateX(-50%);
  white-space:nowrap;
  background:var(--button-bg);
  border:1px solid var(--border);
  border-radius:6px;
  padding:3px 7px;
  color:var(--text);
  font-size:12px;
  font-variant-numeric:tabular-nums;
}
.current-freq-line{
  position:absolute;
  top:32px;
  bottom:0;
  width:1px;
  background:var(--handle-bg);
  opacity:.75;
}

/* ========== 主题控制 ========== */
.topbar{
  position:relative;
}
.theme-control{
  position:absolute;
  right:0;
  top:0;
  display:flex;
  align-items:center;
  gap:8px;
  z-index:20;
}
.theme-control label{
  font-size:13px;
  margin:0;
  color:var(--muted);
}
.theme-control select{
  width:auto;
  min-width:82px;
  padding:8px 10px;
}

/* ========== 响应式设计 ========== */
@media(max-width:800px){
  .grid{
    grid-template-columns:repeat(2,1fr);
  }
}
@media(max-width:520px){
  .grid{
    grid-template-columns:1fr;
  }
  .controls{
    grid-template-columns:1fr;
  }
  .time{
    order:3;
  }
}
&lt;/style&gt;

&lt;main&gt;
  &lt;div class=&quot;topbar&quot;&gt;&lt;div class=&quot;theme-control&quot; style=&quot;display:none!important&quot;&gt;

            &lt;input id=&quot;levelNum&quot; class=&quot;value&quot; type=&quot;number&quot; min=&quot;-60&quot; max=&quot;0&quot; step=&quot;0.1&quot; value=&quot;-12&quot; aria-label=&quot;输出电平数值&quot;&gt;
