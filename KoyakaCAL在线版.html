        &lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;freq-settings&quot;&gt;
        &lt;label for=&quot;freqPrecision&quot;&gt;频率显示精度&lt;/label&gt;
        &lt;select id=&quot;freqPrecision&quot;&gt;
          &lt;option value=&quot;0.01&quot;&gt;0.01 Hz&lt;/option&gt;
          &lt;option value=&quot;0.1&quot;&gt;0.1 Hz&lt;/option&gt;
          &lt;option value=&quot;1&quot; selected&gt;1 Hz&lt;/option&gt;
        &lt;/select&gt;
      &lt;/div&gt;
      &lt;div class=&quot;freq-display&quot; id=&quot;freqDisplay&quot;&gt;— Hz&lt;small&gt;当前频率&lt;/small&gt;&lt;/div&gt;
      &lt;p class=&quot;note&quot;&gt;生成的是 PCM WAV。电平按峰值 0 dBFS = 1.0 计算；-12 dBFS 对应峰值幅度约 0.2512。浏览器播放时实际声压级还取决于系统、声卡和监听设备音量。&lt;/p&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;!-- 波形预览 --&gt;
  &lt;section class=&quot;card collapsible collapsed&quot;&gt;
    &lt;div class=&quot;card-header&quot;&gt;
      &lt;button class=&quot;card-toggle&quot; aria-expanded=&quot;false&quot;&gt;⌄&lt;/button&gt;
      &lt;div class=&quot;card-title&quot;&gt;波形预览&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;card-body&quot;&gt;
      &lt;label&gt;波形预览&lt;/label&gt;
      &lt;div class=&quot;canvas-wrap&quot;&gt;
        &lt;canvas id=&quot;canvas&quot;&gt;&lt;/canvas&gt;
      &lt;/div&gt;
      &lt;div class=&quot;status&quot; id=&quot;status&quot;&gt;修改参数后会自动按照最新参数生成扫频。&lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;
&lt;/main&gt;

&lt;script&gt;
(function() {
  &#x27;use strict&#x27;;

  // ========== DOM 引用缓存 ==========
  const $ = id =&gt; document.getElementById(id);
  const elements = {
    modeButtons: document.querySelectorAll(&#x27;.mode&#x27;),
    axisModeButtons: document.querySelectorAll(&#x27;.axis-mode&#x27;),
    start: $(&#x27;start&#x27;),
    end: $(&#x27;end&#x27;),
    duration: $(&#x27;duration&#x27;),
    level: $(&#x27;level&#x27;),
    levelNum: $(&#x27;levelNum&#x27;),
    sampleRate: $(&#x27;sampleRate&#x27;),
    channels: $(&#x27;channels&#x27;),
    fade: $(&#x27;fade&#x27;),
    freqPrecision: $(&#x27;freqPrecision&#x27;),
    download: $(&#x27;download&#x27;),
    play: $(&#x27;play&#x27;),
    progress: $(&#x27;progress&#x27;),
    current: $(&#x27;current&#x27;),
    total: $(&#x27;total&#x27;),
    freqDisplay: $(&#x27;freqDisplay&#x27;),
    canvas: $(&#x27;canvas&#x27;),
    status: $(&#x27;status&#x27;),
    freqAxis: $(&#x27;freqAxis&#x27;),
    freqAxisWrap: $(&#x27;freqAxisWrap&#x27;),
    freqRangeLabel: $(&#x27;freqRangeLabel&#x27;),
    startHandle: $(&#x27;startHandle&#x27;),
    endHandle: $(&#x27;endHandle&#x27;),
    startHandleLabel: $(&#x27;startHandleLabel&#x27;),
    endHandleLabel: $(&#x27;endHandleLabel&#x27;),
    currentFreqMarker: $(&#x27;currentFreqMarker&#x27;),
    currentFreqText: $(&#x27;currentFreqText&#x27;)
  };

  // ========== 状态管理 ==========
  const state = {
    mode: &#x27;log&#x27;,
    axisMode: &#x27;log&#x27;,
    viewMin: 20,
    viewMax: 22000,
    audioBuffer: null,
    wavBlob: null,
    audioCtx: null,
    source: null,
    gainNode: null,
    startedAt: 0,
    playing: false,
    axisDragging: null,
    axisPanning: null,
    generationTimer: null,
    lockedParams: null
  };

  // ========== 播放期间参数锁定 ==========
  function captureLockedParams() {
    state.lockedParams = {
      mode: state.mode,
      axisMode: state.axisMode,
      start: elements.start.value,
      end: elements.end.value,
      duration: elements.duration.value,
      sampleRate: elements.sampleRate.value,
      channels: elements.channels.value,
      fade: elements.fade.value,
      level: elements.level.value,
      levelNum: elements.levelNum.value
    };
  }

  function rejectLockedParameter(id = null) {
    if (!state.playing || !state.lockedParams) return true;

    // 先记录播放前的参数，然后立即终止扫频。
    // 用户本次尝试修改的值不会被应用，随后恢复为播放前的值。
    const p = state.lockedParams;
    stop();

    if (id === 'mode') {
      state.mode = p.mode;
      elements.modeButtons.forEach(b => b.classList.toggle('active', b.dataset.mode === p.mode));
    } else if (id === 'axisMode') {
      state.axisMode = p.axisMode;
      elements.axisModeButtons.forEach(b => b.classList.toggle('active', b.dataset.axis === p.axisMode));
    } else {
      ['start','end','duration','sampleRate','channels','fade','level','levelNum'].forEach(key => {
        if (elements[key] && p[key] != null) elements[key].value = p[key];
      });
      elements.level.value = p.level;
      elements.levelNum.value = p.levelNum;
    }

    drawPreview();
    updateFreqAxis(null);
    alert('扫频过程中请勿更改参数');
    return false;
  }

  // ========== 常量 ==========
  const MAX_FREQ = 22000;
  const MIN_LOG_FREQ = 20;
  const AXIS_PADDING = 18;
  const AXIS_Y = 82;
  const STOP_FADE_DURATION = 0.05; // 50ms 淡出时间

  // ========== 工具函数 ==========
  function clamp(value, min, max) {
    return Math.max(min, Math.min(max, value));
  }

  function getPrecision() {
    return Number(elements.freqPrecision.value || 1);
  }

  function formatFreq(freq, usePrecision = true) {
    if (!Number.isFinite(freq)) return &#x27;— Hz&#x27;;
    
    const precision = usePrecision ? getPrecision() : 1;
    const v = Math.round(freq / precision) * precision;
    const digits = precision &lt; 1 ? Math.max(0, Math.ceil(-Math.log10(precision))) : 0;
    return `${v.toFixed(digits)} Hz`;
  }

  function formatFrequency(freq) {
    if (!Number.isFinite(freq)) return &#x27;— Hz&#x27;;
    
    const precision = getPrecision();
    const rounded = Math.round(freq / precision) * precision;
    
    if (rounded &gt;= 1000 &amp;&amp; precision &gt;= 1) {
      const decimals = Math.max(0, Math.ceil(Math.log10(1000 / precision)));
      return (rounded / 1000).toFixed(decimals) + &#x27; kHz&#x27;;
    }
    
    const decimals = Math.max(0, Math.ceil(-Math.log10(precision)));
    return rounded.toFixed(decimals) + &#x27; Hz&#x27;;
  }

  function fmt(t) {
    const m = Math.floor(t / 60);
    const s = (t % 60).toFixed(1).padStart(4, &#x27;0&#x27;);
    return `${m}:${s}`;
  }

  // ========== 频率轴映射 ==========
  function fullViewRange() {
    return state.axisMode === 'linear'
      ? { min: 0, max: MAX_FREQ }
      : { min: MIN_LOG_FREQ, max: MAX_FREQ };
  }

  function axisToU(f) { return state.axisMode === 'log' ? Math.log10(f) : f; }
  function axisFromU(u) { return state.axisMode === 'log' ? 10 ** u : u; }

  function isZoomed() {
    const full = fullViewRange();
    return state.viewMin > full.min + 1e-9 || state.viewMax < full.max - 1e-9;
  }

  function axisMap(freq, width) {
    if (state.axisMode === 'linear') {
      const span = state.viewMax - state.viewMin;
      return span > 0 ? clamp((freq - state.viewMin) / span * width, 0, width) : 0;
    }

    // 对数频率刻度
    if (freq <= 0) return 0;
    const lmin = Math.log10(state.viewMin);
    const lmax = Math.log10(state.viewMax);
    return clamp((Math.log10(freq) - lmin) / (lmax - lmin) * width, 0, width);
  }

  function axisUnmap(x, width) {
    x = clamp(x, 0, width);

    if (state.axisMode === 'linear') {
      return state.viewMin + x / width * (state.viewMax - state.viewMin);
    }

    const lmin = Math.log10(state.viewMin);
    const lmax = Math.log10(state.viewMax);
    return Math.pow(10, lmin + (lmax - lmin) * x / width);
  }

  // 刻度标签精度跟随缩放：step 越小，小数位越多。
  function fmtTick(f, step) {
    if (step != null && step >= 1000) {
      const d = Math.max(0, -Math.floor(Math.log10(step / 1000)));
      return (Math.round(f / step) * step / 1000).toFixed(d) + 'k';
    }
    const d = step ? Math.max(0, -Math.floor(Math.log10(step))) : 0;
    return (Math.round(f / step) * step).toFixed(d);
  }

  function fmtEdge(f) {
    const r = Math.round(f * 100) / 100;
    return Number.isInteger(r) ? String(r) : r.toFixed(2);
  }

  // 以 anchorFreq 为锚点缩放视图；spanScale 为可见跨度的缩放系数（<1 放大）。
  function zoomAt(anchorFreq, spanScale) {
    const full = fullViewRange();
    const fuMin = axisToU(full.min);
    const fuMax = axisToU(full.max);
    const uMin = axisToU(state.viewMin);
    const uMax = axisToU(state.viewMax);
    const spanU = uMax - uMin;
    if (!(spanU > 0)) return;
    const minSpanU = state.axisMode === 'log' ? 0.02 : 2;
    const newSpan = clamp(spanU * spanScale, minSpanU, fuMax - fuMin);
    const ratio = clamp((axisToU(anchorFreq) - uMin) / spanU, 0, 1);
    let nMin = axisToU(anchorFreq) - ratio * newSpan;
    let nMax = nMin + newSpan;
    if (nMin < fuMin) { nMin = fuMin; nMax = nMin + newSpan; }
    if (nMax > fuMax) { nMax = fuMax; nMin = nMax - newSpan; }
    state.viewMin = axisFromU(nMin);
    state.viewMax = axisFromU(nMax);
    updateFreqAxis();
  }

  function resetAxisView() {
    const full = fullViewRange();
    state.viewMin = full.min;
    state.viewMax = full.max;
    updateFreqAxis();
  }

  // 平移视图：deltaU 为坐标系（线性为 Hz，对数为 log10）内的位移，钳制在全范围内。
  function panBy(deltaU) {
    const full = fullViewRange();
    const fuMin = axisToU(full.min);
    const fuMax = axisToU(full.max);
    const spanU = axisToU(state.viewMax) - axisToU(state.viewMin);
    if (!(spanU > 0)) return;
    let uMin = axisToU(state.viewMin) + deltaU;
    let uMax = uMin + spanU;
    if (uMin < fuMin) { uMin = fuMin; uMax = fuMin + spanU; }
    if (uMax > fuMax) { uMax = fuMax; uMin = fuMax - spanU; }
    state.viewMin = axisFromU(uMin);
    state.viewMax = axisFromU(uMax);
    updateFreqAxis();
  }

  // 拖拽平移：以拖动开始时的视图为基准（抓取式），逐次绝对定位，避免漂移。
  function panDragTo(pan, clientX, wrap) {
    const rect = wrap.getBoundingClientRect();
    const innerW = Math.max(1, rect.width - AXIS_PADDING * 2);
    const full = fullViewRange();
    const fuMin = axisToU(full.min);
    const fuMax = axisToU(full.max);
    const spanU = pan.uMax - pan.uMin;
    let uMin = pan.uMin + (pan.startX - clientX) / innerW * spanU;
    let uMax = uMin + spanU;
    if (uMin < fuMin) { uMin = fuMin; uMax = fuMin + spanU; }
    if (uMax > fuMax) { uMax = fuMax; uMin = fuMax - spanU; }
    state.viewMin = axisFromU(uMin);
    state.viewMax = axisFromU(uMax);
    updateFreqAxis();
  }

  function getCurrentSweepFrequency(t, p) {
    t = clamp(t, 0, p.d);
    
    if (state.mode === &#x27;linear&#x27;) {
      return p.s + (p.e - p.s) * (t / p.d);
    }
    
    return p.s * Math.pow(p.e / p.s, t / p.d);
  }

  // ========== 参数处理 ==========
  function getParams() {
    const sRaw = Number(elements.start.value);
    const eRaw = Number(elements.end.value);
    const d = Number(elements.duration.value);
    
    if (!Number.isFinite(sRaw) || !Number.isFinite(eRaw) || !Number.isFinite(d) || d &lt;= 0) {
      throw new Error(&#x27;请输入有效的频率和扫频时间。&#x27;);
    }

    const s = clamp(sRaw, 0, MAX_FREQ);
    const e = clamp(eRaw, 0, MAX_FREQ);
    
    // 同步输入框
    elements.start.value = s;
    elements.end.value = e;
    
    if (s &gt;= e) {
      throw new Error(&#x27;起始频率必须小于结束频率。&#x27;);
    }
    
    const sr = Number(elements.sampleRate.value);
    if (s &gt;= sr / 2 || e &gt;= sr / 2) {
      throw new Error(`频率必须低于奈奎斯特频率 ${sr / 2} Hz。`);
    }
    
    if (state.mode === &#x27;log&#x27; &amp;&amp; (s &lt;= 0 || e &lt;= 0)) {
      throw new Error(&#x27;对数扫频的起始和结束频率必须大于 0 Hz。&#x27;);
    }

    const channelMode = Number(elements.channels.value);
    let ch, channelConfig;
    
    if (channelMode === 1) {
      // 仅左声道
      ch = 1;
      channelConfig = &#x27;left&#x27;;
    } else if (channelMode === 3) {
      // 仅右声道
      ch = 1;
      channelConfig = &#x27;right&#x27;;
    } else {
      // L+R（左右相同）
      ch = 2;
      channelConfig = &#x27;both&#x27;;
    }

    return {
      s,
      e,
      d,
      sr,
      amp: 10 ** (clamp(Number(elements.levelNum.value), -60, 0) / 20),
      ch,
      channelConfig,
      fade: Number(elements.fade.value)
    };
  }

  function phaseAt(t, p) {
    if (state.mode === &#x27;linear&#x27;) {
      const k = (p.e - p.s) / p.d;
      return 2 * Math.PI * (p.s * t + 0.5 * k * t * t);
    }
    
    const r = p.e / p.s;
    return 2 * Math.PI * p.s * p.d * (Math.pow(r, t / p.d) - 1) / Math.log(r);
  }

  // ========== 频率轴绘制 ==========
  function updateFreqAxis(currentFreq = null) {
    const wrap = elements.freqAxisWrap;
    const c = elements.freqAxis;
    if (!wrap || !c) return;
    
    const rect = wrap.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    
    c.width = Math.max(1, Math.round(rect.width * dpr));
    c.height = Math.max(1, Math.round(rect.height * dpr));
    
    const ctx = c.getContext(&#x27;2d&#x27;);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    
    const w = rect.width;
    const h = rect.height;
    ctx.clearRect(0, 0, w, h);

    // 动态获取 CSS 变量值
    const computedStyle = getComputedStyle(document.documentElement);
    const axisColor = computedStyle.getPropertyValue(&#x27;--axis&#x27;).trim();
    const borderColor = computedStyle.getPropertyValue(&#x27;--border&#x27;).trim();
    const mutedColor = computedStyle.getPropertyValue(&#x27;--muted&#x27;).trim();
    const accent2Color = computedStyle.getPropertyValue(&#x27;--accent2&#x27;).trim();
    const rangeHighlight = computedStyle.getPropertyValue(&#x27;--range-highlight&#x27;).trim();
    
    // 绘制轴线
    ctx.strokeStyle = axisColor;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(AXIS_PADDING, AXIS_Y);
    ctx.lineTo(w - AXIS_PADDING, AXIS_Y);
    ctx.stroke();

    // 绘制刻度
    ctx.fillStyle = mutedColor;
    ctx.font = &#x27;11px sans-serif&#x27;;
    ctx.textAlign = &#x27;center&#x27;;
    
    if (isZoomed()) {
      drawZoomTicks(ctx, w, h, axisColor, borderColor, mutedColor);
    } else if (state.axisMode === &#x27;linear&#x27;) {
      drawLinearTicks(ctx, w, borderColor, mutedColor);
    } else {
      drawLogTicks(ctx, w, h, axisColor, borderColor, mutedColor);
    }

    // 绘制频率范围
    const s = Number(elements.start.value);
    const e = Number(elements.end.value);
    const sx = AXIS_PADDING + axisMap(s, w - AXIS_PADDING * 2);
    const ex = AXIS_PADDING + axisMap(e, w - AXIS_PADDING * 2);
    const left = Math.min(sx, ex);
    const right = Math.max(sx, ex);
    
    ctx.fillStyle = rangeHighlight;
    ctx.fillRect(left, AXIS_Y - 26, right - left, 52);
    
    ctx.strokeStyle = accent2Color;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(sx, AXIS_Y - 26);
    ctx.lineTo(ex, AXIS_Y - 26);
    ctx.stroke();

    // 更新手柄位置
    elements.startHandle.style.left = sx + &#x27;px&#x27;;
    elements.endHandle.style.left = ex + &#x27;px&#x27;;
    elements.startHandleLabel.textContent = formatFreq(s);
    elements.endHandleLabel.textContent = formatFreq(e);
    elements.freqRangeLabel.textContent = `${formatFreq(s)}  →  ${formatFreq(e)}`;

    // 更新当前频率指示器（超出当前缩放视图时隐藏）
    const marker = elements.currentFreqMarker;
    const inView = currentFreq != null && Number.isFinite(currentFreq) &&
      currentFreq >= state.viewMin - 1e-9 && currentFreq <= state.viewMax + 1e-9;
    if (inView) {
      const mx = AXIS_PADDING + axisMap(currentFreq, w - AXIS_PADDING * 2);
      marker.style.left = mx + 'px';
      marker.style.display = 'block';
      elements.currentFreqText.textContent = formatFreq(currentFreq);
    } else {
      marker.style.display = 'none';
    }
  }

  function drawLinearTicks(ctx, w, borderColor, mutedColor) {
    const ticks = [0, 5000, 10000, 15000, 20000, MAX_FREQ];
    
    ticks.forEach(f =&gt; {
      const x = AXIS_PADDING + axisMap(f, w - AXIS_PADDING * 2);
      ctx.strokeStyle = borderColor;
      ctx.beginPath();
      ctx.moveTo(x, AXIS_Y - 10);
      ctx.lineTo(x, AXIS_Y + 10);
      ctx.stroke();
      ctx.fillStyle = mutedColor;
      ctx.fillText(f &gt;= 1000 ? `${f / 1000}k` : String(f), x, AXIS_Y + 27);
    });
  }

  function drawLogTicks(ctx, w, h, axisColor, borderColor, mutedColor) {
    const ticks = [];
    for (let decade = 10; decade &lt;= 10000; decade *= 10) {
      for (let n = 1; n &lt;= 9; n++) {
        const f = decade * n;
        if (f &gt;= MIN_LOG_FREQ &amp;&amp; f &lt;= MAX_FREQ) ticks.push(f);
      }
    }
    ticks.push(20000);
    
    const majorFreqs = new Set([20, 50, 100, 200, 500, 1000, 2000, 5000, 10000, 20000]);
    
    [...new Set(ticks)].sort((a, b) =&gt; a - b).forEach(f =&gt; {
      const x = AXIS_PADDING + axisMap(f, w - AXIS_PADDING * 2);
      if (x &lt; AXIS_PADDING || x &gt; w - AXIS_PADDING) return;
      
      const isMajor = majorFreqs.has(f);
      ctx.strokeStyle = isMajor ? axisColor : borderColor;
      ctx.beginPath();
      ctx.moveTo(x, AXIS_Y - (isMajor ? 11 : 5));
      ctx.lineTo(x, AXIS_Y + (isMajor ? 11 : 5));
      ctx.stroke();
      
      if (isMajor) {
        ctx.fillStyle = mutedColor;
        const shown = f &gt;= 1000 ? (f / 1000) + &#x27;k&#x27; : String(f);
        ctx.fillText(shown, x, AXIS_Y + 27);
      }
    });
    
    ctx.fillStyle = mutedColor;
    ctx.textAlign = 'left';
    ctx.fillText('0 Hz*', 4, h - 8);
    ctx.textAlign = 'right';
    ctx.fillText('22k Hz', w - 4, h - 8);
  }

  // 手动缩放视图：按可见范围生成均匀刻度，精度随缩放变化。
  function drawZoomTicks(ctx, w, h, axisColor, borderColor, mutedColor) {
    const innerW = w - AXIS_PADDING * 2;
    const span = state.viewMax - state.viewMin;
    const maxTicks = Math.max(2, Math.floor(innerW / 70));
    const raw = span / maxTicks;
    const pow = 10 ** Math.floor(Math.log10(raw));
    let step = 10 * pow;
    for (const m of [1, 2, 5, 10]) {
      if (raw <= m * pow) { step = m * pow; break; }
    }

    const pxPerUnit = innerW / span;
    const minorStep = step / (Math.round(step / pow) === 2 ? 4 : 5);
    if (minorStep * pxPerUnit >= 9) {
      ctx.strokeStyle = borderColor;
      for (let f = Math.ceil(state.viewMin / minorStep - 1e-9) * minorStep;
           f <= state.viewMax + 1e-9; f += minorStep) {
        const x = AXIS_PADDING + axisMap(f, innerW);
        ctx.beginPath();
        ctx.moveTo(x, AXIS_Y - 5);
        ctx.lineTo(x, AXIS_Y + 5);
        ctx.stroke();
      }
    }

    ctx.strokeStyle = axisColor;
    for (let f = Math.ceil(state.viewMin / step - 1e-9) * step;
         f <= state.viewMax + 1e-9; f += step) {
      const x = AXIS_PADDING + axisMap(f, innerW);
      ctx.beginPath();
      ctx.moveTo(x, AXIS_Y - 11);
      ctx.lineTo(x, AXIS_Y + 11);
      ctx.stroke();
      ctx.fillStyle = mutedColor;
      ctx.fillText(fmtTick(f, step), x, AXIS_Y + 27);
    }

    ctx.fillStyle = mutedColor;
    ctx.textAlign = 'left';
    ctx.fillText(fmtEdge(state.viewMin), 4, h - 8);
    ctx.textAlign = 'right';
    ctx.fillText(fmtEdge(state.viewMax), w - 4, h - 8);
    ctx.textAlign = 'center';
  }

  function updateAxisFromPlayback() {
    if (!state.playing || !state.audioBuffer) return;
    
    const t = Math.min(state.audioCtx.currentTime - state.startedAt, state.audioBuffer.duration);
    const p = {
      s: Number(elements.start.value),
      e: Number(elements.end.value),
      d: state.audioBuffer.duration
    };
    
    updateFreqAxis(getCurrentSweepFrequency(t, p));
  }

  // ========== 频率轴交互 ==========
  function axisPointerDown(e, which) {
    if (e.button !== 0) return;
    if (state.playing) { rejectLockedParameter(which); return; }
    
    state.axisDragging = which;
    elements.freqAxisWrap.setPointerCapture(e.pointerId);
    e.preventDefault();
  }

  function axisPointerMove(e) {
    if (!state.axisDragging || state.playing) return;
    
    const wrap = elements.freqAxisWrap;
    const rect = wrap.getBoundingClientRect();
    const x = clamp(e.clientX - rect.left, 0, rect.width);
    const mappedX = clamp(x - AXIS_PADDING, 0, rect.width - AXIS_PADDING * 2);
    
    let f = axisUnmap(mappedX, Math.max(1, rect.width - AXIS_PADDING * 2));
    f = clamp(Math.round(f), 0, MAX_FREQ);
    
    let s = Number(elements.start.value);
    let en = Number(elements.end.value);
    
    if (state.axisDragging === &#x27;start&#x27;) {
      s = Math.min(f, en);
    } else {
      en = Math.max(f, s);
    }
    
    elements.start.value = s;
    elements.end.value = en;
    elements.start.dispatchEvent(new Event(&#x27;input&#x27;, { bubbles: true }));
    updateFreqAxis(null);
  }

  function axisPointerUp(e) {
    state.axisDragging = null;
    if (elements.freqAxisWrap.hasPointerCapture?.(e.pointerId)) {
      elements.freqAxisWrap.releasePointerCapture(e.pointerId);
    }
  }

  // ========== 拖拽数值输入 ==========
  function enableDragNumber(id, options) {
    const el = $(id);
    let dragging = false;
    let startX = 0;
    let startY = 0;
    let startValue = 0;

    const clampValue = (v) =&gt; {
      if (options.min != null) v = Math.max(options.min, v);
      if (options.max != null) v = Math.min(options.max, v);
      return v;
    };
    
    const getDecimals = (step) =&gt; {
      const s = String(step);
      return s.includes(&#x27;.&#x27;) ? s.split(&#x27;.&#x27;)[1].length : 0;
    };
    
    const formatValue = (v) =&gt; {
      const d = getDecimals(options.step || 1);
      return d ? Number(v.toFixed(d)) : Math.round(v);
    };

    el.style.cursor = &#x27;ew-resize&#x27;;
    el.title = &#x27;按住鼠标左键向任意方向拖动调整数值；双击可直接输入&#x27;;

    el.addEventListener(&#x27;pointerdown&#x27;, (e) =&gt; {
      if (e.button !== 0) return;
      if (state.playing && ['start','end','duration','levelNum'].includes(id)) { rejectLockedParameter(id); return; }
      
      dragging = true;
      startX = e.clientX;
      startY = e.clientY;
      startValue = Number(el.value);
      el.setPointerCapture(e.pointerId);
      e.preventDefault();
    });

    el.addEventListener(&#x27;pointermove&#x27;, (e) =&gt; {
      if (!dragging) return;

      const dx = e.clientX - startX;
      const dy = startY - e.clientY;
      let delta = (dx + dy) * (options.sensitivity || 1) * (options.step || 1);

      if (e.shiftKey) delta *= 0.2;
      if (e.altKey) delta *= 5;

      const v = formatValue(clampValue(startValue + delta));

      if (String(el.value) !== String(v)) {
        el.value = v;
        el.dispatchEvent(new Event(&#x27;input&#x27;, { bubbles: true }));
      }
    });

    const endDrag = (e) =&gt; {
      if (!dragging) return;
      
      dragging = false;
      if (e &amp;&amp; el.hasPointerCapture(e.pointerId)) {
        el.releasePointerCapture(e.pointerId);
      }
    };

    el.addEventListener(&#x27;pointerup&#x27;, endDrag);
    el.addEventListener(&#x27;pointercancel&#x27;, endDrag);
    el.addEventListener(&#x27;dblclick&#x27;, () =&gt; { el.select(); });
    el.addEventListener(&#x27;dragstart&#x27;, (e) =&gt; e.preventDefault());
  }

  // ========== 波形预览 ==========
  function drawPreview() {
    const c = elements.canvas;
    const rect = c.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    
    c.width = Math.max(1, rect.width * dpr);
    c.height = Math.max(1, rect.height * dpr);
    
    const ctx = c.getContext(&#x27;2d&#x27;);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    
    const w = rect.width;
    const h = rect.height;
    ctx.clearRect(0, 0, w, h);
    
    try {
      const p = getParams();
      const N = Math.min(5000, Math.max(1000, Math.floor(w * 8)));
      
      const computedStyle = getComputedStyle(document.documentElement);
      const accent2Color = computedStyle.getPropertyValue(&#x27;--accent2&#x27;).trim();
      const mutedColor = computedStyle.getPropertyValue(&#x27;--muted&#x27;).trim();
      
      ctx.strokeStyle = accent2Color;
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      
      for (let i = 0; i &lt; N; i++) {
        const t = p.d * i / (N - 1);
        const y = h / 2 - (p.amp * 0.9 * h / 2) * Math.sin(phaseAt(t, p));
        const x = w * i / (N - 1);
        
        if (i) {
          ctx.lineTo(x, y);
        } else {
          ctx.moveTo(x, y);
        }
      }
      
      ctx.stroke();
      
      ctx.fillStyle = mutedColor;
      ctx.font = &#x27;12px sans-serif&#x27;;
      ctx.fillText(`${p.s} Hz`, 8, h - 10);
      ctx.textAlign = &#x27;right&#x27;;
      ctx.fillText(`${p.e} Hz`, w - 8, h - 10);
      ctx.textAlign = &#x27;left&#x27;;
      
      const channelText = p.channelConfig === &#x27;left&#x27; ? &#x27;L&#x27; : p.channelConfig === &#x27;right&#x27; ? &#x27;R&#x27; : &#x27;L+R&#x27;;
      elements.status.textContent = `${state.mode === &#x27;linear&#x27; ? &#x27;线性&#x27; : &#x27;对数&#x27;}扫频 · ${p.s} Hz → ${p.e} Hz · ${p.d} s · ${Number(elements.levelNum.value).toFixed(1)} dBFS · ${channelText}`;
    } catch (e) {
      elements.status.textContent = e.message;
    }
  }

  // ========== 音频生成 ==========
  function makeBuffer(p) {
    const n = Math.floor(p.d * p.sr);
    const data = new Float32Array(n);
    const fadeN = Math.min(Math.floor(p.fade * p.sr), Math.floor(n / 2));
    
    for (let i = 0; i &lt; n; i++) {
      const t = i / p.sr;
      let g = 1;
      
      if (fadeN) {
        if (i &lt; fadeN) {
          g = 0.5 - 0.5 * Math.cos(Math.PI * i / fadeN);
        }
        if (i &gt;= n - fadeN) {
          g = 0.5 - 0.5 * Math.cos(Math.PI * (n - i - 1) / fadeN);
        }
      }
      
      data[i] = p.amp * g * Math.sin(phaseAt(t, p));
    }
    
    const AC = window.AudioContext || window.webkitAudioContext;
    const ac = new AC({ sampleRate: p.sr });
    
    // 始终输出双声道缓冲（单声道配置时另一声道静音）
    const buf = ac.createBuffer(2, n, p.sr);
    
    if (p.channelConfig === &#x27;both&#x27;) {
      // L+R：左右声道相同
      buf.copyToChannel(data, 0);
      buf.copyToChannel(data, 1);
    } else if (p.channelConfig === &#x27;left&#x27;) {
      // 仅左声道：左声道有数据，右声道静音
      buf.copyToChannel(data, 0);
      buf.copyToChannel(new Float32Array(n), 1);
    } else {
      // 仅右声道：右声道有数据，左声道静音
      buf.copyToChannel(new Float32Array(n), 0);
      buf.copyToChannel(data, 1);
    }
    
    // 异步关闭上下文
    setTimeout(() =&gt; ac.close().catch(() =&gt; {}), 0);
    
    return { buf, data, n };
  }

  function encodeWav(data, p) {
    const channels = 2; // 所有模式都输出2声道
    const bits = 24;
    const block = channels * bits / 8;
    const bytes = data.length * block;
    const out = new ArrayBuffer(44 + bytes);
    const v = new DataView(out);
    
    const writeString = (offset, str) =&gt; {
      for (let i = 0; i &lt; str.length; i++) {
        v.setUint8(offset + i, str.charCodeAt(i));
      }
    };
    
    writeString(0, &#x27;RIFF&#x27;);
    v.setUint32(4, 36 + bytes, true);
    writeString(8, &#x27;WAVE&#x27;);
    writeString(12, &#x27;fmt &#x27;);
    v.setUint32(16, 16, true);
    v.setUint16(20, 1, true);
    v.setUint16(22, channels, true);
    v.setUint32(24, p.sr, true);
    v.setUint32(28, p.sr * block, true);
    v.setUint16(32, block, true);
    v.setUint16(34, bits, true);
    writeString(36, &#x27;data&#x27;);
    v.setUint32(40, bytes, true);
    
    let offset = 44;
    for (let i = 0; i &lt; data.length; i++) {
      const x = clamp(data[i], -1, 1);
      let q = Math.round(x * 8388607);
      if (q &lt; 0) q += 16777216;
      
      // 写入左声道
      if (p.channelConfig === &#x27;both&#x27; || p.channelConfig === &#x27;left&#x27;) {
        v.setUint8(offset, q &amp; 255);
        v.setUint8(offset + 1, (q &gt;&gt; 8) &amp; 255);
        v.setUint8(offset + 2, (q &gt;&gt; 16) &amp; 255);
      } else {
        // 左声道静音
        v.setUint8(offset, 0);
        v.setUint8(offset + 1, 0);
        v.setUint8(offset + 2, 0);
      }
      offset += 3;
      
      // 写入右声道
      if (p.channelConfig === &#x27;both&#x27; || p.channelConfig === &#x27;right&#x27;) {
        v.setUint8(offset, q &amp; 255);
        v.setUint8(offset + 1, (q &gt;&gt; 8) &amp; 255);
        v.setUint8(offset + 2, (q &gt;&gt; 16) &amp; 255);
      } else {
        // 右声道静音
        v.setUint8(offset, 0);
        v.setUint8(offset + 1, 0);
        v.setUint8(offset + 2, 0);
      }
      offset += 3;
    }
    
    return new Blob([out], { type: &#x27;audio/wav&#x27; });
  }

  async function generateSweep() {
    try {
      stop();
      const p = getParams();

      elements.status.textContent = '正在根据最新参数生成扫频……';

      await new Promise(resolve => setTimeout(resolve, 10));

      const made = makeBuffer(p);
      state.audioBuffer = made.buf;
      state.wavBlob = encodeWav(made.data, p);

      elements.download.disabled = false;
      elements.play.disabled = false;
      elements.total.textContent = fmt(p.d);
      elements.current.textContent = '0:00.0';
      elements.progress.value = 0;
      updateFreqAxis(null);

      elements.status.textContent = '扫频已自动更新，可以播放或下载 WAV。';
    } catch (e) {
      elements.download.disabled = true;
      elements.play.disabled = true;
      elements.status.textContent = e.message;
    }
  }

  function setPlaybackParameterLock(locked) {
    const parameterIds = ['start', 'end', 'duration', 'sampleRate', 'channels', 'fade', 'level', 'levelNum'];
    parameterIds.forEach(id => {
      if (elements[id]) elements[id].disabled = locked;
    });

    elements.modeButtons.forEach(btn => {
      btn.disabled = locked;
      btn.setAttribute('aria-disabled', locked ? 'true' : 'false');
    });

    if (locked) state.axisDragging = null;
  }

  function scheduleGeneration() {
    clearTimeout(state.generationTimer);
    if (state.playing) return;
    state.generationTimer = setTimeout(generateSweep, 80);
  }

  // ========== 播放控制 ==========
  function resetDisplay() {
    elements.play.textContent = &#x27;▶ 播放&#x27;;
    elements.current.textContent = &#x27;0:00.0&#x27;;
    elements.progress.value = 0;
    elements.freqDisplay.innerHTML = `— Hz&lt;small&gt;当前频率&lt;/small&gt;`;
    updateFreqAxis(null);
  }

  function stop() {
    if (state.source) {
      try {
        // 使用 GainNode 进行快速淡出，避免直流爆音
        if (state.gainNode && state.audioCtx) {
          const currentTime = state.audioCtx.currentTime;
          state.gainNode.gain.cancelScheduledValues(currentTime);
          state.gainNode.gain.setValueAtTime(state.gainNode.gain.value || 1, currentTime);
          state.gainNode.gain.linearRampToValueAtTime(0, currentTime + STOP_FADE_DURATION);

          // 在淡出完成后停止音频源
          state.source.stop(currentTime + STOP_FADE_DURATION + 0.01);
        } else {
          state.source.stop();
        }
      } catch (e) {
        // 忽略已经停止的音频源
      }

      // 等淡出完成后再断开，否则节点被立即断开会让淡出失效并产生爆音。
      const src = state.source, gain = state.gainNode;
      src.onended = null;
      setTimeout(() =&gt; {
        try { src.disconnect(); } catch (e) {}
        try { gain.disconnect(); } catch (e) {}
      }, STOP_FADE_DURATION * 1000 + 40);
      state.source = null;
      state.gainNode = null;
    }

    state.playing = false;
    setPlaybackParameterLock(false);
    resetDisplay();
  }

  function currentFrequency(t) {
    const start = Number(elements.start.value);
    const end = Number(elements.end.value);
    const d = Number(elements.duration.value);

    if (!Number.isFinite(start) || !Number.isFinite(end) || !Number.isFinite(d) || d &lt;= 0) {
      return NaN;
    }

    return getCurrentSweepFrequency(t, { s: start, e: end, d });
  }

  function updateTime() {
    const t = state.playing &amp;&amp; state.audioCtx ? 
      Math.min(state.audioCtx.currentTime - state.startedAt, state.audioBuffer.duration) : 
      0;
    
    elements.current.textContent = fmt(t);
    elements.progress.value = state.audioBuffer ? t / state.audioBuffer.duration : 0;
    elements.freqDisplay.innerHTML = `${formatFrequency(currentFrequency(t))}&lt;small&gt;当前频率&lt;/small&gt;`;
  }

  function tick() {
    if (!state.playing) return;
    
    updateTime();
    updateAxisFromPlayback();
    
    if (state.playing) {
      requestAnimationFrame(tick);
    }
  }

  async function togglePlay() {
    if (!state.audioBuffer) return;
    
    if (state.playing) {
      // 停止播放（带淡出）
      stop();
      return;
    }
    
    if (!state.audioCtx) {
      state.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    
    await state.audioCtx.resume();
    
    // 创建音频源和增益节点
    state.source = state.audioCtx.createBufferSource();
    state.source.buffer = state.audioBuffer;
    
    // 创建 GainNode 用于控制音量（主要用于淡出）
    state.gainNode = state.audioCtx.createGain();
    state.gainNode.gain.value = 1;

    // 连接：source -&gt; gainNode -&gt; destination
    state.source.connect(state.gainNode);
    state.gainNode.connect(state.audioCtx.destination);
    
    // 每次从起始位置开始播放
    state.startedAt = state.audioCtx.currentTime;
    
    // 校验声源身份：stop 后快速重播时，旧声源的迟到 onended 不得打断新播放。
    const src = state.source;
    src.onended = () =&gt; {
      if (state.playing && state.source === src) {
        state.playing = false;
        setPlaybackParameterLock(false);
        resetDisplay();
      }
    };

    src.start(0);
    captureLockedParams();
    state.playing = true;
    setPlaybackParameterLock(true);
    elements.play.textContent = &#x27;⏹ 停止&#x27;;
    updateAxisFromPlayback();
    requestAnimationFrame(tick);
  }

  // ========== 事件监听 ==========
  function initEventListeners() {
    // 模式按钮
    elements.modeButtons.forEach(btn =&gt; {
      btn.addEventListener(&#x27;click&#x27;, () =&gt; {
        if (state.playing) { rejectLockedParameter('mode'); return; }
        elements.modeButtons.forEach(b =&gt; b.classList.remove(&#x27;active&#x27;));
        btn.classList.add(&#x27;active&#x27;);
        state.mode = btn.dataset.mode;
        drawPreview();
      });
    });

    // 轴模式按钮
    elements.axisModeButtons.forEach(btn =&gt; {
      btn.addEventListener(&#x27;click&#x27;, () =&gt; {
        if (state.playing) { rejectLockedParameter('axisMode'); return; }
        elements.axisModeButtons.forEach(b =&gt; b.classList.remove('active'));
        btn.classList.add('active');
        state.axisMode = btn.dataset.axis;
        resetAxisView();
      });
    });

    // 滚轮：纵向缩放（以光标为锚点）；横向滚动或 Shift+滚轮平移视图。
    // 平移仅改变视图，不触碰扫频参数锁。
    elements.freqAxisWrap.addEventListener('wheel', e =&gt; {
      e.preventDefault();
      let dx = e.deltaX, dy = e.deltaY;
      if (e.deltaMode === 1) { dx *= 16; dy *= 16; }
      const rect = elements.freqAxisWrap.getBoundingClientRect();
      const innerW = Math.max(1, rect.width - AXIS_PADDING * 2);
      if (Math.abs(dx) &gt; Math.abs(dy) || (e.shiftKey &amp;&amp; dx === 0 &amp;&amp; dy !== 0)) {
        const uSpan = axisToU(state.viewMax) - axisToU(state.viewMin);
        panBy((Math.abs(dx) &gt; Math.abs(dy) ? dx : dy) / innerW * uSpan);
        return;
      }
      const x = clamp(e.clientX - rect.left - AXIS_PADDING, 0, innerW);
      const spanScale = clamp(Math.exp(dy * 0.002), 0.5, 2);
      zoomAt(axisUnmap(x, innerW), spanScale);
    }, { passive: false });

    document.querySelectorAll('.zoom-btn').forEach(btn =&gt; {
      btn.addEventListener('click', () =&gt; {
        const kind = btn.dataset.zoom;
        if (kind === 'reset') { resetAxisView(); return; }
        const c = axisFromU((axisToU(state.viewMin) + axisToU(state.viewMax)) / 2);
        zoomAt(c, kind === 'in' ? 1 / 1.6 : 1.6);
      });
    });

    // 空白处拖拽平移视图（手柄拖拽仍用于调整起始 / 结束频率）。
    elements.freqAxisWrap.addEventListener('pointerdown', e =&gt; {
      if (e.button !== 0) return;
      if (e.target.closest &amp;&amp; e.target.closest('.freq-handle')) return;
      if (!isZoomed()) return;
      state.axisPanning = {
        startX: e.clientX,
        uMin: axisToU(state.viewMin),
        uMax: axisToU(state.viewMax)
      };
      try { elements.freqAxisWrap.setPointerCapture(e.pointerId); } catch (err) {}
      e.preventDefault();
    });
    elements.freqAxisWrap.addEventListener('pointermove', e =&gt; {
      if (state.axisPanning) panDragTo(state.axisPanning, e.clientX, elements.freqAxisWrap);
    });
    const endAxisPan = () =&gt; { state.axisPanning = null; };
    elements.freqAxisWrap.addEventListener('pointerup', endAxisPan);
    elements.freqAxisWrap.addEventListener('pointercancel', endAxisPan);

    // 电平：播放期间参数被锁定，修改会被拒绝并终止扫频。
    elements.level.addEventListener(&#x27;input&#x27;, () =&gt; {
      if (state.playing) { rejectLockedParameter('level'); return; }
      elements.levelNum.value = elements.level.value;
      drawPreview();
      scheduleGeneration();
    });

    elements.levelNum.addEventListener(&#x27;input&#x27;, () =&gt; {
      if (state.playing) { rejectLockedParameter('levelNum'); return; }
      elements.level.value = clamp(Number(elements.levelNum.value), -60, 0);
      drawPreview();
      scheduleGeneration();
    });

    // 参数输入
    [&#x27;start&#x27;, &#x27;end&#x27;, &#x27;duration&#x27;, &#x27;sampleRate&#x27;, &#x27;channels&#x27;, &#x27;fade&#x27;].forEach(id =&gt; {
      elements[id].addEventListener(&#x27;input&#x27;, () =&gt; {
        if (state.playing) { rejectLockedParameter(id); return; }
        drawPreview();
        
        const currentFreq = state.playing
          ? getCurrentSweepFrequency(state.audioCtx.currentTime - state.startedAt, {
              s: Number(elements.start.value),
              e: Number(elements.end.value),
              d: state.audioBuffer?.duration || Number(elements.duration.value)
            })
          : null;
        
        updateFreqAxis(currentFreq);
        scheduleGeneration();
      });
      
      elements[id].addEventListener(&#x27;change&#x27;, () =&gt; {
        if (state.playing) { rejectLockedParameter(id); return; }
        scheduleGeneration();
      });
    });

    // 频率精度
    elements.freqPrecision.addEventListener(&#x27;input&#x27;, () =&gt; {
      const currentFreq = state.playing
        ? getCurrentSweepFrequency(state.audioCtx.currentTime - state.startedAt, {
            s: Number(elements.start.value),
            e: Number(elements.end.value),
            d: state.audioBuffer?.duration || Number(elements.duration.value)
          })
        : null;
      
      updateFreqAxis(currentFreq);
    });
    
    elements.freqPrecision.addEventListener(&#x27;change&#x27;, updateTime);

    // 播放和下载
    elements.play.addEventListener(&#x27;click&#x27;, togglePlay);
    
    elements.download.addEventListener(&#x27;click&#x27;, () =&gt; {
      if (!state.wavBlob) return;
      
      const a = document.createElement(&#x27;a&#x27;);
      a.href = URL.createObjectURL(state.wavBlob);
      const channelText = elements.channels.value === &#x27;1&#x27; ? &#x27;L&#x27; : elements.channels.value === &#x27;3&#x27; ? &#x27;R&#x27; : &#x27;LR&#x27;;
      a.download = `sweep_${state.mode}_${elements.start.value}-${elements.end.value}Hz_${elements.duration.value}s_${channelText}.wav`;
      a.click();
      
      setTimeout(() =&gt; URL.revokeObjectURL(a.href), 1000);
    });

    // 频率轴拖拽
    elements.startHandle.addEventListener(&#x27;pointerdown&#x27;, e =&gt; axisPointerDown(e, &#x27;start&#x27;));
    elements.endHandle.addEventListener(&#x27;pointerdown&#x27;, e =&gt; axisPointerDown(e, &#x27;end&#x27;));
    elements.freqAxisWrap.addEventListener(&#x27;pointermove&#x27;, axisPointerMove);
    elements.freqAxisWrap.addEventListener(&#x27;pointerup&#x27;, axisPointerUp);
    elements.freqAxisWrap.addEventListener(&#x27;pointercancel&#x27;, axisPointerUp);

    // 折叠面板
    document.querySelectorAll(&#x27;.card.collapsible .card-header&#x27;).forEach(header =&gt; {
      header.addEventListener(&#x27;click&#x27;, () =&gt; {
        const card = header.closest(&#x27;.card&#x27;);
        const button = header.querySelector(&#x27;.card-toggle&#x27;);
        const collapsed = card.classList.toggle(&#x27;collapsed&#x27;);
        
        button.setAttribute(&#x27;aria-expanded&#x27;, String(!collapsed));
        button.textContent = collapsed ? &#x27;⌄&#x27; : &#x27;⌃&#x27;;
      });
    });
  }

  // ========== ResizeObserver ==========
  function initResizeObservers() {
    const previewObserver = new ResizeObserver(drawPreview);
    previewObserver.observe(elements.canvas);
    
    const axisObserver = new ResizeObserver(() =&gt; updateFreqAxis());
    axisObserver.observe(elements.freqAxisWrap);
    
    // 保存引用以便清理
    window._observers = { previewObserver, axisObserver };
  }

  // ========== 初始化 ==========
  function init() {
    // 启用拖拽数值输入
    enableDragNumber(&#x27;start&#x27;, { min: 0, max: MAX_FREQ, step: 1, sensitivity: 2 });
    enableDragNumber(&#x27;end&#x27;, { min: 0, max: MAX_FREQ, step: 1, sensitivity: 2 });
    enableDragNumber(&#x27;duration&#x27;, { min: 0.1, max: 600, step: 0.1, sensitivity: 1 });

    initEventListeners();
    initResizeObservers();
    
    drawPreview();
    updateFreqAxis();
    scheduleGeneration();
  }

  // 暴露给消息监听器，主题切换时重绘 canvas
  window.updateFreqAxis = updateFreqAxis;
  window.drawPreview = drawPreview;
  window.getAxisView = () => ({ min: state.viewMin, max: state.viewMax, zoomed: isZoomed() });

  // 页面加载完成后初始化
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();

    &lt;div class=&quot;download-dialog-body&quot;&gt;
      &lt;label for=&quot;downloadDuration&quot;&gt;测试信号时长（秒）&lt;/label&gt;
      &lt;input id=&quot;downloadDuration&quot; type=&quot;number&quot; min=&quot;0.01&quot; max=&quot;3600&quot; step=&quot;0.1&quot; value=&quot;10&quot;&gt;
      &lt;div class=&quot;download-dialog-preview&quot; id=&quot;downloadStatus&quot;&gt;当前参数将在生成时写入 WAV 文件。&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;download-dialog-actions&quot;&gt;
      &lt;button id=&quot;cancelDownloadBottom&quot;&gt;取消&lt;/button&gt;
      &lt;button id=&quot;generateDownload&quot; class=&quot;primary&quot;&gt;生成并下载&lt;/button&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;

&lt;script&gt;
(function(){
  &#x27;use strict&#x27;;

  const $ = id =&gt; document.getElementById(id);
  const el = {
    noiseType:$(&#x27;noiseType&#x27;),
    level:$(&#x27;level&#x27;),
    levelNum:$(&#x27;levelNum&#x27;),
    sampleRate:$(&#x27;sampleRate&#x27;),
    channels:$(&#x27;channels&#x27;),
    fade:$(&#x27;fade&#x27;),
    download:$(&#x27;download&#x27;),
    play:$(&#x27;play&#x27;),
    levelDisplay:$(&#x27;levelDisplay&#x27;),
    downloadModal:$(&#x27;downloadModal&#x27;),
    downloadDuration:$(&#x27;downloadDuration&#x27;),
    generateDownload:$(&#x27;generateDownload&#x27;),
    cancelDownload:$(&#x27;cancelDownload&#x27;),
    cancelDownloadBottom:$(&#x27;cancelDownloadBottom&#x27;),
    downloadStatus:$(&#x27;downloadStatus&#x27;)
  };

  const state = {
    playing:false,
    downloadOpen:false,
    liveChangeTimer:null,
    restartGen:0,
    audioCtx:null,
    source:null,
    gainNode:null,
    buffer:null,
    generated:{}
  };

  const clamp=(v,min,max)=&gt;Math.max(min,Math.min(max,v));

  function getParams(){
    const sr=Number(el.sampleRate.value);
    let db=Number(el.levelNum.value);
    if(!Number.isFinite(sr)) throw new Error(&#x27;采样率无效。&#x27;);
    if(!Number.isFinite(db)) db=-12;
    db=clamp(db,-60,0);
    el.level.value=db;
    el.levelNum.value=db;
    return {
      sr,
      db,
      amp:10**(db/20),
      type:el.noiseType.value,
      channelMode:Number(el.channels.value),
      fade:Number(el.fade.value)
    };
  }

  function formatDb(db){
    const v=Number(db);
    return `${v.toFixed(1).replace(/\.0$/,&#x27;&#x27;)} dBFS`;
  }

  function updateLevelDisplay(){
    const p=getParams();
    el.levelDisplay.innerHTML=formatDb(p.db)+&#x27;&lt;small&gt;当前电平&lt;/small&gt;&#x27;;
  }

  function gaussian(){
    let u=0,v=0;
    while(u===0)u=Math.random();
    while(v===0)v=Math.random();
    return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);
  }

  // 生成一段独立噪声缓冲，并按 RMS 目标电平标定。
  // createBuffer=false 时跳过播放用 AudioBuffer（下载路径只需要 data）。
  function makeNoiseBuffer(p,duration,createBuffer=true){
    const n=Math.max(1,Math.floor(duration*p.sr));
    const data=new Float32Array(n);
    let sumSq=0;

    if(p.type===&#x27;white&#x27;){
      for(let i=0;i&lt;n;i++){
        const x=gaussian();
        data[i]=x;
        sumSq+=x*x;
      }
    }else{
      // Paul Kellet 风格粉噪滤波器。
      let b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0;
      for(let i=0;i&lt;n;i++){
        const w=gaussian();
        b0=0.99886*b0+w*0.0555179;
        b1=0.99332*b1+w*0.0750759;
        b2=0.96900*b2+w*0.1538520;
        b3=0.86650*b3+w*0.3104856;
        b4=0.55000*b4+w*0.5329522;
        b5=-0.7616*b5-w*0.0168980;
        const x=b0+b1+b2+b3+b4+b5+b6+w*0.5362;
        b6=w*0.115926;
        data[i]=x;
        sumSq+=x*x;
      }
    }

    const rms=Math.sqrt(sumSq/n)||1;
    const scale=p.amp/rms;
    for(let i=0;i&lt;n;i++){
      let env=1;
      if(p.fade){
        const fadeN=Math.min(Math.floor(p.fade*p.sr),Math.floor(n/2));
        if(i&lt;fadeN) env=0.5-0.5*Math.cos(Math.PI*i/fadeN);
        else if(i&gt;=n-fadeN) env=0.5-0.5*Math.cos(Math.PI*(n-i-1)/fadeN);
      }
      data[i]=clamp(data[i]*scale*env,-1,1);
    }

    if(!createBuffer) return {buf:null,data};

    const AC=window.AudioContext||window.webkitAudioContext;
    const ac=new AC({sampleRate:p.sr});
    const buf=ac.createBuffer(2,n,p.sr);
    const left=buf.getChannelData(0);
    const right=buf.getChannelData(1);

    if(p.channelMode===1){
      left.set(data);
    }else if(p.channelMode===3){
      right.set(data);
    }else{
      left.set(data);
      right.set(data);
    }
    setTimeout(()=&gt;ac.close().catch(()=&gt;{}),0);
    return {buf,data};
  }

  function encodeWav(data,p){
    const channels=2,bits=24,block=channels*3,bytes=data.length*block;
    const out=new ArrayBuffer(44+bytes),v=new DataView(out);
    const ws=(o,str)=&gt;{for(let i=0;i&lt;str.length;i++)v.setUint8(o+i,str.charCodeAt(i));};
    ws(0,&#x27;RIFF&#x27;); v.setUint32(4,36+bytes,true); ws(8,&#x27;WAVE&#x27;); ws(12,&#x27;fmt &#x27;);
    v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,channels,true);
    v.setUint32(24,p.sr,true); v.setUint32(28,p.sr*block,true); v.setUint16(32,block,true);
    v.setUint16(34,bits,true); ws(36,&#x27;data&#x27;); v.setUint32(40,bytes,true);

    let off=44;
    for(let i=0;i&lt;data.length;i++){
      const q0=clamp(Math.round(data[i]*8388607),-8388608,8388607);
      const q=q0&lt;0?q0+16777216:q0;
      const left=p.channelMode===1||p.channelMode===2;
      const right=p.channelMode===3||p.channelMode===2;
      const write=active=&gt;{
        const x=active?q:0;
        v.setUint8(off,x&amp;255);v.setUint8(off+1,(x&gt;&gt;8)&amp;255);v.setUint8(off+2,(x&gt;&gt;16)&amp;255);off+=3;
      };
      write(left);write(right);
    }
    return new Blob([out],{type:&#x27;audio/wav&#x27;});
  }

  function stopPlayback(){
    if(state.source){
      try{
        const now=state.audioCtx.currentTime;
        state.gainNode.gain.cancelScheduledValues(now);
        state.gainNode.gain.setValueAtTime(state.gainNode.gain.value||1,now);
        state.gainNode.gain.linearRampToValueAtTime(0,now+0.01);
        state.source.stop(now+0.015);
      }catch(_){}

      // 等淡出完成后再断开，否则节点被立即断开会让淡出失效并产生爆音。
      const src=state.source,gain=state.gainNode;
      src.onended=null;
      setTimeout(()=&gt;{
        try{src.disconnect();}catch(_){}
        try{gain.disconnect();}catch(_){}
      },30);
      state.source=null;
      state.gainNode=null;
    }
    // 作废挂起的重启请求：用户手动停止优先于参数变更触发的重启。
    state.restartGen++;
    state.playing=false;
    el.play.textContent=&#x27;▶ 播放&#x27;;
  }

  async function startPlayback(){
    if(state.playing){stopPlayback();return;}
    let p;
    try{p=getParams();}catch(e){alert(e.message);return;}
    try{
      if(!state.audioCtx||state.audioCtx.state===&#x27;closed&#x27;){
        state.audioCtx=new(window.AudioContext||window.webkitAudioContext)({sampleRate:p.sr});
      }
      await state.audioCtx.resume();

      if(Math.abs(state.audioCtx.sampleRate-p.sr)&gt;0.5){
        try{await state.audioCtx.close();}catch(_){}
        state.audioCtx=new(window.AudioContext||window.webkitAudioContext)({sampleRate:p.sr});
        await state.audioCtx.resume();
      }

      // 使用 10 秒循环缓冲维持稳态连续播放；切换参数时下次播放采用最新设置。
      const key=`${p.type}|${p.db}|${p.sr}|${p.channelMode}`;
      if(!state.generated[key]){
        state.generated[key]=makeNoiseBuffer(p,10).buf;
      }
      state.buffer=state.generated[key];

      state.source=state.audioCtx.createBufferSource();
      state.source.buffer=state.buffer;
      state.source.loop=true;
      state.gainNode=state.audioCtx.createGain();
      state.gainNode.gain.value=1;
      state.bufferLevelDb=p.db;
      state.source.connect(state.gainNode);
      state.gainNode.connect(state.audioCtx.destination);
      // 校验声源身份：重启流程中旧声源的迟到 onended 不得打断新播放。
      const src=state.source;
      src.onended=()=&gt;{
        if(state.playing&amp;&amp;state.source===src){
          state.playing=false;
          el.play.textContent=&#x27;▶ 播放&#x27;;
        }
      };
      src.start(0);
      state.playing=true;
      el.play.textContent=&#x27;⏹ 停止&#x27;;
    }catch(e){
      state.playing=false;
      el.play.textContent=&#x27;▶ 播放&#x27;;
      alert(&#x27;无法启动播放：&#x27;+e.message);
    }
  }

  function openDownloadSettings(){
    el.downloadModal.classList.add(&#x27;show&#x27;);
    el.downloadModal.setAttribute(&#x27;aria-hidden&#x27;,&#x27;false&#x27;);
    state.downloadOpen=true;
    el.downloadStatus.textContent=&#x27;当前参数将在生成时写入 WAV 文件。&#x27;;
    requestAnimationFrame(()=&gt;{el.downloadDuration.focus();el.downloadDuration.select();});
  }

  function closeDownloadSettings(){
    el.downloadModal.classList.remove(&#x27;show&#x27;);
    el.downloadModal.setAttribute(&#x27;aria-hidden&#x27;,&#x27;true&#x27;);
    state.downloadOpen=false;
  }

  function doDownload(){
    let p;
    try{p=getParams();}catch(e){el.downloadStatus.textContent=e.message;return;}
    const duration=Number(el.downloadDuration.value);
    if(!Number.isFinite(duration)||duration&lt;=0||duration&gt;3600){
      el.downloadStatus.textContent=&#x27;请输入 0.01–3600 秒的有效时长。&#x27;;
      return;
    }

    el.downloadStatus.textContent=&#x27;正在生成 WAV……&#x27;;
    setTimeout(()=&gt;{
      try{
        // 下载单独生成随机噪声，避免循环边界重复；跳过播放用缓冲以节省内存。
        const made=makeNoiseBuffer(p,duration,false);
        const blob=encodeWav(made.data,p);
        const url=URL.createObjectURL(blob);
        const a=document.createElement(&#x27;a&#x27;);
        const nt=p.type===&#x27;pink&#x27;?&#x27;pink&#x27;:&#x27;white&#x27;;
        const ch=p.channelMode===1?&#x27;L&#x27;:p.channelMode===3?&#x27;R&#x27;:&#x27;LR&#x27;;
        a.href=url;
        a.download=`noise_${nt}_${p.db}dBFS_${duration}s_${ch}.wav`;
        document.body.appendChild(a);a.click();a.remove();
        setTimeout(()=&gt;URL.revokeObjectURL(url),1000);
        el.downloadStatus.textContent=`已生成 ${duration} 秒测试信号并开始下载。`;
        setTimeout(closeDownloadSettings,700);
      }catch(e){
        el.downloadStatus.textContent=&#x27;生成失败：&#x27;+e.message;
      }
    },20);
  }

  function enableDragNumber(id,options){
    const input=$(id);let dragging=false,startX=0,startY=0,startValue=0;
    input.style.cursor=&#x27;ew-resize&#x27;;
    input.title=&#x27;按住鼠标左键拖动调整；双击可直接输入&#x27;;
    input.addEventListener(&#x27;pointerdown&#x27;,e=&gt;{
      if(e.button!==0)return;
      dragging=true;startX=e.clientX;startY=e.clientY;startValue=Number(input.value)||0;
      input.setPointerCapture(e.pointerId);e.preventDefault();
    });
    input.addEventListener(&#x27;pointermove&#x27;,e=&gt;{
      if(!dragging)return;
      let delta=(e.clientX-startX)+(startY-e.clientY);
      let value=clamp(startValue+delta*(options.step||1)*(options.sensitivity||1),options.min,options.max);
      const decimals=String(options.step||1).includes(&#x27;.&#x27;)?String(options.step).split(&#x27;.&#x27;)[1].length:0;
      value=decimals?Number(value.toFixed(decimals)):Math.round(value);
      if(Number(input.value)!==value){input.value=value;input.dispatchEvent(new Event(&#x27;input&#x27;,{bubbles:true}));}
    });
    const end=e=&gt;{
      if(!dragging)return;dragging=false;
      try{if(input.hasPointerCapture(e.pointerId))input.releasePointerCapture(e.pointerId);}catch(_){}
    };
    input.addEventListener(&#x27;pointerup&#x27;,end);
    input.addEventListener(&#x27;pointercancel&#x27;,end);
    input.addEventListener(&#x27;dblclick&#x27;,()=&gt;input.select());
    input.addEventListener(&#x27;dragstart&#x27;,e=&gt;e.preventDefault());
  }

  function clearGenerated(){state.generated={};}

  // 播放期间修改参数时，立即切换到最新参数。
  function applyLiveChanges(options={}){
    clearGenerated();
    if(state.liveChangeTimer) clearTimeout(state.liveChangeTimer);

    if(options.levelOnly &amp;&amp; state.playing &amp;&amp; state.audioCtx &amp;&amp; state.gainNode){
      const db=clamp(Number(el.levelNum.value),-60,0);
      const targetAmp=10 ** ((db-state.bufferLevelDb)/20);
      const now=state.audioCtx.currentTime;
      state.gainNode.gain.cancelScheduledValues(now);
      state.gainNode.gain.setTargetAtTime(targetAmp,now,0.006);
      return;
    }

    if(!state.playing) return;
    const gen=++state.restartGen;
    state.liveChangeTimer=setTimeout(async()=&gt;{
      state.liveChangeTimer=null;
      // 期间发生过手动停止或其他更新请求时，放弃本次重启。
      if(gen!==state.restartGen)return;
      stopPlayback();
      await startPlayback();
    },30);
  }

  function init(){
    enableDragNumber(&#x27;levelNum&#x27;,{min:-60,max:0,step:0.1,sensitivity:1});

    el.level.addEventListener(&#x27;input&#x27;,()=&gt;{
      const raw=Number(el.level.value);
      const v=clamp(Number.isFinite(raw)?raw:-12,-60,0);
      el.levelNum.value=v;updateLevelDisplay();
      applyLiveChanges({levelOnly:true});
    });
    el.levelNum.addEventListener(&#x27;input&#x27;,()=&gt;{
      const v=clamp(Number(el.levelNum.value),-60,0);
      el.levelNum.value=v;el.level.value=v;updateLevelDisplay();
      applyLiveChanges({levelOnly:true});
    });
    el.noiseType.addEventListener(&#x27;change&#x27;,()=&gt;{updateLevelDisplay();applyLiveChanges();});
    el.sampleRate.addEventListener(&#x27;change&#x27;,()=&gt;{applyLiveChanges();});
    el.channels.addEventListener(&#x27;change&#x27;,()=&gt;{applyLiveChanges();});
    el.fade.addEventListener(&#x27;change&#x27;,applyLiveChanges);

    el.play.addEventListener(&#x27;click&#x27;,startPlayback);
    el.download.addEventListener(&#x27;click&#x27;,openDownloadSettings);
    el.generateDownload.addEventListener(&#x27;click&#x27;,doDownload);
    el.cancelDownload.addEventListener(&#x27;click&#x27;,closeDownloadSettings);
    el.cancelDownloadBottom.addEventListener(&#x27;click&#x27;,closeDownloadSettings);
    el.downloadModal.addEventListener(&#x27;click&#x27;,e=&gt;{if(e.target===el.downloadModal)closeDownloadSettings();});
    document.addEventListener(&#x27;keydown&#x27;,e=&gt;{if(e.key===&#x27;Escape&#x27;&amp;&amp;state.downloadOpen)closeDownloadSettings();});

    document.querySelectorAll(&#x27;.card.collapsible .card-header&#x27;).forEach(header=&gt;{
      header.addEventListener(&#x27;click&#x27;,()=&gt;{
        const card=header.closest(&#x27;.card&#x27;),button=header.querySelector(&#x27;.card-toggle&#x27;);
        const collapsed=card.classList.toggle(&#x27;collapsed&#x27;);
        button.setAttribute(&#x27;aria-expanded&#x27;,String(!collapsed));
        button.textContent=collapsed?&#x27;⌄&#x27;:&#x27;⌃&#x27;;
      });
    });

    updateLevelDisplay();
  }

  if(document.readyState===&#x27;loading&#x27;)document.addEventListener(&#x27;DOMContentLoaded&#x27;,init);else init();
})();
&lt;/script&gt;

&lt;script&gt;
(function(){
  window.addEventListener(&#x27;message&#x27;,function(e){
    if(!e.data||e.data.type!==&#x27;test-osc-theme&#x27;)return;
    document.body.classList.toggle(&#x27;theme-light&#x27;,e.data.theme===&#x27;light&#x27;);
    var s=document.getElementById(&#x27;themeSelect&#x27;);
    if(s)s.value=e.data.theme;
  });
})();

&lt;script&gt;
(function(){
  window.addEventListener(&#x27;message&#x27;,function(e){

    var play=document.getElementById(&#x27;play&#x27;);
    if(play &amp;&amp; /停止/.test(play.textContent)) play.click();
  });
})();

<script>
(function(){
  const buttons = document.querySelectorAll('.nav-btn');
  const frames = {
    tone: document.getElementById('frame-tone'),
    sweep: document.getElementById('frame-sweep'),
    noise: document.getElementById('frame-noise'),
    rew: document.getElementById('frame-rew')
  };
  const themeSelect = document.getElementById('globalThemeSelect');

  function applyTheme(theme){
    document.body.classList.toggle('theme-light', theme === 'light');
    themeSelect.value = theme;
    localStorage.setItem('koyakaCalTheme', theme);

    Object.values(frames).forEach(frame => {
      frame.contentWindow?.postMessage(
        { type:'test-osc-theme', theme },
        '*'
      );
    });
  }

  function initTheme(){
    const theme = localStorage.getItem('koyakaCalTheme') || 'dark';
    applyTheme(theme);
  }

  themeSelect.addEventListener('change', () => {
    applyTheme(themeSelect.value);
  });

  Object.values(frames).forEach(frame => {
    frame.addEventListener('load', () => {
      applyTheme(themeSelect.value);
    });
  });

  let flowLocked = false;
  window.addEventListener('message', e=>{
    const d = e.data || {};
    if(d.type==='koyaka-flow') flowLocked = !!d.running;
  });
  function flashLocked(btn){
    if(!btn) return;
    btn.classList.add('flow-locked');
    setTimeout(()=>btn.classList.remove('flow-locked'), 900);
  }

  function openOnlineRewModal(){
    const m=document.getElementById('onlineRewModal');
    if(m){m.classList.add('show');m.setAttribute('aria-hidden','false');}
  }
  function closeOnlineRewModal(){
    const m=document.getElementById('onlineRewModal');
    if(m){m.classList.remove('show');m.setAttribute('aria-hidden','true');}

  document.getElementById('onlineRewClose')?.addEventListener('click',closeOnlineRewModal);
  document.getElementById('onlineRewCloseX')?.addEventListener('click',closeOnlineRewModal);
  document.getElementById('onlineRewDownload')?.addEventListener('click',downloadKoyakaAutoREW);
  document.getElementById('onlineRewModal')?.addEventListener('click',e=>{if(e.target===e.currentTarget)closeOnlineRewModal();});
  document.addEventListener('keydown',e=>{if(e.key==='Escape')closeOnlineRewModal();});

  function openModule(target, srcBtn){
    if(target==='rew'){ openOnlineRewModal(); return; }
    if(flowLocked){ flashLocked(srcBtn); return; }
    // 懒加载:首次激活某模块时才注入其 srcdoc(iframe 此时已可见,避免隐藏状态下加载/渲染失败)
    Object.values(frames).forEach(frame => {
      if(frame.dataset.srcdoc && !frame.getAttribute('srcdoc')) frame.srcdoc = frame.dataset.srcdoc;
    });

    // 切换功能页前，终止所有功能页正在播放的音频。
    Object.values(frames).forEach(frame => {
      frame.contentWindow?.postMessage({ type:'test-osc-stop' }, '*');
    });

    buttons.forEach(b => b.classList.toggle('active', b.dataset.target === target));
    Object.entries(frames).forEach(([key, frame]) => {
      frame.classList.toggle('active', key === target);
    });

    // 离开主页,进入原有布局
    document.getElementById('homeScreen').classList.add('hidden');
    document.getElementById('appScreen').style.display = '';
  }

  function goHome(){
    if(flowLocked) return;   // 流程执行中禁止返回主页
    Object.values(frames).forEach(frame => {
      frame.contentWindow?.postMessage({ type:'test-osc-stop' }, '*');
      frame.classList.remove('active');
    });
    buttons.forEach(b => b.classList.remove('active'));
    document.getElementById('appScreen').style.display = 'none';
    document.getElementById('homeScreen').classList.remove('hidden');
  }

  buttons.forEach(btn => {
    btn.addEventListener('click', () => openModule(btn.dataset.target, btn));
  });

  // 主页田字格按钮
  document.querySelectorAll('.home-btn').forEach(btn => {
    btn.addEventListener('click', () => openModule(btn.dataset.target, btn));
  });

  // 点击侧边栏品牌返回主页
  document.querySelector('.brand').addEventListener('click', goHome);
  document.querySelector('.brand').style.cursor = 'pointer';
  document.querySelector('.brand').title = '返回主页';

  initTheme();
})();
