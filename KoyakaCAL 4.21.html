.download-modal{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(0,0,0,.48);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);opacity:0;visibility:hidden;pointer-events:none;transition:opacity .16s ease,visibility .16s ease}
.download-modal.show{opacity:1;visibility:visible;pointer-events:auto}
.download-dialog{width:min(430px,calc(100vw - 32px));border:1px solid var(--border);border-radius:14px;background:var(--card);box-shadow:0 20px 60px rgba(0,0,0,.35);transform:translateY(8px) scale(.98);transition:transform .16s ease;overflow:hidden}
.download-modal.show .download-dialog{transform:translateY(0) scale(1)}
.download-dialog-header{display:flex;align-items:flex-start;justify-content:space-between;padding:18px 20px 14px;border-bottom:1px solid var(--border)}
.download-dialog-title{font-size:17px;font-weight:650;color:var(--text)}
.download-dialog-subtitle{margin-top:4px;font-size:12px;color:var(--muted)}
.download-close{width:30px;height:30px;padding:0;border:0;background:transparent;color:var(--muted);font-size:23px;line-height:28px;cursor:pointer;border-radius:7px}
.download-close:hover{background:var(--hover);color:var(--text)}
.download-dialog-body{padding:20px}
.download-dialog-body label{display:block;margin-bottom:8px}
.download-dialog-body input{width:100%;box-sizing:border-box}
.download-dialog-preview{margin-top:10px;font-size:12px;color:var(--muted);line-height:1.6;word-break:break-all}
.download-dialog-actions{display:flex;justify-content:flex-end;gap:10px;padding:14px 20px 18px;border-top:1px solid var(--border)}
.download-dialog-actions button{min-width:88px}
button.primary{background:var(--primary-btn);border-color:var(--accent2)}
.download-dialog-body label.chk{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.download-dialog-body label.chk input{width:auto}
.user-set{border-color:var(--ok)!important}
.dl-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.dl-grid label{margin-bottom:8px}
.dl-grid select{width:100%;min-width:0}
&lt;/style&gt;
&lt;/head&gt;
&lt;body&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;h1&gt;REW 自动化处理&lt;/h1&gt;
  &lt;div class=&quot;sub&quot;&gt;运行前请确保REW为V5.40或以上版本并已打开 &amp;nbsp;|&amp;nbsp; 通过 REW REST API (localhost:4735) 操作&lt;/div&gt;

  &lt;!-- 运行与连接 --&gt;
  &lt;div class=&quot;card&quot; style=&quot;text-align:center;border-width:2px&quot;&gt;
    &lt;button class=&quot;big&quot; id=&quot;btnRunAll&quot;&gt;▶ 一键执行完整流程&lt;/button&gt;
    &lt;div class=&quot;note&quot;&gt;按顺序执行:自动分析低频截止 → 应用目标设置 → 计算目标电平 → 生成目标测量 → 生成 A-m(平滑)→ Target/A-m(平滑)→ 结果最小相位。若同时选择了 L 和 R 测量,自动追加立体声分支(L/R 平滑 → 均方根平均 → 目标 40Hz/48dB → Target/L-m、Target/R-m 下限 200Hz/上限取第 6 步填写值 → 双最小相位 → 与低音修正在 200Hz 合并为全频修正),完成后按所选方式导出：合并 IR 时自动弹出立体声导出窗口；不合并 IR 时在步骤 7 提供“单声道 L+R”和“立体声 L/R”两个独立导出按钮。&lt;/div&gt;
    &lt;hr class=&quot;sep&quot;&gt;
    &lt;div class=&quot;row&quot;&gt;
      &lt;label&gt;REW API 地址&lt;/label&gt;
      &lt;input type=&quot;text&quot; id=&quot;base&quot; style=&quot;width:220px&quot; value=&quot;http://localhost:4735&quot;&gt;
      &lt;button id=&quot;btnConnect&quot;&gt;连接&lt;/button&gt;
      &lt;span class=&quot;status&quot; id=&quot;connStatus&quot;&gt;未连接&lt;/span&gt;
      &lt;span class=&quot;pill&quot; id=&quot;verPill&quot; style=&quot;display:none&quot;&gt;&lt;/span&gt;
      &lt;label class=&quot;chk&quot; title=&quot;命令执行后等待完成再返回,脚本流程需要开启&quot;&gt;
        &lt;input type=&quot;checkbox&quot; id=&quot;blocking&quot; checked&gt; blocking 模式
      &lt;/label&gt;
      &lt;label class=&quot;chk&quot; title=&quot;勾选后,生成 A-m 与曲线相除完成后自动对结果应用所选平滑类型(默认可变平滑 Var),最终导出的 IR 即为平滑处理后的结果&quot;&gt;
        &lt;input type=&quot;checkbox&quot; id=&quot;varSmooth&quot; checked&gt; 全流程平滑
      &lt;/label&gt;
      &lt;select id=&quot;smoothType&quot; style=&quot;min-width:80px&quot; title=&quot;平滑类型&quot;&gt;&lt;/select&gt;
      &lt;span id=&quot;lrSmoothCtl&quot; style=&quot;display:none&quot;&gt;&lt;label class=&quot;chk&quot; title=&quot;立体声模式:L 和 R 在均方根平均前应用的平滑类型&quot;&gt;L/R 平均平滑&lt;/label&gt;
      &lt;select id=&quot;lrSmoothType&quot; style=&quot;min-width:80px&quot; title=&quot;L/R 均方根平均前使用的平滑类型&quot;&gt;&lt;/select&gt;&lt;/span&gt;
      &lt;span id=&quot;themeCtl&quot; style=&quot;display:contents&quot;&gt;&lt;label style=&quot;margin-left:auto&quot; for=&quot;themeSelect&quot;&gt;主题&lt;/label&gt;
      &lt;select id=&quot;themeSelect&quot; style=&quot;min-width:96px&quot; aria-label=&quot;更改网页颜色主题&quot;&gt;
        &lt;option value=&quot;dark&quot;&gt;深色&lt;/option&gt;
        &lt;option value=&quot;light&quot;&gt;浅色&lt;/option&gt;
      &lt;/select&gt;&lt;/span&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;!-- ① 选测量 --&gt;
  &lt;div class=&quot;card&quot;&gt;
    &lt;h2&gt;&lt;span class=&quot;stepno&quot;&gt;1&lt;/span&gt;选择测量结果 &lt;span class=&quot;badge&quot; id=&quot;b1&quot;&gt;待选择&lt;/span&gt;&lt;/h2&gt;
    &lt;div class=&quot;row&quot;&gt;
      &lt;button class=&quot;ghost&quot; id=&quot;btnLoad&quot;&gt;刷新测量列表&lt;/button&gt;
      &lt;select id=&quot;measSel&quot; style=&quot;min-width:280px&quot;&gt;&lt;option value=&quot;&quot;&gt;— 请先连接并加载 —&lt;/option&gt;&lt;/select&gt;
      &lt;span class=&quot;pill&quot; id=&quot;stereoPill&quot; style=&quot;display:none&quot;&gt;&lt;b&gt;立体声模式&lt;/b&gt;(将同时执行 L+R 低音分支与 L/R 分支)&lt;/span&gt;
    &lt;/div&gt;
    &lt;div class=&quot;row&quot;&gt;
      &lt;label&gt;L(左声道测量数据,可选)&lt;/label&gt;
      &lt;select id=&quot;measSelL&quot; style=&quot;min-width:240px&quot;&gt;&lt;option value=&quot;&quot;&gt;— 未选择 —&lt;/option&gt;&lt;/select&gt;
      &lt;label&gt;R(右声道测量数据,可选)&lt;/label&gt;
      &lt;select id=&quot;measSelR&quot; style=&quot;min-width:240px&quot;&gt;&lt;option value=&quot;&quot;&gt;— 未选择 —&lt;/option&gt;&lt;/select&gt;
    &lt;/div&gt;
    &lt;div class=&quot;note&quot; id=&quot;measInfo&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;!-- ② 目标设置 --&gt;
  &lt;div class=&quot;card&quot;&gt;
    &lt;h2&gt;&lt;span class=&quot;stepno&quot;&gt;2&lt;/span&gt;EQ 目标曲线设置 &lt;span class=&quot;badge&quot; id=&quot;b2&quot;&gt;未应用&lt;/span&gt;&lt;/h2&gt;
    &lt;div class=&quot;row&quot;&gt;
      &lt;label&gt;扬声器类型&lt;/label&gt;
      &lt;select id=&quot;shape&quot;&gt;&lt;/select&gt;
      &lt;label&gt;低频截止&lt;/label&gt;&lt;input type=&quot;number&quot; id=&quot;lfCut&quot; value=&quot;40&quot;&gt; Hz
      &lt;label&gt;低频斜率&lt;/label&gt;&lt;select id=&quot;lfSlope&quot;&gt;&lt;/select&gt; dB/oct
      &lt;button id=&quot;btnApplyTarget&quot;&gt;应用目标设置&lt;/button&gt;
      &lt;button class=&quot;ghost&quot; id=&quot;btnAutoLF&quot; title=&quot;分析 A 的低频滚降,自动填写低频截止/斜率,并给出第 6 步处理上下限建议&quot;&gt;自动分析低频截止&lt;/button&gt;
    &lt;/div&gt;
    &lt;div class=&quot;note&quot; id=&quot;lfInfo&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;note&quot;&gt;立体声模式(选择 L 和 R)时:A/L+R 分支使用上方截止/斜率;L/R 均方根平均结果固定使用全频扬声器、40 Hz、48 dB/oct。&lt;/div&gt;
    &lt;div class=&quot;note&quot;&gt;写入测量 A 的 EQ 目标设置(/measurements/{A}/target-settings)。可手动设置,或点「自动分析低频截止」按 A 的实际滚降自动填写。&lt;b&gt;手动修改过的数值带绿色边框,一键执行时不会被自动分析覆盖&lt;/b&gt;;按住 &lt;b&gt;Cmd(Mac)/Ctrl(Win)&lt;/b&gt; 点击输入框可解除锁定恢复自动;未手动修改的参数由算法自动得出。&lt;/div&gt;
  &lt;/div&gt;

  &lt;!-- ③ 目标电平 --&gt;
  &lt;div class=&quot;card&quot;&gt;
    &lt;h2&gt;&lt;span class=&quot;stepno&quot;&gt;3&lt;/span&gt;根据频响曲线计算目标电平 &lt;span class=&quot;badge&quot; id=&quot;b3&quot;&gt;未计算&lt;/span&gt;&lt;/h2&gt;
    &lt;div class=&quot;row&quot;&gt;
      &lt;button id=&quot;btnCalcLevel&quot;&gt;计算目标电平&lt;/button&gt;
      &lt;span&gt;REW 计算结果:&lt;span class=&quot;val&quot; id=&quot;targetLevel&quot;&gt;—&lt;/span&gt; dB&lt;/span&gt;
    &lt;/div&gt;
    &lt;div class=&quot;note&quot;&gt;调用 REW 内置命令 Calculate target level,由 REW 依据 A 的频响与目标设置自动计算并写入。&lt;/div&gt;
  &lt;/div&gt;

  &lt;!-- ④ 生成目标测量 --&gt;
  &lt;div class=&quot;card&quot;&gt;
    &lt;h2&gt;&lt;span class=&quot;stepno&quot;&gt;4&lt;/span&gt;基于目标曲线生成新测量 &lt;span class=&quot;badge&quot; id=&quot;b4&quot;&gt;未生成&lt;/span&gt;&lt;/h2&gt;
    &lt;div class=&quot;row&quot;&gt;
      &lt;button id=&quot;btnGenTarget&quot;&gt;生成目标测量&lt;/button&gt;
      &lt;span class=&quot;pill&quot; id=&quot;targetPill&quot; style=&quot;display:none&quot;&gt;&lt;/span&gt;
    &lt;/div&gt;
    &lt;div class=&quot;note&quot;&gt;调用 REW 命令 Generate target measurement,按当前目标设置与目标电平生成新测量。&lt;/div&gt;
  &lt;/div&gt;

  &lt;!-- ⑤ 最小相位副本 --&gt;
  &lt;div class=&quot;card&quot;&gt;
    &lt;h2&gt;&lt;span class=&quot;stepno&quot;&gt;5&lt;/span&gt;生成 A 的最小相位副本 A-m &lt;span class=&quot;badge&quot; id=&quot;b5&quot;&gt;未生成&lt;/span&gt;&lt;/h2&gt;
    &lt;div class=&quot;row&quot;&gt;
      &lt;span class=&quot;chk&quot;&gt;&lt;input type=&quot;checkbox&quot; id=&quot;pCal&quot; checked&gt;include cal&lt;/span&gt;
      &lt;span class=&quot;chk&quot;&gt;&lt;input type=&quot;checkbox&quot; id=&quot;pLf&quot;&gt;append LF tail&lt;/span&gt;
      &lt;span class=&quot;chk&quot;&gt;&lt;input type=&quot;checkbox&quot; id=&quot;pHf&quot;&gt;append HF tail&lt;/span&gt;
      &lt;span class=&quot;chk&quot;&gt;&lt;input type=&quot;checkbox&quot; id=&quot;pWarp&quot;&gt;frequency warping&lt;/span&gt;
      &lt;span class=&quot;chk&quot;&gt;&lt;input type=&quot;checkbox&quot; id=&quot;pRep&quot; checked&gt;&lt;b&gt;Replicate data outside range&lt;/b&gt;&lt;/span&gt;
    &lt;/div&gt;
    &lt;div class=&quot;row&quot;&gt;
      &lt;button id=&quot;btnMinPhase&quot;&gt;生成 A-m&lt;/button&gt;
      &lt;span class=&quot;pill&quot; id=&quot;amPill&quot; style=&quot;display:none&quot;&gt;&lt;/span&gt;
    &lt;/div&gt;
    &lt;div class=&quot;note&quot;&gt;调用 Minimum phase version 命令生成副本,并重命名为「{A}-m」。默认仅勾选 include cal 与 Replicate data outside range。生成后自动应用所选平滑(默认 Var)。&lt;/div&gt;
  &lt;/div&gt;

  &lt;!-- ⑥ 曲线运算 --&gt;
  &lt;div class=&quot;card&quot;&gt;
    &lt;h2&gt;&lt;span class=&quot;stepno&quot;&gt;6&lt;/span&gt;曲线运算:Target / A-m &lt;span class=&quot;badge&quot; id=&quot;b6&quot;&gt;未执行&lt;/span&gt;&lt;/h2&gt;
    &lt;div class=&quot;row&quot;&gt;
      &lt;label&gt;处理下限频率&lt;/label&gt;&lt;input type=&quot;number&quot; id=&quot;divLower&quot; style=&quot;width:80px&quot; placeholder=&quot;可选&quot;&gt; Hz
      &lt;label&gt;处理上限频率&lt;/label&gt;&lt;input type=&quot;number&quot; id=&quot;divUpper&quot; style=&quot;width:80px&quot; placeholder=&quot;可选&quot;&gt; Hz
      &lt;button id=&quot;btnArith&quot;&gt;执行 Target / A-m&lt;/button&gt;
      &lt;label class=&quot;chk&quot; title=&quot;取消勾选则不限制增益(不发送 maxGain 参数)&quot;&gt;&lt;input type=&quot;checkbox&quot; id=&quot;maxGainOn&quot; checked&gt;增益限制 maxGain&lt;/label&gt;&lt;input type=&quot;number&quot; id=&quot;maxGain&quot; style=&quot;width:70px&quot; value=&quot;6&quot; placeholder=&quot;默认 6&quot;&gt; dB
      &lt;span class=&quot;pill&quot; id=&quot;divPill&quot; style=&quot;display:none&quot;&gt;&lt;/span&gt;
    &lt;/div&gt;
    &lt;div class=&quot;note&quot;&gt;Arithmetic 进程,函数 A / B(A = 目标测量,B = A-m),相除结果自动应用所选平滑(默认 Var)后再进入步骤 7。&lt;b&gt;不勾选「结果覆盖合并频率范围」&lt;/b&gt;——API 默认即使用 A、B 合并后的频率范围,不发送覆盖参数。「处理上/下限频率」为可选的频段限制(只在该频段内做除法),留空则不限制;单声道模式两项都填写时要求下限 &amp;lt; 上限。&lt;b&gt;立体声模式下:下限仅对 L+R 低音修正生效(其上限固定 200 Hz);上限仅对 L/R 立体声修正生效(其下限固定 200 Hz)&lt;/b&gt;。增益限制默认 6 dB(输入留空时也按 6 dB 发送),防止低频相除结果提升过大;可修改数值,&lt;b&gt;取消勾选「增益限制 maxGain」则完全解除限制&lt;/b&gt;。&lt;/div&gt;
  &lt;/div&gt;

  &lt;!-- ⑦ 结果最小相位 --&gt;
  &lt;div class=&quot;card&quot;&gt;
    &lt;h2&gt;&lt;span class=&quot;stepno&quot;&gt;7&lt;/span&gt;对运算结果生成最小相位副本 &lt;span class=&quot;badge&quot; id=&quot;b7&quot;&gt;未生成&lt;/span&gt;&lt;/h2&gt;
    &lt;div class=&quot;row&quot;&gt;
      &lt;button id=&quot;btnMinPhase2&quot;&gt;生成结果-MP&lt;/button&gt;
      &lt;span class=&quot;pill&quot; id=&quot;mp2Pill&quot; style=&quot;display:none&quot;&gt;&lt;/span&gt;
      &lt;button class=&quot;ghost&quot; id=&quot;btnExport2&quot; style=&quot;display:none&quot;&gt;导出单声道 L+R…&lt;/button&gt;
      &lt;button class=&quot;ghost&quot; id=&quot;btnExportStereo&quot; style=&quot;display:none&quot;&gt;导出立体声 L/R…&lt;/button&gt;
    &lt;/div&gt;
    &lt;div class=&quot;row&quot; style=&quot;display:none&quot; id=&quot;wavRow&quot;&gt;
      &lt;span class=&quot;pill&quot; id=&quot;wavPill&quot;&gt;&lt;/span&gt;
    &lt;/div&gt;
    &lt;div class=&quot;note&quot;&gt;对第 6 步结果使用与第 5 步相同的最小相位参数生成副本。&lt;/div&gt;
  &lt;/div&gt;

  &lt;!-- 日志 --&gt;
  &lt;div class=&quot;card&quot;&gt;
    &lt;h2&gt;调用日志 &lt;button class=&quot;ghost&quot; id=&quot;btnClear&quot; style=&quot;margin-left:auto&quot;&gt;清空&lt;/button&gt;&lt;/h2&gt;
    &lt;div id=&quot;log&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;download-modal&quot; id=&quot;downloadModal&quot; aria-hidden=&quot;true&quot;&gt;
  &lt;div class=&quot;download-dialog&quot; role=&quot;dialog&quot; aria-modal=&quot;true&quot; aria-labelledby=&quot;downloadDialogTitle&quot;&gt;
    &lt;div class=&quot;download-dialog-header&quot;&gt;
      &lt;div&gt;
        &lt;div class=&quot;download-dialog-title&quot; id=&quot;downloadDialogTitle&quot;&gt;导出 IR 为 WAV&lt;/div&gt;
        &lt;div class=&quot;download-dialog-subtitle&quot; id=&quot;dlSubtitle&quot;&gt;确认导出文件名与参数&lt;/div&gt;
      &lt;/div&gt;
      &lt;button class=&quot;download-close&quot; id=&quot;dlCancelX&quot; aria-label=&quot;关闭&quot;&gt;×&lt;/button&gt;
    &lt;/div&gt;
    &lt;div class=&quot;download-dialog-body&quot;&gt;
      &lt;label for=&quot;dlFileName&quot;&gt;文件名&lt;/label&gt;
      &lt;input id=&quot;dlFileName&quot; type=&quot;text&quot; spellcheck=&quot;false&quot; autocomplete=&quot;off&quot;&gt;
      &lt;div class=&quot;dl-grid&quot;&gt;
        &lt;div&gt;
          &lt;label for=&quot;sr&quot;&gt;采样率 (Hz)&lt;/label&gt;
          &lt;select id=&quot;sr&quot;&gt;&lt;/select&gt;
        &lt;/div&gt;
        &lt;div&gt;
          &lt;label for=&quot;bits&quot;&gt;位深&lt;/label&gt;
          &lt;select id=&quot;bits&quot;&gt;
            &lt;option value=&quot;32&quot; selected&gt;32-bit float(推荐)&lt;/option&gt;
            &lt;option value=&quot;24&quot;&gt;24-bit PCM&lt;/option&gt;
            &lt;option value=&quot;16&quot;&gt;16-bit PCM&lt;/option&gt;
          &lt;/select&gt;
        &lt;/div&gt;
      &lt;/div&gt;
      &lt;label class=&quot;chk&quot;&gt;&lt;input type=&quot;checkbox&quot; id=&quot;applyWin&quot;&gt;导出前应用 IR 时间窗&lt;/label&gt;
      &lt;label class=&quot;chk&quot;&gt;&lt;input type=&quot;checkbox&quot; id=&quot;alsoTxt&quot;&gt;同时导出txt格式(修正曲线)&lt;/label&gt;
      &lt;div class=&quot;download-dialog-preview&quot; id=&quot;dlPreview&quot;&gt;&lt;/div&gt;
      &lt;div class=&quot;warnbox&quot; id=&quot;clipWarn&quot;&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;download-dialog-actions&quot;&gt;
      &lt;button id=&quot;dlCancel&quot;&gt;取消&lt;/button&gt;
      &lt;button id=&quot;dlConfirm&quot; class=&quot;primary&quot;&gt;导出并下载&lt;/button&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;download-modal&quot; id=&quot;mergeChoiceModal&quot; aria-hidden=&quot;true&quot;&gt;
  &lt;div class=&quot;download-dialog&quot; role=&quot;dialog&quot; aria-modal=&quot;true&quot; aria-labelledby=&quot;mergeChoiceTitle&quot;&gt;
    &lt;div class=&quot;download-dialog-header&quot;&gt;
      &lt;div&gt;
        &lt;div class=&quot;download-dialog-title&quot; id=&quot;mergeChoiceTitle&quot;&gt;选择立体声 IR 处理方式&lt;/div&gt;
        &lt;div class=&quot;download-dialog-subtitle&quot;&gt;一键执行完整流程前请选择是否合并 IR&lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;download-dialog-body&quot;&gt;
      &lt;div class=&quot;download-dialog-preview&quot; style=&quot;font-size:14px;line-height:1.7;color:var(--text)&quot;&gt;是否合并ir？&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;download-dialog-actions&quot;&gt;
      &lt;button id=&quot;mergeChoiceNo&quot;&gt;否&lt;/button&gt;
      &lt;button id=&quot;mergeChoiceYes&quot; class=&quot;primary&quot;&gt;是&lt;/button&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;download-modal&quot; id=&quot;cleanupModal&quot; aria-hidden=&quot;true&quot;&gt;
  &lt;div class=&quot;download-dialog&quot; role=&quot;dialog&quot; aria-modal=&quot;true&quot; aria-labelledby=&quot;cleanupTitle&quot;&gt;
    &lt;div class=&quot;download-dialog-header&quot;&gt;
      &lt;div&gt;
        &lt;div class=&quot;download-dialog-title&quot; id=&quot;cleanupTitle&quot;&gt;清理运算数据&lt;/div&gt;
        &lt;div class=&quot;download-dialog-subtitle&quot;&gt;下载已完成&lt;/div&gt;
      &lt;/div&gt;
      &lt;button class=&quot;download-close&quot; id=&quot;cuCancelX&quot; aria-label=&quot;关闭&quot;&gt;×&lt;/button&gt;
    &lt;/div&gt;
    &lt;div class=&quot;download-dialog-body&quot;&gt;

        &lt;label for=&quot;cfBase&quot;&gt;REW API 地址&lt;/label&gt;
        &lt;input type=&quot;text&quot; id=&quot;cfBase&quot; placeholder=&quot;例如：http://localhost:4735&quot; autocomplete=&quot;url&quot;&gt;

&lt;script&gt;
'use strict';
const $ = id =&gt; document.getElementById(id);
const S = { A:null, L:null, R:null, target:null, am:null, div:null, mp2:null,
            avg:null, targetLR:null, Lm:null, Rm:null, divL:null, divR:null, mpL:null, mpR:null,
            fullL:null, fullR:null, mpFullL:null, mpFullR:null };
let LAST_LIST = [];
const isStereo = ()=&gt; !!(S.L &amp;&amp; S.R);
const CREATED = [];   // 本次会话中流程产生的测量(CAL_ 前缀),用于下载后可选清理
let flowRunning = false;   // 一键流程执行中,暂停自动轮询
let stereoMerged = true;    // 本次立体声流程是否执行 200 Hz Merge
let unmergedExported = { mono:false, stereo:false }; // 未合并模式下两类 IR 的导出状态
let lastListKey = '';      // 测量列表指纹,变化时才刷新下拉
let lastVer = '';
// 用户手动修改过的参数:自动分析不覆盖
const USER_SET = { lfCut:false, lfSlope:false, divLower:false, divUpper:false };
function markUserSet(id){ USER_SET[id]=true; $(id).classList.add('user-set'); }
function bindUserSet(ids){
  ids.forEach(id=&gt;{
    $(id).addEventListener('input', ()=&gt; markUserSet(id));
    $(id).addEventListener('change', ()=&gt; markUserSet(id));
    // Cmd(mac)/Ctrl(win)+点击:解除手动锁定。必须在 mousedown 阶段拦截,
    // 否则 macOS 上 select 的原生下拉会在 mousedown 时弹出
    $(id).addEventListener('mousedown', e=&gt;{
      if(e.metaKey || e.ctrlKey){
        e.preventDefault();
        USER_SET[id]=false;
        $(id).classList.remove('user-set');
        log(`${id} 已解除手动锁定,恢复自动分析`,'ok');
      }
    });
  });
  // 斜率是下拉框:点开选择即视为手动意图(即使最终值未变化也锁定)
  $('lfSlope').addEventListener('focus', ()=&gt; markUserSet('lfSlope'));
}
bindUserSet(['lfCut','lfSlope','divLower','divUpper']);
// 处理下限未手动锁定(绿框)时,自动跟随 EQ 低频截止频率
const followCut = ()=&gt;{ if(!USER_SET.divLower) $('divLower').value = $('lfCut').value; };
$('lfCut').addEventListener('input', followCut);
$('lfCut').addEventListener('change', followCut);

/* ==== 主题(深色/浅色,与 Test_OSC 主题一致,记住选择) ==== */
function applyTheme(t){ document.body.classList.toggle('theme-light', t==='light'); }

/* ==== Test_OSC 外壳集成接口 ==== */
/* 外壳在加载与切换主题时向 iframe 广播 {type:'test-osc-theme', theme};切换功能页时广播 {type:'test-osc-stop'} */
window.addEventListener('message', (e)=&gt;{
  const d = e.data || {};
  if(d.type==='test-osc-theme'){
    const t = d.theme==='light' ? 'light' : 'dark';
    applyTheme(t);
    const sel = document.getElementById('themeSelect');
    if(sel) sel.value = t;
    if(window.parent === window){ try{ localStorage.setItem('rewTheme', t); }catch(err){} }
  }else if(d.type==='test-osc-stop'){
    /* 本模块不播放音频,仅确保导出弹窗收起 */
    const m = document.getElementById('downloadModal');
    if(m) m.classList.remove('show');
  }
});
/* ---- 下拉框默认填充(脚本启动即执行,不依赖 REW 连接) ---- */
(function initSelectDefaults(){
  const shapes=['Full range','Bass limited','Subwoofer','Driver','None'];
  const slopes=[6,12,18,24,30,36,42,48];
  const smooth=['1/1','1/2','1/3','1/6','1/12','1/24','1/48','Var','Psy','ERB','None'];
  const so=$('shape');
  if(so &amp;&amp; !so.options.length) so.innerHTML = shapes.map(v=&gt;`&lt;option value=&quot;${v}&quot;&gt;${v}${v==='Full range'?'(全频扬声器)':''}&lt;/option&gt;`).join('');
  const sl=$('lfSlope');
  if(sl &amp;&amp; !sl.options.length) sl.innerHTML = slopes.map(v=&gt;`&lt;option value=&quot;${v}&quot;&gt;${v}&lt;/option&gt;`).join('');
  const st=$('smoothType');
  if(st &amp;&amp; !st.options.length){ st.innerHTML = smooth.map(v=&gt;`&lt;option value=&quot;${v}&quot;&gt;${v}${v==='Var'?'(可变平滑)':''}&lt;/option&gt;`).join(''); st.value='Var'; }
  const lr=$('lrSmoothType');
  if(lr &amp;&amp; !lr.options.length){ lr.innerHTML = smooth.map(v=&gt;`&lt;option value=&quot;${v}&quot;&gt;${v}&lt;/option&gt;`).join(''); lr.value='1/6'; }
})();

/* ---- REW 连接失败弹窗 ---- */
const CONN_FAIL_TEXT = 'REW 连接失败&gt;&lt;,请确认 REW 已打开并启用 REST API 服务(默认端口 4735),且版本不低于 V5.40。';
let connFailShown = false;
function showConnFailModal(){
  $('cfText').textContent = CONN_FAIL_TEXT;
  const cfBase = $('cfBase');
  if(cfBase) cfBase.value = $('base').value || 'http://localhost:4735';
  if(connFailShown) return;
  connFailShown = true;
  $('connFailModal').classList.add('show');
  $('connFailModal').setAttribute('aria-hidden','false');
  if(cfBase) setTimeout(()=&gt;{ cfBase.focus(); cfBase.select(); }, 0);
}
function closeConnFailModal(){
  connFailShown = false;
  $('connFailModal').classList.remove('show');
  $('connFailModal').setAttribute('aria-hidden','true');
}
$('cfRetry').onclick = ()=&gt;{
  const cfBase = $('cfBase');
  if(cfBase){
    const value = cfBase.value.trim();
    if(value) $('base').value = value;
  }
  closeConnFailModal();
  connect();
};
$('cfBase').addEventListener('keydown', e=&gt;{
  if(e.key === 'Enter') $('cfRetry').click();
});
$('cfClose').onclick = closeConnFailModal;
$('cfCloseX').onclick = closeConnFailModal;
$('connFailModal').addEventListener('click', e=&gt;{ if(e.target===e.currentTarget) closeConnFailModal(); });

const EMBEDDED = window.parent !== window;   // 嵌入 KoyakaCAL 外壳时为 true
(function initTheme(){
  const sel = document.getElementById('themeSelect');
  let saved='dark';
  try{ saved = localStorage.getItem('rewTheme') || 'dark'; }catch(e){}
  if(EMBEDDED){
    const ctl = document.getElementById('themeCtl');
    if(ctl) ctl.style.display = 'none';      // 嵌入时隐藏内部主题切换,由外壳统一控制
    applyTheme(saved);                        // 外壳加载后会通过消息同步实际主题
  } else if(sel){
    sel.value = saved; applyTheme(saved);
    sel.onchange = ()=&gt;{ applyTheme(sel.value); try{ localStorage.setItem('rewTheme', sel.value); }catch(e){} };
  } else {
    applyTheme('dark');
  }
})();

/* ---------------- 基础 API ---------------- */
function log(msg, cls){
  const t = new Date().toLocaleTimeString('zh-CN',{hour12:false});
  const line = document.createElement('div');
  if(cls) line.className = cls;
  line.textContent = `[${t}] ${msg}`;
  $('log').appendChild(line);
  $('log').scrollTop = $('log').scrollHeight;
}
function badge(id, txt, cls){ const b=$(id); b.textContent=txt; b.className='badge'+(cls?' '+cls:''); }

async function api(path, {method='GET', body, raw, quiet}={}){
  const base = $('base').value.replace(/\/+$/,'');
  const opt = {method};
  if(body!==undefined){ opt.headers={'Content-Type':'application/json'}; opt.body=JSON.stringify(body); }
  if(!quiet) log(`${method} ${path}${body!==undefined?'  '+JSON.stringify(body).slice(0,220):''}`,'cmd');
  let r;
  try{ r = await fetch(base+path, opt); }
  catch(e){
    if(!quiet) showConnFailModal();
    throw new Error('REW 连接失败,请确认 REW 已打开并启用 REST API 服务(默认端口 4735),且版本不低于 V5.40。');
  }
  const txt = await r.text();
  let data; try{ data = JSON.parse(txt); }catch{ data = txt; }
  if(!r.ok) throw new Error(`HTTP ${r.status}: ${typeof data==='string'?data:JSON.stringify(data).slice(0,300)}`);
  if(!quiet) log(`← ${typeof data==='string'?data:JSON.stringify(data).slice(0,260)}`);
  return data;
}

async function setBlocking(on){ await api('/application/blocking',{method:'POST',body:on}); }

/* 可变平滑:对指定测量应用 REW 可变平滑(Var),写入测量数据 */
async function applyVarSmooth(uuid){
  await smoothMeas(uuid, $('smoothType').value || 'Var');
}

async function listMeasurements(quiet){
  const m = await api('/measurements',{quiet});
  return Object.entries(m).map(([k,v])=&gt;({idx:+k, ...v})).sort((a,b)=&gt;a.idx-b.idx);
}

/* 从命令返回的 message(JSON 字符串)中提取新建测量的 UUID;失败则用列表差集 */
function detectNew(beforeUUIDs){  /* 同步外层返回 async 内层,支持 detectNew(before)(msg) 调用形式 */
  return async (message)=&gt;{
    let uuid=null, name=null;
    try{
      const j = JSON.parse(message);
      const first = Object.values(j.results||{})[0];
      if(first){ uuid = first.UUID; name = first['New measurement']; }
    }catch{}
    if(!uuid){
      const now = await listMeasurements();
      const fresh = now.filter(x=&gt;!beforeUUIDs.has(x.uuid));
      if(fresh.length){ uuid = fresh[0].uuid; name = fresh[0].title; }
    }
    if(!uuid) throw new Error('无法确定新生成的测量(UUID 未返回且列表无差异)');
    return {uuid, name};
  };
}
const uuidSet = async ()=&gt; new Set((await listMeasurements()).map(x=&gt;x.uuid));

/* ---------------- 连接 ---------------- */
$('btnConnect').onclick = connect;
async function connect(){
  try{
    setConn('连接中…','run');
    const v = await api('/version');
    $('verPill').style.display=''; $('verPill').textContent = v.message || JSON.stringify(v);
    await setBlocking($('blocking').checked);
    await loadShapesAndSlopes();
    await loadMeasurements();
    setConn('已连接&gt;w&lt;','ok');
    log('连接成功,blocking=' + $('blocking').checked,'ok');
  }catch(e){ setConn('连接失败','err'); log(e.message,'err'); }
}
function setConn(t,cls){ const s=$('connStatus'); s.textContent=t; s.className='status '+(cls||''); }
$('blocking').onchange = ()=&gt; setBlocking($('blocking').checked).catch(e=&gt;log(e.message,'err'));

async function loadShapesAndSlopes(){
  try{
    const shapes = await api('/eq/target-shapes');
    $('shape').innerHTML = shapes.map(s=&gt;`&lt;option value=&quot;${s}&quot;&gt;${s}${s==='Full range'?'(全频扬声器)':''}&lt;/option&gt;`).join('');
    $('shape').value = 'Full range';
    const slopes = await api('/eq/slopes');
    $('lfSlope').innerHTML = slopes.map(s=&gt;`&lt;option value=&quot;${s}&quot;&gt;${s}&lt;/option&gt;`).join('');
    $('lfSlope').value = '48';
    let smoothChoices = ['1/1','1/2','1/3','1/6','1/12','1/24','1/48','Var','Psy','ERB','None'];
    try{ smoothChoices = await api('/measurements/frequency-response/smoothing-choices'); }catch(e){}
    const fmt = v =&gt; `${v}${v==='Var'?'(可变平滑)':''}`;
    $('smoothType').innerHTML = smoothChoices.map(v=&gt;`&lt;option value=&quot;${v}&quot;&gt;${fmt(v)}&lt;/option&gt;`).join('');
    $('smoothType').value = 'Var';
    $('lrSmoothType').innerHTML = smoothChoices.map(v=&gt;`&lt;option value=&quot;${v}&quot;&gt;${fmt(v)}&lt;/option&gt;`).join('');
    $('lrSmoothType').value = '1/6';
  }catch(e){ log('读取目标形状/斜率列表失败: '+e.message,'err'); }
}

/* ---------------- ① 测量列表 ---------------- */
$('btnLoad').onclick = guard(loadMeasurements);
async function loadMeasurements(){
  const list = await listMeasurements();
  LAST_LIST = list;
  const opts = list.map(m=&gt;`&lt;option value=&quot;${m.uuid}&quot;&gt;${m.idx}. ${esc(m.title)}&lt;/option&gt;`).join('');
  const sel = $('measSel');
  const prev = sel.value;
  sel.innerHTML = opts;
  if(prev &amp;&amp; list.some(m=&gt;m.uuid===prev)) sel.value = prev;
  for(const [id, keepPrev] of [['measSelL',true],['measSelR',true]]){
    const el = $(id); const pv = el.value;
    el.innerHTML = '&lt;option value=&quot;&quot;&gt;— 未选择 —&lt;/option&gt;' + opts;
    if(keepPrev &amp;&amp; pv &amp;&amp; list.some(m=&gt;m.uuid===pv)) el.value = pv;
  }
  sel.onchange();
  updateStereoMode();
  lastListKey = JSON.stringify(list.map(x=&gt;[x.uuid,x.title,x.idx]));
  log(`已加载 ${list.length} 个测量`,'ok');
}
function updateStereoMode(){
  const find = u =&gt; u? (LAST_LIST.find(m=&gt;m.uuid===u) || null) : null;
  S.L = find($('measSelL').value); S.R = find($('measSelR').value);
  const st = isStereo();
  $('stereoPill').style.display = st? '':'none';
  const lr = document.getElementById('lrSmoothCtl');
  if(lr) lr.style.display = st? 'contents' : 'none';
}
$('measSel').onchange = ()=&gt;{
  const u = $('measSel').value;
  S.A = u || null;
  $('measInfo').textContent = '';
  if(!u){ badge('b1','待选择'); return; }
  listMeasurements().then(list=&gt;{
    const m = list.find(x=&gt;x.uuid===u); if(!m) return;
    S.A = m;
    $('measInfo').textContent = `UUID: ${m.uuid} | 采样率: ${Math.round(m.sampleRate)} Hz | 范围: ${m.startFreq.toFixed(1)}–${Math.round(m.endFreq)} Hz | 来自: ${m.containingFileName||'—'}`;
    badge('b1', m.title,'ok');
  });
};
function esc(s){ return String(s).replace(/[&amp;&lt;&gt;&quot;]/g, c=&gt;({'&amp;':'&amp;amp;','&lt;':'&amp;lt;','&gt;':'&amp;gt;','&quot;':'&amp;quot;'}[c])); }
$('measSelL').onchange = updateStereoMode;
$('measSelR').onchange = updateStereoMode;
function needA(){ if(!S.A) throw new Error('没有可处理的测量数据><'); return S.A.uuid; }

/* ---- 通用操作(供单声道/立体声流程复用) ---- */
async function applyTargetSettings(uuid, shape, cutoff, slope){
  const cur = await api(`/measurements/${uuid}/target-settings`);
  const next = {...cur, shape, lowFreqCutoffHz:+cutoff, lowFreqSlopedBPerOctave:+slope};
  await api(`/measurements/${uuid}/target-settings`,{method:'POST',body:next});
  return next;
}
async function calcTargetLevel(uuid){
  await api(`/measurements/${uuid}/eq/command`,{method:'POST',body:{command:'Calculate target level'}});
  const lv = await api(`/measurements/${uuid}/target-level`);
  return typeof lv==='number'? lv : null;
}
async function renameMeas(uuid, title){
  const sum = await api(`/measurements/${uuid}`);
  sum.title = title;
  await api(`/measurements/${uuid}`,{method:'PUT',body:sum});
}
async function nameCAL(det, name){
  const full = 'CAL_' + name;
  await renameMeas(det.uuid, full);
  det.name = full;
  return det;
}
async function generateTargetMeas(uuid){
  const before = await uuidSet();
  const r = await api(`/measurements/${uuid}/eq/command`,{method:'POST',body:{command:'Generate target measurement'}});
  const det = await detectNew(before)(typeof r.message==='string'? r.message : JSON.stringify(r));
  CREATED.push(det.uuid);
  await nameCAL(det, det.name);
  return det;
}
async function arithmeticDiv(uuidA, uuidB, extra, suffix){
  const before = await uuidSet();
  const r = await api('/measurements/process-measurements',{method:'POST',body:{
    processName:'Arithmetic',
    measurementUUIDs:[uuidA, uuidB],
    parameters:Object.assign({'function':'A / B'}, extra||{})
  }});
  const det = await detectNew(before)(typeof r.message==='string'? r.message : JSON.stringify(r));
  CREATED.push(det.uuid);
  await nameCAL(det, det.name + (suffix||''));
  return det;
}
async function smoothMeas(uuid, type){
  await api(`/measurements/${uuid}/command`,{method:'POST',body:{command:'Smooth',parameters:{smoothing:type}}});
  log(`已应用平滑(${type})`,'ok');
}
async function rmsAverage(uuidL, uuidR){
  const before = await uuidSet();
  const r = await api('/measurements/process-measurements',{method:'POST',body:{
    processName:'RMS average', measurementUUIDs:[uuidL, uuidR]
  }});
  const det = await detectNew(before)(typeof r.message==='string'? r.message : JSON.stringify(r));
  CREATED.push(det.uuid);
  await nameCAL(det, det.name);
  return det;
}
function maxGainParam(){ return $('maxGainOn').checked? {maxGain: $('maxGain').value.trim() || '6'} : {}; }
async function runStereoBranch(mergeIR=true){
  if(!S.L || !S.R) throw new Error('请先选择 L 和 R 测量');
  stereoMerged = !!mergeIR;
  unmergedExported = { mono:false, stereo:false };
  const lrT = $('lrSmoothType').value || '1/6';
  log(`立体声分支:L/R 平滑 ${lrT} → 均方根平均 → 目标(全频 40Hz/48dB)→ Target/L-m、Target/R-m(下限 200Hz)`,'cmd');
  await smoothMeas(S.L.uuid, lrT);
  await smoothMeas(S.R.uuid, lrT);
  S.avg = await rmsAverage(S.L.uuid, S.R.uuid);
  log(`L/R 均方根平均:${S.avg.name}`,'ok');
  await applyTargetSettings(S.avg.uuid, 'Full range', 40, 48);
  await calcTargetLevel(S.avg.uuid);
  S.targetLR = await generateTargetMeas(S.avg.uuid);
  S.Lm = await makeMinPhase(S.L.uuid, (S.L.title||'L')+'-m');
  S.Rm = await makeMinPhase(S.R.uuid, (S.R.title||'R')+'-m');
  const upLR = $('divUpper').value.trim();   // 立体声分支:上限对 L/R 两次除法生效
  S.divL = await arithmeticDiv(S.targetLR.uuid, S.Lm.uuid, Object.assign({lowerLimit:'200'}, maxGainParam(), upLR? {upperLimit: upLR}:{}), ' (L)');
  S.divR = await arithmeticDiv(S.targetLR.uuid, S.Rm.uuid, Object.assign({lowerLimit:'200'}, maxGainParam(), upLR? {upperLimit: upLR}:{}), ' (R)');
  S.mpL = await makeMinPhase(S.divL.uuid, S.divL.name+'-MP');
  S.mpR = await makeMinPhase(S.divR.uuid, S.divR.name+'-MP');

  if(mergeIR){
    // 合并:REW &quot;Merge B to A&quot; 语义为 B 提供 200Hz 以下、A 保留 200Hz 以上
    // 因此 A=L/R 修正(高频段),B=L+R 低音修正(低频段)
    S.fullL = await arithmeticMerge(S.mpL.uuid, S.mp2.uuid, '200', ' (L)');
    S.fullR = await arithmeticMerge(S.mpR.uuid, S.mp2.uuid, '200', ' (R)');
    S.mpFullL = await makeMinPhase(S.fullL.uuid, S.fullL.name+'-MP');
    S.mpFullR = await makeMinPhase(S.fullR.uuid, S.fullR.name+'-MP');
    $('btnExportStereo').dataset.exportMode = 'stereo';
    log(`立体声分支完成:已在 200Hz 合并低音与 L/R 修正 → ${S.mpFullL.name}(左)/ ${S.mpFullR.name}(右)`,'ok');
  }else{
    // 不合并:保留 L+R 低音修正(S.mp2)与独立 L/R 立体声修正(S.mpL/S.mpR)
    S.fullL = null; S.fullR = null; S.mpFullL = null; S.mpFullR = null;
    $('btnExportStereo').dataset.exportMode = 'stereoUnmerged';
    log(`立体声分支完成:未执行 Merge，分别保留单声道 L+R 修正 → ${S.mp2.name}；立体声 L/R 修正 → ${S.mpL.name}(左)/ ${S.mpR.name}(右)`,'ok');
  }
  $('btnExport2').style.display='';
  $('btnExportStereo').style.display='';
}

async function arithmeticMerge(uuidA, uuidB, mergeFrequency, suffix){
  const before = await uuidSet();
  const r = await api('/measurements/process-measurements',{method:'POST',body:{
    processName:'Arithmetic',
    measurementUUIDs:[uuidA, uuidB],
    parameters:{'function':'Merge B to A', mergeFrequency}
  }});
  const det = await detectNew(before)(typeof r.message==='string'? r.message : JSON.stringify(r));
  CREATED.push(det.uuid);
  await nameCAL(det, det.name + (suffix||''));
  return det;
}

/* ---------------- ② 低频滚降自动分析 ---------------- */
function medianOf(arr){ if(!arr.length) return NaN; const x=[...arr].sort((p,q)=&gt;p-q); return x[(x.length-1)&gt;&gt;1]; }
async function autoAnalyzeLF(){
  const u = needA();
  const d = await api(`/measurements/${u}/frequency-response?unit=SPL`);
  const bytes = Uint8Array.from(atob(d.magnitude), c=&gt;c.charCodeAt(0));
  const n = bytes.length&gt;&gt;2;
  const f0 = +d.startFreq, ppo = +d.ppo;
  const dv = new DataView(bytes.buffer);
  const freqs=[], mags=[];
  for(let i=0;i&lt;n;i++){
    const v = dv.getFloat32(i*4,false);
    if(!Number.isNaN(v)){ freqs.push(f0*Math.pow(2,i/ppo)); mags.push(v); }
  }
  const M = freqs.length;
  // 1/6 倍频程滑动平均(双指针)
  const sF=new Array(M), sV=new Array(M);
  let a=0, b=0;
  for(let i=0;i&lt;M;i++){
    const lo=freqs[i]*Math.pow(2,-1/12), hi=freqs[i]*Math.pow(2,1/12);
    while(a&lt;M &amp;&amp; freqs[a]&lt;lo) a++;
    if(b&lt;i+1) b=i+1;
    while(b&lt;M &amp;&amp; freqs[b]&lt;=hi) b++;
    let sum=0; for(let k=a;k&lt;b;k++) sum+=mags[k];
    sF[i]=freqs[i]; sV[i]=sum/(b-a);
  }
  const idxOf = f =&gt; Math.max(0, Math.min(M-1, Math.round(Math.log(f/sF[0])/Math.log(2)*ppo)));
  const bandMed = (f1,f2)=&gt;{ const v=[]; for(let i=0;i&lt;M;i++) if(sF[i]&gt;=f1&amp;&amp;sF[i]&lt;=f2) v.push(sV[i]); return v.length? medianOf(v):null; };
  // 中频基准(200-2k 中位数)
  const midv=[]; for(let i=0;i&lt;M;i++) if(sF[i]&gt;=200&amp;&amp;sF[i]&lt;=2000) midv.push(sV[i]);
  const ref = medianOf(midv);
  if(!isFinite(ref)) throw new Error('频响数据不足,无法分析');
  // -3dB 持续滚降点
  let fc = null;
  for(let f=200; f&gt;10; f*=0.99){
    if(sV[idxOf(f)] &lt;= ref-3){
      const bm = bandMed(f*0.5, f);
      if(bm!==null &amp;&amp; bm &lt;= ref-6){ fc=f; break; }
    }
  }
  if(fc===null){
    $('lfInfo').textContent = '未检测到明显的低频滚降(响应在低频段保持接近中频电平),已保留当前截止/斜率设置。';
    log('低频分析:未检测到明显滚降,保持当前设置','err');
    return null;
  }
  const cutoff = Math.round(Math.min(150, Math.max(15, fc)));
  // 干净滚降段(向下遇到回升 3dB 视为噪声接管)
  const pts=[]; let runMin=null;
  const fcMin = Math.max(10, fc*0.2);
  for(let i=idxOf(fc); i&gt;=0; i--){
    const f=sF[i], v=sV[i];
    if(f &lt; fcMin) break;
    if(v &lt;= ref-3){
      if(runMin===null || v&lt;runMin) runMin=v;
      else if(v &gt; runMin+3) break;
      pts.push([f,v]);
    }
  }
  const allowed=[6,12,18,24,30,36,42,48];
  let slopeOut=null, slopeRaw=null, r2=null;
  if(pts.length&gt;=5){
    const N=pts.length;
    let sx=0,sy=0,sxy=0,sx2=0;
    for(const [f,v] of pts){ const x=Math.log2(f); sx+=x; sy+=v; sxy+=x*v; sx2+=x*x; }
    const b=(N*sxy-sx*sy)/(N*sx2-sx*sx);
    const aa=(sy-b*sx)/N;
    const mean=sy/N;
    let sst=0,ssr=0;
    for(const [f,v] of pts){ const yh=aa+b*Math.log2(f); sst+=(v-mean)**2; ssr+=(v-yh)**2; }
    slopeRaw = b;                       // 数据随频率升高而上升,滚降陡度 = b
    r2 = sst&gt;0? 1-ssr/sst : 0;
    slopeOut = allowed.reduce((p,c)=&gt;Math.abs(c-slopeRaw)&lt;Math.abs(p-slopeRaw)?c:p);
  }
  // 填入参数:仅填写用户未手动修改的字段,手动值保持不变
  const lower = cutoff;
  const upper = Math.min(20000, Math.floor((S.A &amp;&amp; S.A.endFreq) || 20000));
  if(!USER_SET.lfCut) $('lfCut').value = cutoff;
  if(slopeOut &amp;&amp; !USER_SET.lfSlope) $('lfSlope').value = String(slopeOut);
  if(!USER_SET.divLower) $('divLower').value = lower;
  if(!USER_SET.divUpper) $('divUpper').value = upper;
  const filled=[], kept=[];
  if(USER_SET.lfCut) kept.push(`截止 ${$('lfCut').value} Hz(手动)`); else filled.push(`截止 ${cutoff} Hz`);
  if(USER_SET.lfSlope) kept.push(`斜率 ${$('lfSlope').value} dB/oct(手动)`); else if(slopeOut) filled.push(`斜率 ${slopeOut} dB/oct`);
  if(USER_SET.divLower) kept.push(`下限 ${$('divLower').value} Hz(手动)`); else filled.push(`下限 ${lower} Hz`);
  if(USER_SET.divUpper) kept.push(`上限 ${$('divUpper').value} Hz(手动)`); else filled.push(`上限 ${upper} Hz`);
  const summary = `低频分析:中频基准 ${ref.toFixed(1)} dB,` +
    (fc? `检测到 -3dB 截止约 ${cutoff} Hz,` : '') +
    (slopeOut? `滚降拟合 ${slopeRaw.toFixed(1)} dB/oct(R²=${r2.toFixed(2)})→ 建议取整 ${slopeOut} dB/oct;` : '拟合点不足,无法拟合斜率;') +
    (filled.length? `已填入:${filled.join('、')};` : '') +
    (kept.length? `保留用户手动设置:${kept.join('、')}。` : '全部参数按分析结果填入。');
  $('lfInfo').textContent = summary;
  log('低频分析完成:'+summary,'ok');
  return {cutoff, slope: slopeOut, lower, upper};
}

async function fetchIRData(uuid){
  const ir = await api(`/measurements/${uuid}/impulse-response?samplerate=${$('sr').value}&amp;windowed=${$('applyWin').checked}&amp;normalised=false`);
  const bytes = Uint8Array.from(atob(ir.data), c=&gt;c.charCodeAt(0));
  const n = bytes.length&gt;&gt;2;
  const f = new DataView(bytes.buffer);
  let peak=0, peakIdx=0;
  const samples = new Float32Array(n);
  for(let i=0;i&lt;n;i++){ const v=f.getFloat32(i*4,false); samples[i]=v; const a=Math.abs(v); if(a&gt;peak){ peak=a; peakIdx=i; } }
  return {samples, n, peak, peakIdx, sampleRate:+ir.sampleRate, startTime:+ir.startTime};
}
function updateExportPreview(){
  if(!irCache) return;
  const cw = $('clipWarn');
  if(irCache.mode==='stereo' || irCache.mode==='stereoUnmerged'){
    const {L,R} = irCache;
    const start = Math.min(L.peakIdx, R.peakIdx);
    const dur = ((Math.max(L.n,R.n)-start)/L.sampleRate).toFixed(2);
    const label = irCache.mode==='stereoUnmerged' ? '立体声 L/R 2ch' : '立体声 2ch';
    $('dlPreview').textContent = `将下载:${exportFileName()} | ${label} / ${dur}s @ ${Math.round(L.sampleRate)}Hz(已从峰值起裁剪,去除 ${((start/L.sampleRate)*1000).toFixed(1)} ms 空白)| L 峰值 ${L.peak.toFixed(3)} | R 峰值 ${R.peak.toFixed(3)}`;
    const maxPeak = Math.max(L.peak, R.peak);
    if($('bits').value!=='32' &amp;&amp; maxPeak&gt;1){
      cw.style.display='block';
      cw.textContent = `⚠ 峰值 ${maxPeak.toFixed(2)} 超出整型满幅,${$('bits').value}-bit 导出将削波。建议使用 32-bit float,或加大 maxGain/频段限制。`;
    } else cw.style.display='none';
  } else {
    const c = irCache.mono;
    const dur = ((c.n-c.peakIdx)/c.sampleRate).toFixed(2);
    $('dlPreview').textContent = `将下载:${exportFileName()} | ${c.n-c.peakIdx} 样本 / ${dur}s @ ${Math.round(c.sampleRate)}Hz(已从峰值起裁剪,去除 ${(c.peakIdx/c.sampleRate*1000).toFixed(1)} ms 空白)| 峰值 ${c.peak.toFixed(3)}`;

    } else cw.style.display='none';
  }
}

async function doExport(){
  if(EXPORT.mode==='stereo'){ if(!S.mpFullL || !S.mpFullR) throw new Error('立体声结果不存在,请先执行完整流程'); }
  else if(EXPORT.mode==='stereoUnmerged'){ if(!S.mpL || !S.mpR) throw new Error('未合并的 L/R 立体声结果不存在,请先执行完整流程'); }
  else if(!S.mp2) throw new Error('请先执行步骤 7 生成结果的最小相位副本');
  const fname = exportFileName();
  if(!irCache || irCache.key!==exportKey()) await fetchIRForModal();
  const bits = $('bits').value;
  let wav, infoTxt;
  if(EXPORT.mode==='stereo' || EXPORT.mode==='stereoUnmerged'){
    const {L,R} = irCache;
    // 两声道用同一裁剪点(较早的峰值),保持左右时间一致
    const start = Math.min(L.peakIdx, R.peakIdx);
    const N = Math.max(L.n, R.n) - start;
    const Lp = new Float32Array(N); Lp.set(L.samples.subarray(start, start+N));
    const Rp = new Float32Array(N); Rp.set(R.samples.subarray(start, start+N));
    wav = buildWav(Lp, +bits, Rp);
    infoTxt = `${EXPORT.mode==='stereoUnmerged'?'立体声 L/R':'立体声 2ch'} | L 峰值 ${L.peak.toFixed(3)} | R 峰值 ${R.peak.toFixed(3)} | ${N} 样本 / ${(N/L.sampleRate).toFixed(2)}s @ ${Math.round(L.sampleRate)}Hz | 已裁剪峰值前空白`;
  } else {
    const c = irCache.mono;
    const t = c.samples.subarray(c.peakIdx);
    wav = buildWav(t, +bits);
    infoTxt = `${t.length} 样本 / ${(t.length/c.sampleRate).toFixed(2)}s @ ${Math.round(c.sampleRate)}Hz | 峰值 ${c.peak.toFixed(3)} | 已裁剪峰值前空白 ${(c.peakIdx/c.sampleRate*1000).toFixed(1)} ms`;
  }
  const url = URL.createObjectURL(new Blob([wav], {type:'audio/wav'}));
  const aEl = document.createElement('a');
  aEl.href=url; aEl.download=fname; aEl.click();
  setTimeout(()=&gt;URL.revokeObjectURL(url), 4000);
  $('wavRow').style.display='';
  $('wavPill').innerHTML = `&lt;b&gt;${esc(fname)}&lt;/b&gt; | ${infoTxt}`;
  log(`WAV 已生成并下载: ${fname} (${wav.byteLength} 字节)`,'ok');
  if($('alsoTxt').checked){
    const base = fname.replace(/\.wav$/i,'');
    await exportTxtCurves(base);
  }

  // 未合并立体声模式需要保留另一组结果，避免导出第一组后清理导致第二组无法导出。
  if(stereoMerged){
    askCleanup();
  }else{
    if(EXPORT.mode==='stereoUnmerged') unmergedExported.stereo=true;
    else if(EXPORT.mode==='mono') unmergedExported.mono=true;
    if(unmergedExported.mono &amp;&amp; unmergedExported.stereo) askCleanup();
    else log('未合并模式：另一组 IR 尚未导出，暂不清理本次运算数据','cmd');
  }
}

/* ---- 下载完成后:询问是否删除本次运算产生的 CAL_ 测量 ---- */
function askCleanup(){
  if(!CREATED.length) return;
  const names = CREATED.map(u=&gt;{ const m=(LAST_LIST||[]).find(x=&gt;x.uuid===u); return m? m.title : null; }).filter(Boolean);
  $('cuText').textContent = `本次流程共产生 ${CREATED.length} 个 CAL_ 前缀的运算测量` +
    (names.length? `:${names.slice(0,4).map(esc).join('、')}${names.length&gt;4? ' 等':''}`:'') +
    '。是否删除这些额外数据?原始测量不会受影响。';
  $('cleanupModal').classList.add('show');
  $('cleanupModal').setAttribute('aria-hidden','false');
}
function closeCleanupModal(){
  $('cleanupModal').classList.remove('show');
  $('cleanupModal').setAttribute('aria-hidden','true');

}
$('cuConfirm').onclick = guard(async ()=&gt;{

/* ---- txt 修正曲线导出(REW 文本格式:频率/声压级/相位) ---- */
async function fetchFR(uuid){
  const d = await api(`/measurements/${uuid}/frequency-response?unit=SPL`);
  const mb = Uint8Array.from(atob(d.magnitude), c=&gt;c.charCodeAt(0));
  const pb = Uint8Array.from(atob(d.phase), c=&gt;c.charCodeAt(0));
  const n = mb.length&gt;&gt;2;
  const mdv = new DataView(mb.buffer), pdv = new DataView(pb.buffer);
  const f0 = +d.startFreq, ppo = +d.ppo;
  const rows = [];
  for(let i=0;i&lt;n;i++){
    const f = f0*Math.pow(2,i/ppo);
    const m = mdv.getFloat32(i*4,false), p = pdv.getFloat32(i*4,false);
    if(!Number.isNaN(m) &amp;&amp; !Number.isNaN(p)) rows.push([f,m,p]);
  }
  return rows;
}
function frToTxt(rows){
  let t = 'Frequency (Hz)\tSPL (dB)\tPhase (deg)\n';
  for(const [f,m,p] of rows) t += `${f.toFixed(4)}\t${m.toFixed(2)}\t${p.toFixed(2)}\n`;
  return t;
}
function downloadText(name, text){
  const url = URL.createObjectURL(new Blob([text], {type:'text/plain'}));
  const aEl = document.createElement('a');
  aEl.href=url; aEl.download=name; aEl.click();
  setTimeout(()=&gt;URL.revokeObjectURL(url), 4000);
}
async function exportTxtCurves(fnameBase){
  if(EXPORT.mode==='stereo' || EXPORT.mode==='stereoUnmerged'){
    const lUuid = EXPORT.mode==='stereo' ? S.mpFullL.uuid : S.mpL.uuid;
    const rUuid = EXPORT.mode==='stereo' ? S.mpFullR.uuid : S.mpR.uuid;
    downloadText(fnameBase+' (L).txt', frToTxt(await fetchFR(lUuid)));
    downloadText(fnameBase+' (R).txt', frToTxt(await fetchFR(rUuid)));
    log('已同时导出 txt 修正曲线(L/R 两份)','ok');
  } else {
    downloadText(fnameBase+'.txt', frToTxt(await fetchFR(S.mp2.uuid)));
    log('已同时导出 txt 修正曲线','ok');
  }
}

function buildWav(samples, bits, samplesR){
  const stereo = !!samplesR;
  let L = samples, R = samplesR;
  const n0 = stereo? Math.max(L.length, R.length) : L.length;
  if(stereo &amp;&amp; (L.length!==n0 || R.length!==n0)){
    const La=new Float32Array(n0); La.set(L); L=La;
    const Ra=new Float32Array(n0); Ra.set(R); R=Ra;
  }
  const n = n0, ch = stereo? 2 : 1;
  const isFloat = bits===32, bytesPer = bits&gt;&gt;3;
  const dataSize = n*bytesPer*ch, buf = new ArrayBuffer(44+dataSize), v = new DataView(buf);
  const ws=(o,s)=&gt;{for(let i=0;i&lt;s.length;i++)v.setUint8(o+i,s.charCodeAt(i));};
  ws(0,'RIFF'); v.setUint32(4,36+dataSize,true); ws(8,'WAVE');
  ws(12,'fmt '); v.setUint32(16,16,true); v.setUint16(20,isFloat?3:1,true); v.setUint16(22,ch,true);
  v.setUint32(24,parseInt($('sr').value,10),true); v.setUint32(28,parseInt($('sr').value,10)*ch*bytesPer,true);
  v.setUint16(32,ch*bytesPer,true); v.setUint16(34,bits,true);
  ws(36,'data'); v.setUint32(40,dataSize,true);
  let o=44;
  const wr = val=&gt;{
    if(isFloat){ v.setFloat32(o,val,true); o+=4; }
    else if(bits===16){ v.setInt16(o,Math.round(Math.max(-1,Math.min(1,val))*32767),true); o+=2; }
    else { const x=Math.round(Math.max(-1,Math.min(1,val))*8388607); v.setUint8(o,x&amp;255); v.setUint8(o+1,(x&gt;&gt;8)&amp;255); v.setUint8(o+2,(x&gt;&gt;16)&amp;255); o+=3; }
  };
  for(let i=0;i&lt;n;i++){ wr(L[i]); if(stereo) wr(R[i]); }
  return buf;
}

/* ---------------- 一键流程 ---------------- */
$('btnClear').onclick = ()=&gt;{ $('log').innerHTML=''; log('日志已清空'); };

function askMergeChoice(){
  if(!isStereo()) return Promise.resolve(true);
  return new Promise(resolve=&gt;{
    const modal=$('mergeChoiceModal');
    const yes=$('mergeChoiceYes');
    const no=$('mergeChoiceNo');
    const finish=value=&gt;{
      modal.classList.remove('show');
      modal.setAttribute('aria-hidden','true');
      yes.onclick=null; no.onclick=null;
      resolve(value);
      if(value===false){
        // 选择“不合并 IR”后，将 REW 自动化处理页面滚动到最底部，
        // 方便用户直接看到步骤 7 的两个独立导出按钮。
        requestAnimationFrame(()=&gt;{
          requestAnimationFrame(()=&gt;{
            window.scrollTo({top:document.documentElement.scrollHeight,behavior:'smooth'});
            document.body.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});
          });
        });
      }
    };
    yes.onclick=()=&gt;finish(true);
    no.onclick=()=&gt;finish(false);
    modal.classList.add('show');
    modal.setAttribute('aria-hidden','false');
  });
}

$('btnRunAll').onclick = guard(async ()=&gt;{
  if(!S.A) throw new Error('没有可处理的测量数据');

  const stereoMode = isStereo();
  let mergeIR = true;

  $('btnRunAll').disabled = true;
  flowRunning = true;
  if(window.parent !== window){ try{ window.parent.postMessage({type:'koyaka-flow', running:true}, '*'); }catch(e){} }

  if(stereoMode){
    mergeIR = await askMergeChoice();
    log(mergeIR ? '已选择:合并 IR，将按原立体声流程执行' : '已选择:不合并 IR，将分别生成 L+R 与 L/R 修正','cmd');
  }

  let origInhibit = false;
  try{ const v = await api('/application/inhibit-graph-updates'); if(typeof v==='boolean') origInhibit = v; }catch{}
  try{
    await api('/application/inhibit-graph-updates',{method:'POST',body:true});
    if(!$('blocking').checked){ await setBlocking(true); }
    await autoAnalyzeLF();
    await applyTarget();
    await calcLevel();
    await genTarget();
    await makeAM();
    await doArith();
    await makeMP2();

    if(stereoMode){
      log('立体声模式:执行 L/R 分支','ok');
      await runStereoBranch(mergeIR);
      $('btnExport2').textContent = '导出单声道 L+R…';
      $('btnExportStereo').textContent = '导出立体声 L/R…';
    }

    await loadMeasurements();

    if(stereoMode &amp;&amp; mergeIR){
      log('完整流程(含立体声合并)执行完毕,自动弹出立体声导出窗口','ok');
      openExportModal('stereo');
    }else if(stereoMode){
      log('完整流程(未合并 IR)执行完毕,请在步骤 7 分别导出单声道 L+R 与立体声 L/R','ok');
    }else{
      log('完整流程执行完毕,自动弹出导出窗口','ok');
      openExportModal('mono');
    }
  } finally {
    try{ await api('/application/inhibit-graph-updates',{method:'POST',body:origInhibit}); }catch{}
    if(!$('blocking').checked){ try{ await setBlocking(false); }catch{} }
    $('btnRunAll').disabled = false;
    flowRunning = false;
    if(window.parent !== window){ try{ window.parent.postMessage({type:'koyaka-flow', running:false}, '*'); }catch(e){} }
  }
});

/* guard: 统一错误处理 */
function guard(fn){ return async ()=&gt;{ try{ await fn(); }catch(e){ log('✗ '+e.message,'err'); alert('操作失败:\n'+e.message); } }; }

/* ---- REW 模块激活期间:每 3 秒自动刷新连接状态与测量列表 ---- */
function isModuleActive(){
  if(window.parent === window) return true;             // 独立打开时始终轮询
  try{ const fe = window.frameElement; return !!(fe &amp;&amp; fe.classList.contains('active')); }catch(e){ return false; }
}
async function pollOnce(){
  if(!isModuleActive() || flowRunning) return;
  try{
    const v = await api('/version',{quiet:true});
    const ver = (v &amp;&amp; v.message) || '';
    closeConnFailModal();   // 连接正常时,若断连提示弹窗仍开着则自动关闭
    if($('connStatus').textContent !== '已连接&gt;w&lt;'){
      setConn('已连接&gt;w&lt;','ok');
      $('verPill').style.display=''; $('verPill').textContent = ver;
      log('REW 已连接','ok');
    } else if(ver !== lastVer){ $('verPill').textContent = ver; }
    lastVer = ver;
    const list = await listMeasurements(true);
    const key = JSON.stringify(list.map(x=&gt;[x.uuid,x.title,x.idx]));
    if(key !== lastListKey) await loadMeasurements();   // 列表有变化才刷新下拉
  }catch(e){
    // 使用过程中连接断开:与手动连接失败一样弹出提示(已弹出则不重复)
    if($('connStatus').textContent === '已连接&gt;w&lt;'){ setConn('连接失败','err'); log('与 REW 失去连接','err'); }
    showConnFailModal();
  }
}
setInterval(pollOnce, 3000);

/* 页面加载即尝试连接 */
connect();

<script>
(function(){
  const buttons = document.querySelectorAll('.nav-btn');
  const frames = {
    tone: document.getElementById('frame-tone'),
    sweep: document.getElementById('frame-sweep'),
    noise: document.getElementById('frame-noise'),
    rew: document.getElementById('frame-rew')
  };
  const themeSelect = document.getElementById('globalThemeSelect');

  function applyTheme(theme){
    document.body.classList.toggle('theme-light', theme === 'light');
    themeSelect.value = theme;
    localStorage.setItem('koyakaCalTheme', theme);

    Object.values(frames).forEach(frame => {
      frame.contentWindow?.postMessage(
        { type:'test-osc-theme', theme },
        '*'
      );
    });
  }

  function initTheme(){
    const theme = localStorage.getItem('koyakaCalTheme') || 'dark';
    applyTheme(theme);
  }

  themeSelect.addEventListener('change', () => {
    applyTheme(themeSelect.value);
  });

  Object.values(frames).forEach(frame => {
    frame.addEventListener('load', () => {
      applyTheme(themeSelect.value);
    });
  });

  let flowLocked = false;
  window.addEventListener('message', e=>{
    const d = e.data || {};
    if(d.type==='koyaka-flow') flowLocked = !!d.running;
  });
  function flashLocked(btn){
    if(!btn) return;
    btn.classList.add('flow-locked');
    setTimeout(()=>btn.classList.remove('flow-locked'), 900);
  }
  function openModule(target, srcBtn){
    if(flowLocked){ flashLocked(srcBtn); return; }
    // 懒加载:首次激活某模块时才注入其 srcdoc(iframe 此时已可见,避免隐藏状态下加载/渲染失败)
    Object.values(frames).forEach(frame => {
      if(frame.dataset.srcdoc && !frame.getAttribute('srcdoc')) frame.srcdoc = frame.dataset.srcdoc;
    });

    // 切换功能页前，终止所有功能页正在播放的音频。
    Object.values(frames).forEach(frame => {
      frame.contentWindow?.postMessage({ type:'test-osc-stop' }, '*');
    });

    buttons.forEach(b => b.classList.toggle('active', b.dataset.target === target));
    Object.entries(frames).forEach(([key, frame]) => {
      frame.classList.toggle('active', key === target);
    });

    // 离开主页,进入原有布局
    document.getElementById('homeScreen').classList.add('hidden');
    document.getElementById('appScreen').style.display = '';
  }

  function goHome(){
    if(flowLocked) return;   // 流程执行中禁止返回主页
    Object.values(frames).forEach(frame => {
      frame.contentWindow?.postMessage({ type:'test-osc-stop' }, '*');
      frame.classList.remove('active');
    });
    buttons.forEach(b => b.classList.remove('active'));
    document.getElementById('appScreen').style.display = 'none';
    document.getElementById('homeScreen').classList.remove('hidden');
  }

  buttons.forEach(btn => {
    btn.addEventListener('click', () => openModule(btn.dataset.target, btn));
  });

  // 主页田字格按钮
  document.querySelectorAll('.home-btn').forEach(btn => {
    btn.addEventListener('click', () => openModule(btn.dataset.target, btn));
  });

  // 点击侧边栏品牌返回主页
  document.querySelector('.brand').addEventListener('click', goHome);
  document.querySelector('.brand').style.cursor = 'pointer';
  document.querySelector('.brand').title = '返回主页';

  initTheme();
})();
</script>
